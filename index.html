<style>
:root{
  --paper:#eef1f0; --card:#ffffff; --sunk:#e4e9e7; --ink:#16211f; --muted:#56645f; --line:#d2d9d7;
  --signal:#f5c400; --signal-ink:#16211f; --action:#16211f; --action-ink:#ffffff;
  --ok:#1e7f4a; --okbg:#dff1e6; --warn:#945300; --warnbg:#fbecd0; --bad:#b3372a; --badbg:#fae3df;
  --move:#2a5a8c; --movebg:#e1ebf6; --count:#6a4c9e; --countbg:#ece6f6;
  --stripe-a:#f5c400; --stripe-b:#16211f; --focus:#2a5a8c;
  --shadow:0 1px 2px rgba(22,33,31,.06),0 6px 18px rgba(22,33,31,.07);
  --sans:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  --zh:'Noto Sans SC','PingFang SC','Microsoft YaHei','Be Vietnam Pro',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1513; --card:#182120; --sunk:#121a18; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2c3734;
    --action:#e5ebe9; --action-ink:#0f1513;
    --ok:#62cc90; --okbg:#173325; --warn:#f0b454; --warnbg:#3a2b12; --bad:#f28a7b; --badbg:#3d1c18;
    --move:#86b5e8; --movebg:#1a2a3b; --count:#bba0ea; --countbg:#2a2140; --focus:#86b5e8;
    --shadow:0 1px 0 rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1513; --card:#182120; --sunk:#121a18; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2c3734;
  --action:#e5ebe9; --action-ink:#0f1513;
  --ok:#62cc90; --okbg:#173325; --warn:#f0b454; --warnbg:#3a2b12; --bad:#f28a7b; --badbg:#3d1c18;
  --move:#86b5e8; --movebg:#1a2a3b; --count:#bba0ea; --countbg:#2a2140; --focus:#86b5e8;
  --shadow:0 1px 0 rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%}
/* Chạm nhanh hoặc chạm lệch không làm phóng to màn hình */
html,body{touch-action:manipulation}
button,.keypad,.tiles,.acts,.chip,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* iPhone: ô nhập luôn chạm và gõ được (tránh lỗi ô "chết" của web app ngoài màn hình chính) */
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:auto}
@supports (-webkit-touch-callout:none){.inp,.search-box input,.scan-tools .inp{transform:translateZ(0)}}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.zh,[lang="zh-CN"]{font-family:var(--zh)}
/* Song ngữ: chữ Trung đi kèm chữ Việt */
.zi{margin-left:.4em;font-weight:500;opacity:.72}
.tile .zi,.act .zi,.pin-label .zi,.toast .zi,.pin-msg .zi,.scan-msg .zi,.help .zi,.note .zi,.empty .zi,.sheet h3 .zi,.seg .zi{display:block;margin-left:0}
.tile .zi{font-size:12.5px;margin-top:1px}
.act .zi{font-size:11px}
.sheet h3 .zi{font-size:15px;margin-top:2px}
h2.sec .zi{text-transform:none;letter-spacing:0}
.qty .pill{white-space:normal;text-align:right;justify-content:flex-end;flex-wrap:wrap}
.nm2[lang="zh-CN"],.zs{font-family:var(--zh)}
.mono{font-family:var(--mono)}
.ic{width:22px;height:22px;flex:none}

/* Thanh trên cùng */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:56px}
.bar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.bar-title b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--sunk)}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)}
.busy{position:absolute;left:0;right:0;bottom:-3px;height:3px;overflow:hidden}
.busy::after{content:"";position:absolute;inset:0;width:35%;background:var(--signal);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.demo{max-width:620px;margin:10px auto 0;padding-inline:16px}
.demo p{margin:0;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:12.5px;color:var(--muted)}
.demo b{color:var(--ink)}

.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.count{font-family:var(--mono);font-size:12px;background:var(--sunk);color:var(--ink);border-radius:20px;padding:0 8px;letter-spacing:0}
.empty{color:var(--muted);margin:8px 0;font-size:14px}
.muted{color:var(--muted)}

/* Biển mã: mã vật tư viền đen, mã vị trí nền vàng như nhãn kệ */
.plate{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.02em;line-height:1.5;border:1.5px solid var(--ink);border-radius:3px;padding:0 5px;background:var(--card);color:var(--ink);white-space:nowrap}
.plate.loc{background:var(--signal);border-color:var(--signal-ink);color:var(--signal-ink)}
.plate.big{font-size:15px;padding:1px 8px}
.plate.huge{font-size:24px;padding:2px 10px;border-width:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:1px 9px;white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.grey{background:var(--sunk);color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.b-nhap{background:var(--okbg);color:var(--ok)}
.b-xuat{background:var(--badbg);color:var(--bad)}
.b-chuyen{background:var(--movebg);color:var(--move)}
.b-kiemke{background:var(--countbg);color:var(--count)}
.b-muon{background:var(--movebg);color:var(--move)}
.b-tra{background:var(--okbg);color:var(--ok)}
.b-mat{background:var(--badbg);color:var(--bad)}
.pill.move{background:var(--movebg);color:var(--move)}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.who .ic{width:15px;height:15px;color:var(--muted)}

/* Đăng nhập */
.login{max-width:360px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.brand{text-align:center;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:28px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--zh);font-size:17px;color:var(--muted);letter-spacing:.2em}
.brand-mark{margin:0 auto 10px;width:88px;height:88px}
.brand-mark svg,.bar-logo svg{display:block;width:100%;height:100%}
.bar-logo{width:40px;height:40px;flex:none;margin-left:2px;padding:2px;border:0;background:none;border-radius:10px;cursor:pointer}
.bar-logo:active{opacity:.6}
.pin-label{font-weight:600;margin-top:8px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pin-msg{min-height:20px;margin:0;color:var(--bad);font-size:13.5px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.key{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;font-family:var(--mono);box-shadow:var(--shadow)}
.key:active{background:var(--sunk)}
.key.ghost{background:transparent;border-color:transparent;box-shadow:none;font-family:var(--sans);font-size:14px}
.hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12.5px}
.hint{border:1px dashed var(--line);border-radius:8px;padding:4px 8px;background:transparent;color:var(--muted)}
.hint b{font-family:var(--mono);color:var(--ink)}

/* Trang chủ */
.search{display:flex;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;background:var(--paper);padding-block:4px 8px;margin-top:-4px}
.search-box{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:50px}
.search-box:focus-within{border-color:var(--ink)}
.search-box input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;height:100%}
.search-box .ic{color:var(--muted)}
.scan-btn{flex:none;display:flex;align-items:center;gap:6px;height:50px;padding:0 14px;border-radius:12px;border:2px solid var(--signal-ink);background:var(--signal);color:var(--signal-ink);font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 14px;font-size:13.5px;color:var(--muted)}
.stats b{font-family:var(--mono);color:var(--ink);font-size:15px}
.stats .w b{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;font-size:13.5px;font-weight:600;line-height:1.25;min-height:84px}
.tile:active{background:var(--sunk)}
.tile .ic{width:24px;height:24px}
.tile.t-nhap .ic{color:var(--ok)}
.tile.t-xuat .ic{color:var(--bad)}
.tile.t-chuyen .ic{color:var(--move)}
.tile.t-kiemke .ic{color:var(--count)}
.tile{position:relative}
.tile.t-muon .ic{color:var(--move)}
.tile-badge{position:absolute;top:9px;right:9px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--movebg);color:var(--move);font:700 12px/22px var(--mono);text-align:center}
.tile-badge.late{background:var(--bad);color:#fff}

/* Danh sách */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent}
.row:last-child{border-bottom:0}
button.row:active{background:var(--sunk)}
button.row:disabled{opacity:.55}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:600;line-height:1.3}
.nm2{color:var(--muted);font-size:13.5px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.qty{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:1px}
.qty b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.qty small{font-size:12px;color:var(--muted)}
.qty.low b{color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding-inline:16px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--action);color:var(--action-ink);border-color:var(--action)}

/* Chi tiết */
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.head .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px;margin-top:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.total .lbl2{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.total .num{font-family:var(--mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.total .num small{font-family:var(--sans);font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.total.low .num{color:var(--warn)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.act.a-nhap .ic{color:var(--ok)} .act.a-xuat .ic{color:var(--bad)} .act.a-chuyen .ic{color:var(--move)} .act.a-kiemke .ic{color:var(--count)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.btn:active{background:var(--sunk)}
.btn.primary{background:var(--action);color:var(--action-ink);border-color:var(--action);height:52px;width:100%;font-size:16px}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal-ink)}
.btn.small{height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn .ic{width:20px;height:20px}
.log-item{display:flex;flex-direction:column;gap:4px;padding:11px 14px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.log-q{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.log-q.neg{color:var(--bad)} .log-q.pos{color:var(--ok)}
.log-sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}

/* Biểu mẫu */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-weight:600;font-size:14px}
.field .help{font-size:12.5px;color:var(--muted);margin:0}
.req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px;outline:0}
textarea.inp{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--ink)}
.inp.code{font-family:var(--mono);text-transform:uppercase}
.with-btn{display:flex;gap:8px}
.with-btn .inp{flex:1;min-width:0}
.with-btn .sq{flex:none;width:48px;height:48px;border-radius:10px;border:2px solid var(--signal-ink);background:var(--signal);color:var(--signal-ink);display:grid;place-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.four .inp{text-align:center;font-family:var(--mono);text-transform:uppercase;padding:0 4px}
.picked{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card)}
.picker-res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;max-height:340px;overflow-y:auto}
.hintline{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.hintline b{font-family:var(--mono);color:var(--ink)}
.diff-neg{color:var(--bad)} .diff-pos{color:var(--ok)}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.radio:has(input:checked){border-color:var(--ink)}
.radio input{margin-top:3px;accent-color:var(--ink);width:18px;height:18px}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.preview-code{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.box{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.box-title{font-weight:600;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip{padding:6px 12px}
.inp[type=date]{-webkit-appearance:none;appearance:none;display:flex;align-items:center;line-height:44px;min-width:0}
.inp[type=date]::-webkit-date-and-time-value{text-align:left}
.okbox{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--okbg);border:1px solid var(--ok)}
.okbox>b{color:var(--ok)}
.okline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px}
.okbox .help{margin:0;font-size:12.5px;color:var(--muted)}
.okbox .btn{align-self:flex-start}
.btn.full{width:100%}
.hist-lines{display:flex;flex-direction:column;gap:4px}
/* Nút hai dòng: chữ Việt trên, chữ Trung dưới */
.btn.tall{height:auto;min-height:56px;padding:8px 12px;justify-content:flex-start;gap:10px}
.bl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.bl .zi{margin-left:0;font-size:12.5px}
.seg.three{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.seg.three button{font-size:14px;padding:6px 2px}
.seg.three button+button{border-left:1.5px solid var(--ink)}
.seg .count{margin-left:4px}
.seg button[aria-pressed="true"] .count{background:var(--signal);color:var(--signal-ink)}
.facts.loan{grid-template-columns:minmax(92px,36%) 1fr}
.facts.loan dt .zi{display:block;margin-left:0;font-size:12.5px}

/* Phiếu đề xuất */
.tile.t-req .ic{color:var(--warn)}
.tile-badge.mine{background:var(--signal);color:var(--signal-ink);box-shadow:0 0 0 1.5px var(--signal-ink)}
.rq-line{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rq-line:last-child{border-bottom:0}
.rq-q{width:96px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:center}
.rq-q .inp{height:44px;text-align:center;padding:0 6px}
.rq-q small{font-size:11.5px;color:var(--muted);line-height:1.2}
.rq-q small .zi{display:block;margin-left:0}
.rq-line .icon-btn{flex:none;color:var(--muted)}
.trio{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--muted)}
.trio b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.iss{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.iss .two{grid-template-columns:1fr 104px}
.iss .inp.mono{text-align:center}
.iss.done{opacity:.7}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;height:52px;white-space:nowrap;padding:0 12px}
.btn-row .btn.primary{flex:1.6;width:auto}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lich{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
.sheet .inp{margin:0}
.toast .tq{display:block;margin-top:6px;font-size:13px;opacity:.9}

/* Mạng yếu: thanh trạng thái, hàng chờ gửi */
.netbar{max-width:620px;margin:10px auto 0;padding-inline:16px}
.netbar button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;line-height:1.3}
.netbar button.off{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.netbar button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.netbar .ic{width:22px;height:22px}
.nb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nb-main small{font-size:12px;opacity:.9}
.nb-go{flex:none;font-weight:700;font-size:12.5px;text-decoration:underline}
.pill.pend{background:var(--sunk);color:var(--muted);border:1px dashed var(--muted)}

/* Tem */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);min-height:48px;padding:4px 6px;font-weight:600;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--action);color:var(--action-ink)}
.sel-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sel-row:last-child{border-bottom:0}
.sel-row input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.stepper button{width:38px;height:38px;border:0;background:transparent;font-size:18px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-family:var(--mono);font-weight:700}
.lbl-preview{display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;padding:10px;background:var(--sunk);border-radius:12px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn)}

/* Tem in (kích thước thật) */
.lbl{width:70mm;height:37mm;max-width:100%;flex:none;padding:2.5mm 3mm;display:flex;gap:2.5mm;align-items:center;overflow:hidden;background:#fff;color:#000;font-family:'Be Vietnam Pro','Noto Sans SC',sans-serif;border-radius:2px}
.lbl-qr{width:27mm;height:27mm;flex:none}
.lbl-qr svg{width:100%;height:100%;display:block}
.lbl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6mm}
.lbl-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10.5pt;line-height:1.1}
.lbl-vi{font-size:7.5pt;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl-zh{font-size:7.5pt;line-height:1.2;font-family:'Noto Sans SC',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl-spec{font-size:6.5pt;color:#333}
.lbl.loc .lbl-code{font-size:14pt;background:#f5c400;padding:0 1.2mm;border:.4mm solid #000;align-self:flex-start}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .page{width:210mm;height:297mm;padding:.5mm 0 0;display:grid;grid-template-columns:repeat(3,70mm);grid-auto-rows:37mm;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .lbl{border-radius:0}
}

/* Lớp phủ: bảng dưới, máy quét, thông báo */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow-y:auto}
.sheet h3{margin:0;font-size:18px}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
.sheet .btn{width:100%}
.scanner{position:fixed;inset:0;z-index:60;background:#0b100f;color:#eef1f0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));gap:12px;overflow-y:auto;color-scheme:dark}
.scan-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scan-top b{font-size:17px}
.scan-top .icon-btn{color:#eef1f0}
.reader{width:100%;max-width:440px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;min-height:220px}
.reader video{width:100%!important;display:block}
.scan-msg{text-align:center;margin:0;color:#c9d2cf;font-size:14px;min-height:20px}
.scan-tools{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.scan-tools .btn{width:100%;background:#f5c400;color:#16211f;border-color:#16211f;height:50px}
.scan-tools form{display:flex;gap:8px}
.scan-tools .inp{background:#182120;border-color:#2c3734;color:#eef1f0;font-family:var(--mono);text-transform:uppercase}
.scan-tools .ok-btn{flex:none;width:64px;height:48px;border-radius:10px;border:0;background:#eef1f0;color:#16211f;font-weight:700}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:var(--action);color:var(--action-ink);font-weight:500;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
/* Bản 1.3: quản trị, báo tin, nhập Excel, báo cáo, ảnh */
p.help{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 12px}
.form .card{margin:0}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0;font-size:15.5px;font-weight:700;line-height:1.3}
.card-h .ic{color:var(--muted)}
.card-h .zi{font-weight:500;margin-left:0}
.card p{margin:0}
.card .btn.primary{height:50px}
.okcard{border-color:var(--ok)}
.okcard .card-h .ic{color:var(--ok)}
.kv{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.steps,.who-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4}
.steps .zi,.who-list .zi{display:block;margin-left:0;font-size:12.5px}
.check span .zi{display:block;margin-left:0;font-weight:500;font-size:12.5px}
.check{align-items:flex-start}
.check input{flex:none;margin-top:1px}
.picked-chat{padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.grey{background:var(--sunk);color:var(--muted)}
.file-btn{position:relative;cursor:pointer}
.xls-sum{display:flex;flex-wrap:wrap;gap:6px}
.xls-sum .pill{font-size:13px;padding:3px 10px}
.xls-sum b{font-family:var(--mono);margin-left:2px}
.xls-sum .zi{margin-left:.3em}
.pill.wrap{white-space:normal;flex-wrap:wrap}
.err-list .nm2{color:var(--bad)}
.err-list .nm2 .zi{display:block;margin-left:0}
.row .help .zi{display:block;margin-left:0}
.tile.t-rp .ic{color:var(--move)}
.tile.t-admin .ic{color:var(--muted)}
.rp-lan{white-space:nowrap}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
h2.sec.ct{text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--ink)}
.thumb{flex:none;width:46px;height:46px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.broken{display:none}
.photo{display:grid;place-items:center;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);margin:0 0 12px;height:min(46vw,200px);position:relative}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo.big{height:auto;min-height:200px;background:#000;margin:0}
.photo-big{max-height:68vh}
.photo-err{display:none;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.photo.broken img{display:none}
.photo.broken .photo-err{display:block}
.rp-print{display:none}
@media print{
  #printArea .rp-print{display:block;font-family:'Be Vietnam Pro','Noto Sans SC',sans-serif;color:#000;font-size:9.5pt;line-height:1.35}
  .rp-print h1{font-size:14pt;margin:0 0 1.5mm}
  .rp-print p{margin:0 0 3mm}
  .rp-print .z{font-family:'Noto Sans SC',sans-serif;color:#444;font-weight:400}

// Được ghép trước Code.gs trong một hàm bao, nên Code.gs chạy y hệt trên máy chủ thật.
function __sha256Bytes(str) {
  const frac = x => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
  const primes = [];
  for (let n = 2; primes.length < 64; n++) { if (primes.every(p => n % p)) primes.push(n); }
  const K = primes.map(p => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const data = new TextEncoder().encode(str);
  const len = data.length;
  const total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(data); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  const bits = len * 8;
  dv.setUint32(total - 8, Math.floor(bits / 4294967296));
  dv.setUint32(total - 4, bits >>> 0);
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  const W = new Uint32Array(64);
  for (let i = 0; i < total; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = ror(W[t - 15], 7) ^ ror(W[t - 15], 18) ^ (W[t - 15] >>> 3);
      const s1 = ror(W[t - 2], 17) ^ ror(W[t - 2], 19) ^ (W[t - 2] >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + W[t]) | 0;
      const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x >>> 0);
  }
  const out = [];
  H.forEach(w => { for (let s = 24; s >= 0; s -= 8) { const byte = (w >>> s) & 255; out.push(byte > 127 ? byte - 256 : byte); } });
  return out;
}

function __makeSheet(name) {
  const rows = [];
  let maxRows = 1000;
  const sheet = {
    getName: () => name,
    getLastRow() {
      for (let i = rows.length - 1; i >= 0; i--) {
        if (rows[i] && rows[i].some(v => v !== '' && v !== null && v !== undefined)) return i + 1;
      }
      return 0;
    },
    getMaxRows: () => Math.max(maxRows, rows.length),
    getMaxColumns: () => 26,
    insertColumnsAfter() {},
    insertRowsAfter(after, n) { maxRows = Math.max(maxRows, rows.length) + n; },
    setFrozenRows() {},
    deleteRows(start, n) { rows.splice(start - 1, n); },
    getRange(r, c, nr, nc) {
      nr = nr || 1; nc = nc || 1;
      const range = {
        getValues() {
          const out = [];
          for (let i = 0; i < nr; i++) {
            const src = rows[r - 1 + i] || [];
            const line = [];
            for (let j = 0; j < nc; j++) {
              const v = src[c - 1 + j];
              line.push(v === undefined || v === null ? '' : (v instanceof Date ? new Date(v.getTime()) : v));
            }
            out.push(line);
          }
          return out;
        },
        setValues(vals) {
          for (let i = 0; i < vals.length; i++) {
            const idx = r - 1 + i;
            while (rows.length <= idx) rows.push([]);
            for (let j = 0; j < vals[i].length; j++) {
              const v = vals[i][j];
              rows[idx][c - 1 + j] = v instanceof Date ? new Date(v.getTime()) : v;
            }
          }
          return range;
        },
        setValue(v) { return range.setValues([[v]]); },
        setNumberFormat() { return range; },
        setFontWeight() { return range; },
        setBackground() { return range; }
      };
      return range;
    },
    _rows: rows
  };
  return sheet;
}

function __folderApi(d) {

  danhmuc:   ['admin', 'thukho'],
  muontra:   ['admin', 'thukho'],
  nhatky:    ['admin', 'kysu', 'thukho'],
  nguoidung: ['admin'],
  dexuat:    ['admin', 'kysu', 'thukho', 'congnhan'],
  duyet:     ['admin', 'kysu'],
  xemdexuat: ['admin', 'kysu', 'thukho'],
  quantri:   ['admin']            // sao lưu, cài đặt báo tin
};

// Tiền tố mã tự tạo theo nhóm vật tư.
const TIEN_TO = { dien: 'DI', nuoc: 'NU', pccc: 'PC', hvac: 'HV', phukien: 'PK', dungcu: 'DC' };

const LOAI_GD = ['NHAP', 'XUAT', 'CHUYEN', 'KIEMKE'];   // loại gửi được qua action 'txn'
// MUON (cho mượn: trừ tồn), TRA (trả: cộng tồn), MAT (báo mất: không đổi tồn) chỉ tạo qua lend / takeBack.
const TINH_TRANG = ['TOT', 'HONG', 'MAT'];
const HANH_DONG_GHI = ['login', 'txn', 'saveItem', 'saveLocation', 'saveUser', 'changePin', 'lend', 'takeBack',
  'request', 'editRequest', 'approve', 'issue', 'closeRequest',
  'importItems', 'saveItemPhoto', 'backup', 'backupAuto', 'notifySave'];
// Thao tác điện thoại được làm lúc mất mạng rồi gửi sau: kèm mã thao tác (opId), gửi lại bao nhiêu lần cũng chỉ ghi một lần.
const THAO_TAC_GUI_LAI = ['txn', 'lend', 'takeBack', 'request', 'editRequest', 'approve', 'issue', 'closeRequest'];
const DX_MO = ['CHO_DUYET', 'DA_DUYET'];   // phiếu đề xuất còn đang xử lý
const DX_TOI_DA = 80;                      // số vật tư tối đa mỗi phiếu
const PHIEN_GIAY = 21600;      // phiên đăng nhập tối đa 6 giờ
const SAI_TOI_DA = 5;          // sai PIN 5 lần trên 1 máy → khoá 5 phút
const SAI_TOAN_HE_THONG = 30;  // tổng 30 lần sai trong 10 phút → khoá đăng nhập 10 phút

/* ------------------------------------------------------------------ */
/*  Điểm vào                                                          */
/* ------------------------------------------------------------------ */

function doGet() {
  return traVe({ ok: true, data: { app: 'Kho Co Dien', phienBan: PHIEN_BAN } });
}

function doPost(e) {
  let out;
  try {
    const req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    out = { ok: true, data: xuLy(req) };
  } catch (err) {
    out = { ok: false, code: err.code || 'LOI', message: String((err && err.message) || err) };
  }
  return traVe(out);
}

function traVe(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function xuLy(req) {
  TIN_CHO.length = 0;
  DA_KIEM_GD = false;
  let lock = null;
  if (HANH_DONG_GHI.indexOf(req.action) >= 0) {
    lock = LockService.getScriptLock();
    lock.waitLock(25000);
  }
  let kq;
  try {
    kq = dieuHuong(req);
  } finally {
    if (lock) lock.releaseLock();
  }
  // Báo tin gửi sau khi nhả khoá (người khác không phải chờ); gửi lỗi cũng không làm hỏng thao tác vừa làm.
  guiTinCho();
  return kq;
}

function dieuHuong(req) {
  const a = req.action, p = req.payload || {};
  if (a === 'login') return dangNhap(p.pin, req.device);
  const u = xacThuc(req.token);
  if (a === 'logout') { CacheService.getScriptCache().remove('tk_' + req.token); return true; }
  // Thao tác có mã (opId): nếu đã nhận rồi (điện thoại gửi lại vì sóng yếu) thì không làm lại.
  const opId = THAO_TAC_GUI_LAI.indexOf(a) >= 0 ? sach(req.opId, 64) : '';
  if (opId) {
    const daCo = timThaoTac(opId);
    if (daCo) return { dup: true, id: daCo === 'OK' ? '' : daCo };
  }
  const kq = thucHien(a, u, p);
  if (opId) ghiThaoTac(opId, u, a, kq);
  return kq;
}

function thucHien(a, u, p) {
  switch (a) {
    case 'data':         return taiDuLieu(u);
    case 'txn':          canQuyen(u, 'nhapxuat'); return giaoDich(u, p);
    case 'saveItem':     canQuyen(u, 'danhmuc'); return luuVatTu(u, p);
    case 'saveLocation': canQuyen(u, 'danhmuc'); return luuViTri(u, p);
    case 'history':      canQuyen(u, 'nhatky'); return lichSu(p);
    case 'users':        canQuyen(u, 'nguoidung'); return dsNguoiDung();
    case 'saveUser':     canQuyen(u, 'nguoidung'); return luuNguoiDung(u, p);
    case 'changePin':    return doiPin(u, p);
    case 'lend':         canQuyen(u, 'muontra'); return choMuon(u, p);
    case 'takeBack':     canQuyen(u, 'muontra'); return nhanTra(u, p);
    case 'loans':        return dsPhieuMuon(p);
    case 'requests':     return dsDeXuat(u, p);
    case 'request':      canQuyen(u, 'dexuat'); return taoDeXuat(u, p);
    case 'editRequest':  canQuyen(u, 'dexuat'); return suaDeXuat(u, p);
    case 'approve':      canQuyen(u, 'duyet'); return duyetDeXuat(u, p);
    case 'issue':        canQuyen(u, 'nhapxuat'); return xuatDeXuat(u, p);
    case 'closeRequest': return dongDeXuat(u, p);
    // Bản 1.3
    case 'importItems':  canQuyen(u, 'danhmuc'); return nhapVatTu(u, p);
    case 'saveItemPhoto': canQuyen(u, 'danhmuc'); return luuAnhVatTu(u, p);
    case 'report':       canQuyen(u, 'nhatky'); return baoCao(p);
    case 'adminInfo':    canQuyen(u, 'quantri'); return thongTinQuanTri();
    case 'backup':       canQuyen(u, 'quantri'); saoLuu(); ghiNhatKy(str(u.Ten), 'SAO_LUU', ''); return thongTinQuanTri();
    case 'backupAuto':   canQuyen(u, 'quantri'); if (p.bat === false) tatSaoLuuTuDong(); else batSaoLuuTuDong(); return thongTinQuanTri();
    case 'notifySave':   canQuyen(u, 'quantri'); return luuBaoTin(u, p);
    case 'notifyChats':  canQuyen(u, 'quantri'); return timNhomTelegram(p);
    case 'notifyTest':   canQuyen(u, 'quantri'); return thuBaoTin(u);
  }
  throw loi('KHONG_HIEU', a);
}

// Tìm mã thao tác trong 5000 dòng cuối của trang DongBo. Trả về KetQua ('OK' hoặc mã phiếu vừa tạo), '' nếu chưa có.
function timThaoTac(opId) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('DongBo');
  if (!sh) return '';
  const n = sh.getLastRow();
  if (n < 2) return '';
  const bat = Math.max(2, n - 4999);
  const vals = sh.getRange(bat, 1, n - bat + 1, BANG.DongBo.length).getValues();
  const cKq = BANG.DongBo.indexOf('KetQua');
  for (let i = vals.length - 1; i >= 0; i--) {
    if (str(vals[i][0]) === opId) return str(vals[i][cKq]) || 'OK';
  }
  return '';
}
function ghiThaoTac(opId, u, a, kq) {
  const id = (kq && kq.loan && kq.loan.id) || (kq && kq.request && kq.request.id) || 'OK';
  themDong('DongBo', { MaThaoTac: opId, ThoiGian: new Date(), NguoiDung: str(u.Ten), HanhDong: a, KetQua: id });
}

/* ------------------------------------------------------------------ */
/*  Tiện ích                                                          */
/* ------------------------------------------------------------------ */

function loi(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function hoa(v) { return str(v).toUpperCase(); }
function so(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function lamTron(n) { return Math.round(n * 1000) / 1000; }
function iso(v) { return v instanceof Date ? v.toISOString() : str(v); }
function laDung(v) { return v === true || v === 1 || hoa(v) === 'TRUE'; }
// Làm sạch chữ người dùng gõ: bỏ dấu = + @ ở đầu (tránh bị hiểu là công thức), giới hạn độ dài.
function sach(v, max) { return str(v).replace(/^[=+@]+/, '').slice(0, max || 200); }
function ma(v, max) { return sach(v, max || 40).toUpperCase().replace(/\s+/g, '-'); }

// Ngày dạng yyyy-mm-dd theo múi giờ của dự án Apps Script.
function ngayChu(v) {
  if (!(v instanceof Date)) return str(v);
  const p = function (n) { return ('0' + n).slice(-2); };
  return v.getFullYear() + '-' + p(v.getMonth() + 1) + '-' + p(v.getDate());
}
function gioChu(d) {
  const p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function laNgay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s));
  if (!m) return false;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.getFullYear() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[3]);
}

function taoTrang(ss, ten) {
  const sh = ss.insertSheet(ten), cols = BANG[ten];
  dinhDangChu(sh, ten, 1, sh.getMaxRows());
  sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#f5c400');
  sh.setFrozenRows(1);
  return sh;
}

function sheet(ten) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(ten);
  // Trang mới (sau bản 1.0) chỉ được tạo trong thao tác ghi, vì các thao tác ghi chạy trong khoá.
  if (!sh && BANG_MOI.indexOf(ten) >= 0) sh = taoTrang(ss, ten);
  if (!sh) throw loi('CHUA_CAI_DAT', ten);
  return sh;
}

// Đọc bảng thành mảng đối tượng (bỏ dòng trống). tuDong: dòng bắt đầu (mặc định 2, ngay dưới tiêu đề).
function docBang(ten, tuDong) {
  if (BANG_MOI.indexOf(ten) >= 0 && !SpreadsheetApp.getActiveSpreadsheet().getSheetByName(ten)) return [];
  const bat = Math.max(2, tuDong || 2);
  const sh = sheet(ten), n = sh.getLastRow(), cols = BANG[ten];
  if (n < bat) return [];
  const vals = sh.getRange(bat, 1, n - bat + 1, cols.length).getValues();
  const out = [];
  for (let i = 0; i < vals.length; i++) {
    const o = { _row: i + bat };
    let rong = true;
    for (let j = 0; j < cols.length; j++) {
      o[cols[j]] = vals[i][j];
      if (vals[i][j] !== '' && vals[i][j] !== null) rong = false;
    }
    if (!rong) out.push(o);
  }
  return out;
}

// Trang tạo từ bản cũ chưa có cột mới ở cuối (Anh, Email): thêm tiêu đề và định dạng chữ cho cột đó.
function capNhatTieuDe(ten) {
  const sh = sheet(ten), cols = BANG[ten];
  if (sh.getMaxColumns() < cols.length) sh.insertColumnsAfter(sh.getMaxColumns(), cols.length - sh.getMaxColumns());
  const dau = sh.getRange(1, 1, 1, cols.length).getValues()[0];
  const thieu = cols.some(function (c, i) { return str(dau[i]) !== c; });
  if (thieu) {
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#f5c400');
    dinhDangChu(sh, ten, 1, sh.getMaxRows());
  }
  return sh;
}

// Trang GiaoDich cũ chưa có cột NguoiNhan: thêm tiêu đề một lần trong mỗi lần xử lý.
let DA_KIEM_GD = false;
function kiemCotGD() {
  if (!DA_KIEM_GD) { capNhatTieuDe('GiaoDich'); DA_KIEM_GD = true; }
}
// Tên người nhận: bỏ dấu [ ] (dùng để đánh dấu người mượn trong ghi chú), giới hạn độ dài
function tenNguoi(v) { return sach(v, 60).replace(/[\[\]]/g, '').replace(/\s+/g, ' ').trim(); }

function dinhDangChu(sh, ten, tuDong, soDong) {
  const cols = BANG[ten];
  (COT_CHU[ten] || []).forEach(function (c) {
    sh.getRange(tuDong, cols.indexOf(c) + 1, soDong, 1).setNumberFormat('@');
  });
}

function themNhieu(ten, objs) {
  if (!objs.length) return;
  const sh = sheet(ten), cols = BANG[ten], r = sh.getLastRow() + 1;
  if (r + objs.length - 1 > sh.getMaxRows()) {
    const them = Math.max(500, objs.length);
    sh.insertRowsAfter(sh.getMaxRows(), them);
    dinhDangChu(sh, ten, 1, sh.getMaxRows());
  }
  sh.getRange(r, 1, objs.length, cols.length).setValues(objs.map(function (o) {
    return cols.map(function (c) { return o[c] === undefined ? '' : o[c]; });
  }));
}
function themDong(ten, obj) { themNhieu(ten, [obj]); }

function suaDong(ten, row, obj) {
  const cols = BANG[ten];
  sheet(ten).getRange(row, 1, 1, cols.length).setValues([cols.map(function (c) { return obj[c] === undefined ? '' : obj[c]; })]);
}

function ghiNhatKy(nguoi, hanhDong, chiTiet) {
  themDong('NhatKy', { ThoiGian: new Date(), NguoiDung: nguoi, HanhDong: hanhDong, ChiTiet: chiTiet || '' });
}

/* ------------------------------------------------------------------ */
/*  PIN, phiên đăng nhập, quyền                                       */
/* ------------------------------------------------------------------ */

function bamPin(pin) {
  const props = PropertiesService.getScriptProperties();
  let salt = props.getProperty('SALT');
  if (!salt) { salt = Utilities.getUuid(); props.setProperty('SALT', salt); }
  const bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + ':' + pin, Utilities.Charset.UTF_8);
  return bytes.map(function (b) { return ('0' + ((b + 256) % 256).toString(16)).slice(-2); }).join('');
}

function congKhai(u) { return { id: str(u.ID), ten: str(u.Ten), vaiTro: str(u.VaiTro) }; }

function dangNhap(pin, device) {
  pin = str(pin);
  const cache = CacheService.getScriptCache();
  const khoaMay = 'f_' + str(device || 'x').slice(0, 60);
  const saiMay = so(cache.get(khoaMay));
  const saiTong = so(cache.get('f_all'));
  if (saiMay >= SAI_TOI_DA || saiTong >= SAI_TOAN_HE_THONG) throw loi('KHOA');
  const h = /^\d{6}$/.test(pin) ? bamPin(pin) : '';
  const u = h ? docBang('NguoiDung').filter(function (x) { return str(x.PinHash) === h && laDung(x.HoatDong); })[0] : null;
  if (!u) {
    cache.put(khoaMay, String(saiMay + 1), 300);
    cache.put('f_all', String(saiTong + 1), 600);
    Utilities.sleep(400);
    const conLai = SAI_TOI_DA - saiMay - 1;
    throw loi(conLai <= 0 ? 'KHOA' : 'PIN_SAI', String(conLai));
  }
  cache.remove(khoaMay);
  const token = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  cache.put('tk_' + token, str(u.ID), PHIEN_GIAY);
  ghiNhatKy(str(u.Ten), 'DANG_NHAP', '');
  return { token: token, user: congKhai(u) };
}

function xacThuc(token) {
  if (!token) throw loi('HET_PHIEN');
  const cache = CacheService.getScriptCache();
  const id = cache.get('tk_' + token);
  if (!id) throw loi('HET_PHIEN');
  const u = docBang('NguoiDung').filter(function (x) { return str(x.ID) === id; })[0];
  if (!u || !laDung(u.HoatDong)) { cache.remove('tk_' + token); throw loi('HET_PHIEN'); }
  cache.put('tk_' + token, id, PHIEN_GIAY);
  return u;
}

function canQuyen(u, q) {
  if (QUYEN[q].indexOf(str(u.VaiTro)) < 0) throw loi('KHONG_QUYEN', q);
}

function vatTuRa(r) {
  return {
    maVT: str(r.MaVT), barcode: str(r.Barcode), tenVI: str(r.TenVI), tenZH: str(r.TenZH),
    quyCach: str(r.QuyCach), donVi: str(r.DonVi), nhom: str(r.Nhom),
    tonToiThieu: so(r.TonToiThieu), ghiChu: str(r.GhiChu), anh: str(r.Anh)
  };
}
function viTriRa(r) {
  return {
    maViTri: str(r.MaViTri), kho: str(r.Kho), day: str(r.Day), ke: str(r.Ke), tang: str(r.Tang),
    moTaVI: str(r.MoTaVI), moTaZH: str(r.MoTaZH)
  };
}

function taiDuLieu(u) {
  const muon = taiPhieuMuon();
  const dx = taiDeXuat(u);
  const gd = ganDayGD();
  return {
    requests: dx,
    projects: duAnGanDay(dx, gd),
    receivers: QUYEN.nhapxuat.indexOf(str(u.VaiTro)) >= 0 ? dsNguoiNhan(gd, muon.borrowers) : [],
    me: congKhai(u),
    items: docBang('VatTu').map(vatTuRa),
    locations: docBang('ViTri').map(viTriRa),
    stock: docBang('TonKho')
      .filter(function (r) { return so(r.SoLuong) !== 0; })
      .map(function (r) { return { maVT: hoa(r.MaVT), maViTri: hoa(r.MaViTri), soLuong: so(r.SoLuong) }; }),
    loans: muon.loans,
    borrowers: muon.borrowers,
    time: new Date().toISOString()
  };
}

// Đọc 500 giao dịch cuối một lần: tên công trình và người nhận dùng gần đây (mới nhất trước).
function ganDayGD() {
  const kq = { ct: [], nn: [] };
  const sh = sheet('GiaoDich'), n = sh.getLastRow(), cols = BANG.GiaoDich;
  if (n < 2) return kq;
  const c1 = cols.indexOf('CongTrinh') + 1, c2 = cols.indexOf('NguoiNhan') + 1;
  const rong = Math.max(1, Math.min(c2, sh.getMaxColumns()) - c1 + 1);   // trang rất cũ có thể ít cột
  const bat = Math.max(2, n - 499);
  const vals = sh.getRange(bat, c1, n - bat + 1, rong).getValues();
  for (let i = vals.length - 1; i >= 0; i--) {
    kq.ct.push(str(vals[i][0]));
    if (rong > c2 - c1) kq.nn.push(str(vals[i][c2 - c1]));
  }
  return kq;
}

// Tên công trình dùng gần đây (gợi ý khi gõ, giúp viết thống nhất để sau này báo cáo theo công trình).
function duAnGanDay(dx, gd) {
  const out = [];
  function them(x) { x = str(x); if (x && out.indexOf(x) < 0 && out.length < 40) out.push(x); }
  dx.slice().sort(function (a, b) { return a.time < b.time ? 1 : -1; }).forEach(function (r) { them(r.congTrinh); });
  (gd || ganDayGD()).ct.forEach(them);
  return out;
}

// Gợi ý người nhận khi xuất: người nhận gần đây, rồi người dùng đang hoạt động (trừ tài khoản Quản trị), rồi người mượn gần đây.
function dsNguoiNhan(gd, nguoiMuon) {
  const out = [], da = {};
  function them(x) {
    x = str(x); const k = x.toLowerCase();
    if (x && !da[k] && out.length < 60) { da[k] = true; out.push(x); }
  }
  gd.nn.forEach(them);
  docBang('NguoiDung').forEach(function (u) { if (laDung(u.HoatDong) && str(u.VaiTro) !== 'admin') them(u.Ten); });
  (nguoiMuon || []).forEach(them);
  return out;
}

function lichSu(p) {
  const sh = sheet('GiaoDich'), n = sh.getLastRow(), cols = BANG.GiaoDich;
  if (n < 2) return [];
  const bat = Math.max(2, n - 2999);
  const vals = sh.getRange(bat, 1, n - bat + 1, cols.length).getValues();
  const loc = hoa(p.maVT), loai = str(p.loai), viTri = hoa(p.maViTri);
  const gioiHan = Math.min(Math.max(so(p.limit) || 60, 1), 300);
  const out = [];
  for (let i = vals.length - 1; i >= 0 && out.length < gioiHan; i--) {
    const r = vals[i];
    const o = {
      id: str(r[0]), time: iso(r[1]), loai: str(r[2]), maVT: hoa(r[3]), tu: hoa(r[4]), den: hoa(r[5]),
      soLuong: so(r[6]), congTrinh: str(r[7]), ghiChu: str(r[8]), nguoi: str(r[9]), nhan: str(r[10])
    };
    if (!o.id) continue;
    if (loc && o.maVT !== loc) continue;
    if (loai && o.loai !== loai) continue;
    if (viTri && o.tu !== viTri && o.den !== viTri) continue;
    out.push(o);
  }
  return out;
}

function maGiaoDich() {
  return 'GD' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
}

function giaoDich(u, p) {
  if (LOAI_GD.indexOf(str(p.loai)) < 0) throw loi('THIEU_DU_LIEU', 'loai');
  return { stock: thucHienGD(u, p).stock };
}

// Đọc sẵn danh mục và tồn để ghi nhiều giao dịch liền nhau (xuất theo phiếu) mà không đọc lại trang mỗi dòng.
function nguCanh() {
  return {
    vatTu: docBang('VatTu').map(function (v) { return hoa(v.MaVT); }),
    viTri: docBang('ViTri').map(function (v) { return hoa(v.MaViTri); }),
    ton: docBang('TonKho')
  };
}

// Ghi một giao dịch và cập nhật tồn. Dùng chung cho nhập/xuất/chuyển/kiểm kê và mượn/trả/mất.
// ctx (tuỳ chọn): kết quả nguCanh(), dùng chung giữa nhiều lần gọi.
function thucHienGD(u, p, ctx) {
  const loai = str(p.loai);
  const maVT = hoa(p.maVT);
  const dsVT = ctx ? ctx.vatTu : docBang('VatTu').map(function (v) { return hoa(v.MaVT); });
  if (dsVT.indexOf(maVT) < 0) throw loi('KHONG_CO_VT', maVT);

  const dsViTri = ctx ? ctx.viTri : docBang('ViTri').map(function (v) { return hoa(v.MaViTri); });
  function kiemViTri(m) {
    m = hoa(m);
    if (!m || dsViTri.indexOf(m) < 0) throw loi('KHONG_CO_VITRI', m);
    return m;
  }
  const sl = lamTron(Number(p.soLuong));
  if (!isFinite(sl) || (loai === 'KIEMKE' ? sl < 0 : sl <= 0)) throw loi('SO_LUONG');

  const sh = sheet('TonKho');
  const cSL = BANG.TonKho.indexOf('SoLuong') + 1;
  const ton = ctx ? ctx.ton : docBang('TonKho');
  function dong(m) {
    return ton.filter(function (r) { return hoa(r.MaVT) === maVT && hoa(r.MaViTri) === m; })[0];
  }
  function hienCo(m) { const r = dong(m); return r ? so(r.SoLuong) : 0; }
  function datTon(m, q) {
    q = lamTron(q);
    const r = dong(m);
    if (r) {
      sh.getRange(r._row, cSL, 1, 2).setValues([[q, new Date()]]);
      r.SoLuong = q;
    } else {
      themDong('TonKho', { MaVT: maVT, MaViTri: m, SoLuong: q, CapNhat: new Date() });
      ton.push({ _row: sh.getLastRow(), MaVT: maVT, MaViTri: m, SoLuong: q });
    }
  }

  let tu = '', den = '', slGhi = sl, ghiChu = sach(p.ghiChu, 300);
  if (loai === 'NHAP' || loai === 'TRA') {
    den = kiemViTri(p.denViTri);
    datTon(den, hienCo(den) + sl);
  } else if (loai === 'XUAT' || loai === 'MUON') {
    tu = kiemViTri(p.tuViTri);
    if (hienCo(tu) < sl) throw loi('KHONG_DU_TON', String(hienCo(tu)));
    datTon(tu, hienCo(tu) - sl);
  } else if (loai === 'MAT') {
    // Dụng cụ đã trừ tồn lúc cho mượn; báo mất chỉ ghi lại, không đổi tồn.
  } else if (loai === 'CHUYEN') {
    tu = kiemViTri(p.tuViTri);
    den = kiemViTri(p.denViTri);
    if (tu === den) throw loi('TRUNG_VITRI');
    if (hienCo(tu) < sl) throw loi('KHONG_DU_TON', String(hienCo(tu)));
    datTon(tu, hienCo(tu) - sl);
    datTon(den, hienCo(den) + sl);
  } else { // KIEMKE: nhập số thực tế, lưu phần chênh lệch
    den = kiemViTri(p.denViTri);
    const cu = hienCo(den);
    slGhi = lamTron(sl - cu);
    ghiChu = ('[' + cu + ' → ' + sl + '] ' + ghiChu).trim();
    datTon(den, sl);
  }

  kiemCotGD();
  themDong('GiaoDich', {
    ID: maGiaoDich(), ThoiGian: new Date(), Loai: loai, MaVT: maVT, TuViTri: tu, DenViTri: den,
    SoLuong: slGhi, CongTrinh: sach(p.congTrinh, 120), GhiChu: ghiChu, NguoiDung: str(u.Ten),
    NguoiNhan: loai === 'XUAT' || loai === 'MUON' ? tenNguoi(p.nguoiNhan) : ''
  });

  return {
    maVT: maVT, tu: tu, den: den, soLuong: sl,
    stock: ton
      .filter(function (r) { return hoa(r.MaVT) === maVT && so(r.SoLuong) !== 0; })
      .map(function (r) { return { maVT: maVT, maViTri: hoa(r.MaViTri), soLuong: so(r.SoLuong) }; })
  };
}

/* ------------------------------------------------------------------ */
/*  Mượn – trả dụng cụ                                                */
/* ------------------------------------------------------------------ */

function maPhieuMuon() {
  return 'MT' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
}

function muonRa(r) {
  const sl = so(r.SoLuong), daTra = so(r.DaTra), mat = so(r.Mat);
  return {
    id: str(r.ID), time: iso(r.ThoiGian), maVT: hoa(r.MaVT), tu: hoa(r.TuViTri), soLuong: sl,
    nguoiMuon: str(r.NguoiMuon), congTrinh: str(r.CongTrinh), hanTra: ngayChu(r.HanTra), ghiChu: str(r.GhiChu),
    nguoiChoMuon: str(r.NguoiChoMuon), daTra: daTra, hong: so(r.Hong), mat: mat,
    conLai: lamTron(sl - daTra - mat), trangThai: str(r.TrangThai), capNhat: iso(r.CapNhat), lichSuTra: str(r.LichSuTra)
  };
}
function dangMuon(r) { return str(r.TrangThai) === 'DANG_MUON'; }

// Phiếu đang mượn + tên người mượn gần đây (để gợi ý khi gõ). Chỉ đọc phần cuối trang cho nhanh.
function taiPhieuMuon() {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('MuonTra');
  const rong = { loans: [], borrowers: [] };
  if (!sh) return rong;
  const n = sh.getLastRow();
  if (n < 2) return rong;
  const tt = sh.getRange(2, BANG.MuonTra.indexOf('TrangThai') + 1, n - 1, 1).getValues();
  let dau = Math.max(0, tt.length - 400);
  for (let i = 0; i < dau; i++) { if (str(tt[i][0]) === 'DANG_MUON') { dau = i; break; } }
  const rows = docBang('MuonTra', dau + 2);
  const ten = [];
  for (let i = rows.length - 1; i >= 0 && ten.length < 40; i--) {
    const x = str(rows[i].NguoiMuon);
    if (x && ten.indexOf(x) < 0) ten.push(x);
  }
  return { loans: rows.filter(dangMuon).map(muonRa), borrowers: ten };
}

// Danh sách phiếu (mặc định: đã trả xong), mới nhất trước.
function dsPhieuMuon(p) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('MuonTra');
  if (!sh) return [];
  const rows = docBang('MuonTra', Math.max(2, sh.getLastRow() - 1499));
  const maVT = hoa(p.maVT), daTra = p.daTra !== false;
  const gioiHan = Math.min(Math.max(so(p.limit) || 100, 1), 300);
  return rows
    .filter(function (r) { return str(r.ID) && dangMuon(r) !== daTra && (!maVT || hoa(r.MaVT) === maVT); })
    .map(muonRa)
    .sort(function (a, b) { return a.capNhat < b.capNhat ? 1 : a.capNhat > b.capNhat ? -1 : 0; })
    .slice(0, gioiHan);
}

function choMuon(u, p) {
  const nguoi = sach(p.nguoiMuon, 60).replace(/[\[\]]/g, '').trim();
  if (!nguoi) throw loi('THIEU_NGUOI_MUON');
  const han = str(p.hanTra);
  if (!laNgay(han)) throw loi('HAN_TRA');
  const ct = sach(p.congTrinh, 120), ghiChu = sach(p.ghiChu, 200);
  const kq = thucHienGD(u, {
    loai: 'MUON', maVT: p.maVT, tuViTri: p.tuViTri, soLuong: p.soLuong, congTrinh: ct, nguoiNhan: nguoi,
    ghiChu: ('[' + nguoi + '] ' + ghiChu).trim()
  });
  const m = {
    ID: maPhieuMuon(), ThoiGian: new Date(), MaVT: kq.maVT, TuViTri: kq.tu, SoLuong: kq.soLuong,
    NguoiMuon: nguoi, CongTrinh: ct, HanTra: han, GhiChu: ghiChu, NguoiChoMuon: str(u.Ten),
    DaTra: 0, Hong: 0, Mat: 0, TrangThai: 'DANG_MUON', CapNhat: new Date(), LichSuTra: ''
  };
  themDong('MuonTra', m);
  return { stock: kq.stock, loan: muonRa(m) };
}

function nhanTra(u, p) {
  const id = str(p.id);
  const m = id ? docBang('MuonTra').filter(function (r) { return str(r.ID) === id; })[0] : null;
  if (!m) throw loi('KHONG_CO_PHIEU', id);
  const conLai = lamTron(so(m.SoLuong) - so(m.DaTra) - so(m.Mat));
  if (!dangMuon(m) || conLai <= 0) throw loi('DA_TRA_XONG');
  const sl = lamTron(Number(p.soLuong));
  if (!isFinite(sl) || sl <= 0) throw loi('SO_LUONG');
  if (sl > conLai) throw loi('TRA_QUA_SO', String(conLai));
  const tt = TINH_TRANG.indexOf(str(p.tinhTrang)) >= 0 ? str(p.tinhTrang) : 'TOT';
  const ghiChu = sach(p.ghiChu, 200);
  const nhan = { TOT: '', HONG: 'Hỏng 损坏', MAT: 'Mất 丢失' }[tt];
  const noiDung = ('[' + str(m.NguoiMuon) + '] ' + [nhan, ghiChu].filter(function (x) { return x; }).join(' · ')).trim();

  const kq = tt === 'MAT'
    ? thucHienGD(u, { loai: 'MAT', maVT: m.MaVT, soLuong: sl, congTrinh: m.CongTrinh, ghiChu: noiDung })
    : thucHienGD(u, { loai: 'TRA', maVT: m.MaVT, denViTri: str(p.denViTri) || str(m.TuViTri), soLuong: sl, congTrinh: m.CongTrinh, ghiChu: noiDung });

  if (tt === 'MAT') m.Mat = lamTron(so(m.Mat) + sl);
  else {
    m.DaTra = lamTron(so(m.DaTra) + sl);
    if (tt === 'HONG') m.Hong = lamTron(so(m.Hong) + sl);
  }
  const xong = lamTron(so(m.SoLuong) - so(m.DaTra) - so(m.Mat)) <= 0;
  m.TrangThai = xong ? 'DA_TRA' : 'DANG_MUON';
  m.CapNhat = new Date();
  const dong = gioChu(m.CapNhat) + ' · ' + { TOT: 'Trả 归还', HONG: 'Trả 归还 · Hỏng 损坏', MAT: 'Mất 丢失' }[tt] +
    ' ' + sl + (kq.den ? ' → ' + kq.den : '') + (ghiChu ? ' · ' + ghiChu : '') + ' (' + str(u.Ten) + ')';
  m.LichSuTra = (str(m.LichSuTra) ? str(m.LichSuTra) + ' | ' : '') + dong;
  m.LichSuTra = m.LichSuTra.slice(-2000);
  suaDong('MuonTra', m._row, m);
  return { stock: kq.stock, loan: muonRa(m) };
}

/* ------------------------------------------------------------------ */
/*  Phiếu đề xuất vật tư                                              */
/*  CHO_DUYET → (kỹ sư) DA_DUYET / TU_CHOI → (thủ kho) HOAN_TAT        */
/*  Người tạo sửa được khi chưa xuất (sửa phiếu đã duyệt / bị từ chối  */
/*  thì quay về CHO_DUYET), huỷ được khi chưa xuất: DA_HUY            */
/* ------------------------------------------------------------------ */

function dongDX(r) {
  let ds = [];
  try { ds = JSON.parse(str(r.ChiTiet) || '[]'); } catch (e) { ds = []; }
  if (!Array.isArray(ds)) ds = [];
  return ds.filter(function (x) { return x && str(x.maVT); }).map(function (x) {
    return { maVT: hoa(x.maVT), sl: so(x.sl), duyet: so(x.duyet), daXuat: so(x.daXuat) };
  });
}
function deXuatRa(r) {
  return {
    id: str(r.ID), time: iso(r.ThoiGian), nguoiTao: str(r.NguoiTao), nguoiTaoId: str(r.NguoiTaoID),
    congTrinh: str(r.CongTrinh), canNgay: ngayChu(r.CanNgay), ghiChu: str(r.GhiChu), lines: dongDX(r),
    trangThai: str(r.TrangThai), nguoiDuyet: str(r.NguoiDuyet), tgDuyet: iso(r.ThoiGianDuyet), yKien: str(r.YKien),
    capNhat: iso(r.CapNhat), lichSu: str(r.LichSu)
  };
}
function dxMo(r) { return DX_MO.indexOf(str(r.TrangThai)) >= 0; }
function xemDX(u, r) { return QUYEN.xemdexuat.indexOf(str(u.VaiTro)) >= 0 || str(r.NguoiTaoID) === str(u.ID); }
function ghiLichSuDX(r, noiDung, u) {
  const dong = gioChu(new Date()) + ' · ' + noiDung + ' (' + str(u.Ten) + ')';
  r.LichSu = ((str(r.LichSu) ? str(r.LichSu) + ' | ' : '') + dong).slice(-4000);
}

// Phiếu đang xử lý + phiếu của chính mình vừa xong trong 7 ngày (để người đề xuất thấy kết quả).
function taiDeXuat(u) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('DeXuat');
  if (!sh) return [];
  const n = sh.getLastRow();
  if (n < 2) return [];
  const tt = sh.getRange(2, BANG.DeXuat.indexOf('TrangThai') + 1, n - 1, 1).getValues();
  let dau = Math.max(0, tt.length - 300);
  for (let i = 0; i < dau; i++) { if (DX_MO.indexOf(str(tt[i][0])) >= 0) { dau = i; break; } }
  const moc = Date.now() - 7 * 864e5;
  return docBang('DeXuat', dau + 2).filter(function (r) {
    if (!str(r.ID) || !xemDX(u, r)) return false;
    if (dxMo(r)) return true;
    return str(r.NguoiTaoID) === str(u.ID) && r.CapNhat instanceof Date && r.CapNhat.getTime() > moc;
  }).map(deXuatRa);
}

// Danh sách phiếu đã xong (hoàn tất / từ chối / huỷ), mới nhất trước.
function dsDeXuat(u, p) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('DeXuat');
  if (!sh) return [];
  const rows = docBang('DeXuat', Math.max(2, sh.getLastRow() - 1499));
  const gioiHan = Math.min(Math.max(so(p.limit) || 100, 1), 300);
  const xong = p.done !== false;
  return rows
    .filter(function (r) { return str(r.ID) && xemDX(u, r) && dxMo(r) !== xong; })
    .map(deXuatRa)
    .sort(function (a, b) { return a.capNhat < b.capNhat ? 1 : a.capNhat > b.capNhat ? -1 : 0; })
    .slice(0, gioiHan);
}

function maDeXuat() {
  const sh = sheet('DeXuat'), n = sh.getLastRow();
  let lon = 0;
  if (n >= 2) sh.getRange(2, 1, n - 1, 1).getValues().forEach(function (r) {
    const m = /^DX-(\d+)$/.exec(hoa(r[0]));
    if (m) lon = Math.max(lon, Number(m[1]));
  });
  return 'DX-' + String(lon + 1).padStart(4, '0');
}

function timDX(id) {
  id = hoa(id);
  const r = id ? docBang('DeXuat').filter(function (x) { return hoa(x.ID) === id; })[0] : null;
  if (!r) throw loi('KHONG_CO_DX', id);
  return r;
}

// Kiểm tra nội dung phiếu (dùng chung cho tạo mới và sửa). Dòng trùng vật tư thì cộng dồn.
function docNoiDungDX(p) {
  const ct = sach(p.congTrinh, 120);
  if (!ct) throw loi('THIEU_CONG_TRINH');
  const can = str(p.canNgay);
  if (can && !laNgay(can)) throw loi('CAN_NGAY');
  const dsVT = docBang('VatTu').map(function (v) { return hoa(v.MaVT); });
  const gop = {}, thuTu = [];
  (Array.isArray(p.lines) ? p.lines : []).forEach(function (x) {
    const m = hoa(x && x.maVT);
    if (dsVT.indexOf(m) < 0) throw loi('KHONG_CO_VT', m);
    const sl = lamTron(Number(x.soLuong));
    if (!isFinite(sl) || sl <= 0) throw loi('SO_LUONG');
    if (!(m in gop)) { gop[m] = 0; thuTu.push(m); }
    gop[m] = lamTron(gop[m] + sl);
  });
  if (!thuTu.length) throw loi('DX_TRONG');
  if (thuTu.length > DX_TOI_DA) throw loi('DX_NHIEU');
  return {
    ct: ct, can: can, ghiChu: sach(p.ghiChu, 300),
    lines: thuTu.map(function (m) { return { maVT: m, sl: gop[m], duyet: 0, daXuat: 0 }; })
  };
}

function taoDeXuat(u, p) {
  const nd = docNoiDungDX(p);
  const now = new Date();
  const r = {
    ID: maDeXuat(), ThoiGian: now, NguoiTao: str(u.Ten), NguoiTaoID: str(u.ID), CongTrinh: nd.ct, CanNgay: nd.can,
    GhiChu: nd.ghiChu, TrangThai: 'CHO_DUYET', NguoiDuyet: '', ThoiGianDuyet: '', YKien: '', CapNhat: now, LichSu: '',
    ChiTiet: JSON.stringify(nd.lines)
  };
  ghiLichSuDX(r, 'Tạo 创建 · ' + nd.lines.length + ' mục 项', u);
  themDong('DeXuat', r);
  baoTinDX('moi', r, u);
  return { request: deXuatRa(r) };
}

// Người tạo (hoặc Quản trị) sửa phiếu đã gửi, khi chưa xuất gì:
//  Chờ duyệt: sửa xong vẫn chờ duyệt.
//  Đã duyệt (chưa xuất) hoặc Bị từ chối: sửa xong quay về Chờ duyệt, kỹ sư duyệt lại.
// p.trangThai: trạng thái điện thoại đang thấy; khác trên máy chủ (ví dụ kỹ sư vừa duyệt) thì báo để tải lại.
function suaDeXuat(u, p) {
  const r = timDX(p.id);
  const tt = str(r.TrangThai), cu = dongDX(r);
  if (str(r.NguoiTaoID) !== str(u.ID) && str(u.VaiTro) !== 'admin') throw loi('KHONG_QUYEN', 'dexuat');
  if (['CHO_DUYET', 'DA_DUYET', 'TU_CHOI'].indexOf(tt) < 0) throw loi('DX_TRANG_THAI', tt);
  if (str(p.trangThai) && str(p.trangThai) !== tt) throw loi('DX_TRANG_THAI', tt);
  if (cu.some(function (z) { return z.daXuat > 0; })) throw loi('DX_DA_XUAT');
  const nd = docNoiDungDX(p);

  // Ghi lại những gì đã đổi để kỹ sư nhìn là biết
  const doi = [];
  if (nd.ct !== str(r.CongTrinh)) doi.push('→ ' + nd.ct);
  if (nd.can !== ngayChu(r.CanNgay)) doi.push('Cần 需用 ' + (nd.can || '—'));
  nd.lines.forEach(function (l) {
    const c = cu.filter(function (z) { return z.maVT === l.maVT; })[0];
    if (!c) doi.push('+' + l.maVT + ' ' + l.sl);
    else if (c.sl !== l.sl) doi.push(l.maVT + ' ' + c.sl + '→' + l.sl);
  });
  cu.forEach(function (c) {
    if (!nd.lines.some(function (l) { return l.maVT === c.maVT; })) doi.push('−' + c.maVT);
  });
  if (nd.ghiChu !== str(r.GhiChu)) doi.push('Ghi chú 备注');

  const guiLai = tt !== 'CHO_DUYET';
  r.CongTrinh = nd.ct; r.CanNgay = nd.can; r.GhiChu = nd.ghiChu; r.ChiTiet = JSON.stringify(nd.lines);
  r.TrangThai = 'CHO_DUYET';
  if (guiLai) { r.NguoiDuyet = ''; r.ThoiGianDuyet = ''; r.YKien = ''; }
  ghiLichSuDX(r, (guiLai ? 'Sửa, gửi duyệt lại 修改并重新提交' : 'Sửa 修改') + (doi.length ? ' · ' + doi.join(', ').slice(0, 300) : ''), u);
  r.CapNhat = new Date();
  suaDong('DeXuat', r._row, r);
  if (guiLai) baoTinDX('guiLai', r, u);
  return { request: deXuatRa(r) };
}

// Kỹ sư duyệt (có thể sửa số lượng từng dòng, 0 = bỏ dòng) hoặc từ chối (bắt buộc ghi lý do).
function duyetDeXuat(u, p) {
  const r = timDX(p.id);
  if (str(r.TrangThai) !== 'CHO_DUYET') throw loi('DX_TRANG_THAI', str(r.TrangThai));
  const yKien = sach(p.yKien, 300);
  const lines = dongDX(r);
  if (p.dongY === false) {
    if (!yKien) throw loi('THIEU_LY_DO');
    lines.forEach(function (l) { l.duyet = 0; });
    r.TrangThai = 'TU_CHOI';
    ghiLichSuDX(r, 'Từ chối 驳回: ' + yKien, u);
  } else {
    const moi = {};
    (Array.isArray(p.lines) ? p.lines : []).forEach(function (x) {
      const d = lamTron(Number(x && x.duyet));
      if (!isFinite(d) || d < 0) throw loi('SO_LUONG');
      moi[hoa(x.maVT)] = d;
    });
    lines.forEach(function (l) { l.duyet = l.maVT in moi ? moi[l.maVT] : l.sl; });
    if (!lines.some(function (l) { return l.duyet > 0; })) throw loi('DX_TRONG');
    r.TrangThai = 'DA_DUYET';
    const sua = lines.filter(function (l) { return l.duyet !== l.sl; })
      .map(function (l) { return l.maVT + ' ' + l.sl + '→' + l.duyet; }).join(', ');
    ghiLichSuDX(r, 'Duyệt 批准' + (sua ? ' · ' + sua : '') + (yKien ? ': ' + yKien : ''), u);
  }
  r.ChiTiet = JSON.stringify(lines);
  r.NguoiDuyet = str(u.Ten); r.ThoiGianDuyet = new Date(); r.YKien = yKien; r.CapNhat = new Date();
  suaDong('DeXuat', r._row, r);
  baoTinDX(r.TrangThai === 'TU_CHOI' ? 'tuChoi' : 'duyet', r, u);
  return { request: deXuatRa(r) };
}

// Thủ kho xuất theo phiếu đã duyệt. Có thể xuất nhiều lần (từng phần, từ nhiều vị trí).
// Kiểm tra hết các dòng trước rồi mới ghi, để không bao giờ ghi dở dang.
function xuatDeXuat(u, p) {
  const r = timDX(p.id);
  if (str(r.TrangThai) !== 'DA_DUYET') throw loi('DX_TRANG_THAI', str(r.TrangThai));
  const lines = dongDX(r);
  const ds = Array.isArray(p.lines) ? p.lines : [];
  if (!ds.length) throw loi('DX_TRONG');
  const ctx = nguCanh();
  const them = {}, tonTam = {};
  function tonCo(m, l) {
    const k = m + '|' + l;
    if (!(k in tonTam)) {
      const x = ctx.ton.filter(function (t) { return hoa(t.MaVT) === m && hoa(t.MaViTri) === l; })[0];
      tonTam[k] = x ? so(x.SoLuong) : 0;
    }
    return tonTam[k];
  }
  const viec = ds.map(function (x) {
    const m = hoa(x && x.maVT), l = hoa(x && x.tuViTri), sl = lamTron(Number(x && x.soLuong));
    const d = lines.filter(function (z) { return z.maVT === m; })[0];
    if (!d) throw loi('KHONG_CO_VT', m);
    if (!isFinite(sl) || sl <= 0) throw loi('SO_LUONG');
    if (ctx.viTri.indexOf(l) < 0) throw loi('KHONG_CO_VITRI', l);
    const con = lamTron(d.duyet - d.daXuat - (them[m] || 0));
    if (sl > con) throw loi('XUAT_QUA_SO', con + '|' + m);
    const co = tonCo(m, l);
    if (co < sl) throw loi('KHONG_DU_TON', co + '|' + m);
    tonTam[m + '|' + l] = lamTron(co - sl);
    them[m] = lamTron((them[m] || 0) + sl);
    return { d: d, m: m, l: l, sl: sl };
  });
  const ghi = sach(p.ghiChu, 200);
  // Người nhận: mặc định là người tạo phiếu; thủ kho sửa được nếu người khác đến lấy thay
  const nhan = tenNguoi(p.nguoiNhan) || tenNguoi(r.NguoiTao);
  viec.forEach(function (v) {
    thucHienGD(u, {
      loai: 'XUAT', maVT: v.m, tuViTri: v.l, soLuong: v.sl, congTrinh: str(r.CongTrinh), nguoiNhan: nhan,
      ghiChu: [str(r.ID), str(r.NguoiTao), ghi].filter(function (x) { return x; }).join(' · ')
    }, ctx);
    v.d.daXuat = lamTron(v.d.daXuat + v.sl);
  });
  const du = lines.every(function (z) { return z.daXuat >= z.duyet; });
  r.ChiTiet = JSON.stringify(lines);
  ghiLichSuDX(r, 'Xuất 出库 ' + viec.map(function (v) { return v.m + ' × ' + v.sl + ' ← ' + v.l; }).join('; ') +
    (nhan && nhan !== tenNguoi(r.NguoiTao) ? ' · Người nhận 领料人: ' + nhan : '') + (ghi ? ' · ' + ghi : ''), u);
  if (du) r.TrangThai = 'HOAN_TAT';
  else if (p.dong === true) { r.TrangThai = 'HOAN_TAT'; ghiLichSuDX(r, 'Đóng phiếu 关闭 · không xuất phần còn lại 余量不出库', u); }
  r.CapNhat = new Date();
  suaDong('DeXuat', r._row, r);
  if (r.TrangThai === 'HOAN_TAT') baoTinDX(du ? 'xuatXong' : 'dong', r, u, ghi);
  const cacMa = Object.keys(them);
  return {
    request: deXuatRa(r),
    stock: ctx.ton
      .filter(function (t) { return cacMa.indexOf(hoa(t.MaVT)) >= 0 && so(t.SoLuong) !== 0; })
      .map(function (t) { return { maVT: hoa(t.MaVT), maViTri: hoa(t.MaViTri), soLuong: so(t.SoLuong) }; })
  };
}

// Huỷ (chưa xuất gì) hoặc đóng phiếu (đã xuất một phần, không xuất phần còn lại).
//  Chờ duyệt: người tạo hoặc Quản trị huỷ được.
//  Đã duyệt: Thủ kho / Quản trị đóng được; người tạo huỷ được nếu chưa xuất gì.
function dongDeXuat(u, p) {
  const r = timDX(p.id);
  const tt = str(r.TrangThai), vt = str(u.VaiTro);
  const laNguoiTao = str(r.NguoiTaoID) === str(u.ID);
  const daXuat = dongDX(r).some(function (z) { return z.daXuat > 0; });
  let duoc;
  if (tt === 'CHO_DUYET') duoc = laNguoiTao || vt === 'admin';
  else if (tt === 'DA_DUYET') duoc = QUYEN.nhapxuat.indexOf(vt) >= 0 || (laNguoiTao && !daXuat);
  else throw loi('DX_TRANG_THAI', tt);
  if (!duoc) throw loi('KHONG_QUYEN', 'dexuat');
  const lyDo = sach(p.lyDo, 200);
  r.TrangThai = daXuat ? 'HOAN_TAT' : 'DA_HUY';
  ghiLichSuDX(r, (daXuat ? 'Đóng phiếu 关闭' : 'Huỷ 撤销') + (lyDo ? ': ' + lyDo : ''), u);
  r.CapNhat = new Date();
  suaDong('DeXuat', r._row, r);
  baoTinDX(daXuat ? 'dong' : 'huy', r, u, lyDo, tt);
  return { request: deXuatRa(r) };
}

function maMoi(ds, nhom) {
  const tt = TIEN_TO[nhom] || 'VT';
  const re = new RegExp('^' + tt + '-(\\d+)$');
  let lon = 0;
  ds.forEach(function (v) { const m = hoa(v.MaVT).match(re); if (m) lon = Math.max(lon, Number(m[1])); });
  return tt + '-' + ('000' + (lon + 1)).slice(-4);
}

function luuVatTu(u, p) {
  capNhatTieuDe('VatTu');
  const ds = docBang('VatTu');
  const dsViTri = docBang('ViTri').map(function (v) { return hoa(v.MaViTri); });
  const nhom = sach(p.nhom, 20), donVi = sach(p.donVi, 20);
  const tenVI = sach(p.tenVI, 150), tenZH = sach(p.tenZH, 150), barcode = sach(p.barcode, 60);
  if (!nhom || !donVi) throw loi('THIEU_DU_LIEU');
  if (!tenVI && !tenZH) throw loi('THIEU_TEN');

  const goc = hoa(p.maGoc);
  const cu = goc ? ds.filter(function (v) { return hoa(v.MaVT) === goc; })[0] : null;
  if (goc && !cu) throw loi('KHONG_CO_VT', goc);

  let maVT;
  if (cu) maVT = goc;                         // sửa: giữ nguyên mã
  else {
    maVT = ma(p.maVT) || maMoi(ds, nhom);
    if (ds.some(function (v) { return hoa(v.MaVT) === maVT; }) || dsViTri.indexOf(maVT) >= 0) throw loi('TRUNG_MA', maVT);
  }
  if (barcode) {
    const b = barcode.toUpperCase();
    const trung = ds.some(function (v) {
      return v !== cu && (hoa(v.Barcode) === b || hoa(v.MaVT) === b);
    }) || dsViTri.indexOf(b) >= 0;
    if (trung) throw loi('TRUNG_BARCODE', barcode);
  }

  const obj = {
    MaVT: maVT, Barcode: barcode, TenVI: tenVI, TenZH: tenZH, QuyCach: sach(p.quyCach, 150),
    DonVi: donVi, Nhom: nhom, TonToiThieu: Math.max(0, lamTron(so(p.tonToiThieu))),
    GhiChu: sach(p.ghiChu, 300), NgayTao: cu ? cu.NgayTao : new Date(), Anh: cu ? str(cu.Anh) : ''
  };
  if (cu) suaDong('VatTu', cu._row, obj); else themDong('VatTu', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_VAT_TU' : 'THEM_VAT_TU', maVT);

  let stock = null;
  if (!cu && so(p.soLuongDau) > 0 && str(p.viTriDau)) {
    canQuyen(u, 'nhapxuat');
    stock = giaoDich(u, { loai: 'NHAP', maVT: maVT, denViTri: p.viTriDau, soLuong: p.soLuongDau, ghiChu: 'Tồn ban đầu khi tạo vật tư' }).stock;
  }
  return { item: vatTuRa(obj), stock: stock };
}

function luuViTri(u, p) {
  const ds = docBang('ViTri');
  const dsVT = docBang('VatTu').map(function (v) { return hoa(v.MaVT); });
  const kho = ma(p.kho, 10), day = ma(p.day, 10), ke = ma(p.ke, 10), tang = ma(p.tang, 10);
  const goc = hoa(p.maGoc);
  const cu = goc ? ds.filter(function (v) { return hoa(v.MaViTri) === goc; })[0] : null;
  if (goc && !cu) throw loi('KHONG_CO_VITRI', goc);

  let maViTri;
  if (cu) maViTri = goc;
  else {
    maViTri = ma(p.maViTri) || [kho, day, ke, tang].filter(function (x) { return x; }).join('-');
    if (!maViTri) throw loi('THIEU_DU_LIEU');
    if (ds.some(function (v) { return hoa(v.MaViTri) === maViTri; }) || dsVT.indexOf(maViTri) >= 0) throw loi('TRUNG_MA', maViTri);
  }
  const obj = {
    MaViTri: maViTri, Kho: kho, Day: day, Ke: ke, Tang: tang,
    MoTaVI: sach(p.moTaVI, 150), MoTaZH: sach(p.moTaZH, 150)
  };
  if (cu) suaDong('ViTri', cu._row, obj); else themDong('ViTri', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_VI_TRI' : 'THEM_VI_TRI', maViTri);
  return { location: viTriRa(obj) };
}

function dsNguoiDung() {
  return docBang('NguoiDung').map(function (u) {
    return { id: str(u.ID), ten: str(u.Ten), vaiTro: str(u.VaiTro), hoatDong: laDung(u.HoatDong), email: str(u.Email) };
  });
}
function laEmail(s) { return /^[^\s@,;<>"]+@[^\s@,;<>"]+\.[^\s@,;<>"]+$/.test(s); }

function pinDaDung(h, ds, boQuaId) {
  return ds.some(function (x) { return str(x.ID) !== boQuaId && str(x.PinHash) === h; });
}

function luuNguoiDung(u, p) {
  capNhatTieuDe('NguoiDung');
  const ds = docBang('NguoiDung');
  const ten = sach(p.ten, 60), vaiTro = str(p.vaiTro), pin = str(p.pin);
  const hoatDong = p.hoatDong !== false;
  if (!ten || VAI_TRO.indexOf(vaiTro) < 0) throw loi('THIEU_DU_LIEU');
  const cu = p.id ? ds.filter(function (x) { return str(x.ID) === str(p.id); })[0] : null;
  // Email: không gửi lên (app cũ) thì giữ nguyên
  const email = p.email === undefined ? (cu ? str(cu.Email) : '') : sach(p.email, 120).toLowerCase();
  if (email && !laEmail(email)) throw loi('EMAIL');
  if (p.id && !cu) throw loi('THIEU_DU_LIEU', 'id');
  if (!cu && !pin) throw loi('PIN_DINH_DANG');
  if (pin && !/^\d{6}$/.test(pin)) throw loi('PIN_DINH_DANG');

  const id = cu ? str(cu.ID) : 'U' + ('00' + (ds.reduce(function (m, x) {
    const n = Number(str(x.ID).replace(/\D/g, '')); return Math.max(m, isFinite(n) ? n : 0);
  }, 0) + 1)).slice(-3);
  let h = cu ? str(cu.PinHash) : '';
  if (pin) {
    h = bamPin(pin);
    if (pinDaDung(h, ds, id)) throw loi('PIN_TRUNG');
  }

  // Luôn phải còn ít nhất 1 Quản trị đang hoạt động
  const conAdmin = ds.some(function (x) {
    return str(x.ID) !== id && str(x.VaiTro) === 'admin' && laDung(x.HoatDong);
  }) || (vaiTro === 'admin' && hoatDong);
  if (!conAdmin) throw loi('ADMIN_CUOI');

  const obj = { ID: id, Ten: ten, PinHash: h, VaiTro: vaiTro, HoatDong: hoatDong, NgayTao: cu ? cu.NgayTao : new Date(), Email: email };
  if (cu) suaDong('NguoiDung', cu._row, obj); else themDong('NguoiDung', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_NGUOI_DUNG' : 'THEM_NGUOI_DUNG', id + ' ' + ten + ' (' + vaiTro + ')');
  return dsNguoiDung();
}

function doiPin(u, p) {
  if (bamPin(str(p.pinCu)) !== str(u.PinHash)) throw loi('PIN_CU_SAI');
  const moi = str(p.pinMoi);
  if (!/^\d{6}$/.test(moi)) throw loi('PIN_DINH_DANG');
  const h = bamPin(moi);
  const ds = docBang('NguoiDung');
  if (pinDaDung(h, ds, str(u.ID))) throw loi('PIN_TRUNG');
  const cu = ds.filter(function (x) { return str(x.ID) === str(u.ID); })[0];
  cu.PinHash = h;
  suaDong('NguoiDung', cu._row, cu);
  ghiNhatKy(str(u.Ten), 'DOI_PIN', '');
  return true;
}

/**

function capQuyen() {
  DriveApp.getRootFolder().getName();

}

function xoaLich(ham) {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === ham) ScriptApp.deleteTrigger(t); });
}
function coLich(ham) {
  return ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === ham; });
}
