<style>
:root{
  --paper:#eef1f0; --card:#ffffff; --sunk:#e4e9e7; --ink:#16211f; --muted:#56645f; --line:#d2d9d7;
  --signal:#f5c400; --signal-ink:#16211f; --action:#16211f; --action-ink:#ffffff;
  --ok:#1e7f4a; --okbg:#dff1e6; --warn:#945300; --warnbg:#fbecd0; --bad:#b3372a; --badbg:#fae3df;
  --move:#2a5a8c; --movebg:#e1ebf6; --count:#6a4c9e; --countbg:#ece6f6;
  --stripe-a:#f5c400; --stripe-b:#16211f; --focus:#2a5a8c;
  --shadow:0 1px 2px rgba(22,33,31,.06),0 6px 18px rgba(22,33,31,.07);
  --sans:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  --zh:'Noto Sans SC','PingFang SC','Microsoft YaHei','Be Vietnam Pro',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1513; --card:#182120; --sunk:#121a18; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2c3734;
    --action:#e5ebe9; --action-ink:#0f1513;
    --ok:#62cc90; --okbg:#173325; --warn:#f0b454; --warnbg:#3a2b12; --bad:#f28a7b; --badbg:#3d1c18;
    --move:#86b5e8; --movebg:#1a2a3b; --count:#bba0ea; --countbg:#2a2140; --focus:#86b5e8;
    --shadow:0 1px 0 rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1513; --card:#182120; --sunk:#121a18; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2c3734;
  --action:#e5ebe9; --action-ink:#0f1513;
  --ok:#62cc90; --okbg:#173325; --warn:#f0b454; --warnbg:#3a2b12; --bad:#f28a7b; --badbg:#3d1c18;
  --move:#86b5e8; --movebg:#1a2a3b; --count:#bba0ea; --countbg:#2a2140; --focus:#86b5e8;
  --shadow:0 1px 0 rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%}
/* Chạm nhanh hoặc chạm lệch không làm phóng to màn hình */
html,body{touch-action:manipulation}
button,.keypad,.tiles,.acts,.chip,.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* iPhone: ô nhập luôn chạm và gõ được (tránh lỗi ô "chết" của web app ngoài màn hình chính) */
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:auto}
@supports (-webkit-touch-callout:none){.inp,.search-box input,.scan-tools .inp{transform:translateZ(0)}}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.zh,[lang="zh-CN"]{font-family:var(--zh)}
/* Song ngữ: chữ Trung đi kèm chữ Việt */
.zi{margin-left:.4em;font-weight:500;opacity:.72}
.tile .zi,.act .zi,.pin-label .zi,.toast .zi,.pin-msg .zi,.scan-msg .zi,.help .zi,.note .zi,.empty .zi,.sheet h3 .zi,.seg .zi{display:block;margin-left:0}
.tile .zi{font-size:12.5px;margin-top:1px}
.act .zi{font-size:11px}
.sheet h3 .zi{font-size:15px;margin-top:2px}
h2.sec .zi{text-transform:none;letter-spacing:0}
.qty .pill{white-space:normal;text-align:right;justify-content:flex-end;flex-wrap:wrap}
.nm2[lang="zh-CN"],.zs{font-family:var(--zh)}
.mono{font-family:var(--mono)}
.ic{width:22px;height:22px;flex:none}

/* Thanh trên cùng */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:56px}
.bar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.bar-title b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--sunk)}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)}
.busy{position:absolute;left:0;right:0;bottom:-3px;height:3px;overflow:hidden}
.busy::after{content:"";position:absolute;inset:0;width:35%;background:var(--signal);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.demo{max-width:620px;margin:10px auto 0;padding-inline:16px}
.demo p{margin:0;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:12.5px;color:var(--muted)}
.demo b{color:var(--ink)}

.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.count{font-family:var(--mono);font-size:12px;background:var(--sunk);color:var(--ink);border-radius:20px;padding:0 8px;letter-spacing:0}
.empty{color:var(--muted);margin:8px 0;font-size:14px}
.muted{color:var(--muted)}

/* Biển mã: mã vật tư viền đen, mã vị trí nền vàng như nhãn kệ */
.plate{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.02em;line-height:1.5;border:1.5px solid var(--ink);border-radius:3px;padding:0 5px;background:var(--card);color:var(--ink);white-space:nowrap}
.plate.loc{background:var(--signal);border-color:var(--signal-ink);color:var(--signal-ink)}
.plate.big{font-size:15px;padding:1px 8px}
.plate.huge{font-size:24px;padding:2px 10px;border-width:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:1px 9px;white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.grey{background:var(--sunk);color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.b-nhap{background:var(--okbg);color:var(--ok)}
.b-xuat{background:var(--badbg);color:var(--bad)}
.b-chuyen{background:var(--movebg);color:var(--move)}
.b-kiemke{background:var(--countbg);color:var(--count)}
.b-muon{background:var(--movebg);color:var(--move)}
.b-tra{background:var(--okbg);color:var(--ok)}
.b-mat{background:var(--badbg);color:var(--bad)}
.pill.move{background:var(--movebg);color:var(--move)}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.who .ic{width:15px;height:15px;color:var(--muted)}

/* Đăng nhập */
.login{max-width:360px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.brand{text-align:center;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:28px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--zh);font-size:17px;color:var(--muted);letter-spacing:.2em}
.brand-mark{margin:0 auto 10px;width:88px;height:88px}
.brand-mark svg,.bar-logo svg{display:block;width:100%;height:100%}
.bar-logo{width:36px;height:36px;flex:none;margin-left:4px}
.pin-label{font-weight:600;margin-top:8px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pin-msg{min-height:20px;margin:0;color:var(--bad);font-size:13.5px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.key{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;font-family:var(--mono);box-shadow:var(--shadow)}
.key:active{background:var(--sunk)}
.key.ghost{background:transparent;border-color:transparent;box-shadow:none;font-family:var(--sans);font-size:14px}
.hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12.5px}
.hint{border:1px dashed var(--line);border-radius:8px;padding:4px 8px;background:transparent;color:var(--muted)}
.hint b{font-family:var(--mono);color:var(--ink)}

/* Trang chủ */
.search{display:flex;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;background:var(--paper);padding-block:4px 8px;margin-top:-4px}
.search-box{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:50px}
.search-box:focus-within{border-color:var(--ink)}

/* Tem in (kích thước thật) */

<script>
// Máy chủ giả lập cho chế độ xem thử (chỉ chạy khi API_URL để trống).
const DemoBackend = (function () {
// Giả lập Google Sheets + Apps Script chạy ngay trong trình duyệt (chỉ dùng cho bản xem thử).
// Được ghép trước Code.gs trong một hàm bao, nên Code.gs chạy y hệt trên máy chủ thật.
function __sha256Bytes(str) {
  const frac = x => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
  const primes = [];
  for (let n = 2; primes.length < 64; n++) { if (primes.every(p => n % p)) primes.push(n); }
  const K = primes.map(p => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const data = new TextEncoder().encode(str);
  const len = data.length;
  const total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(data); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  const bits = len * 8;
  dv.setUint32(total - 8, Math.floor(bits / 4294967296));
  dv.setUint32(total - 4, bits >>> 0);
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  const W = new Uint32Array(64);
  for (let i = 0; i < total; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = ror(W[t - 15], 7) ^ ror(W[t - 15], 18) ^ (W[t - 15] >>> 3);
      const s1 = ror(W[t - 2], 17) ^ ror(W[t - 2], 19) ^ (W[t - 2] >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + W[t]) | 0;
      const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x >>> 0);
  }
  const out = [];
  H.forEach(w => { for (let s = 24; s >= 0; s -= 8) { const byte = (w >>> s) & 255; out.push(byte > 127 ? byte - 256 : byte); } });
  return out;
}

function __makeSheet(name) {
  const rows = [];
  let maxRows = 1000;
  const sheet = {
    getName: () => name,
    getLastRow() {
      for (let i = rows.length - 1; i >= 0; i--) {
        if (rows[i] && rows[i].some(v => v !== '' && v !== null && v !== undefined)) return i + 1;
      }
      return 0;
    },
    getMaxRows: () => Math.max(maxRows, rows.length),
    insertRowsAfter(after, n) { maxRows = Math.max(maxRows, rows.length) + n; },
    setFrozenRows() {},
    deleteRows(start, n) { rows.splice(start - 1, n); },
    getRange(r, c, nr, nc) {
      nr = nr || 1; nc = nc || 1;
      const range = {
        getValues() {
          const out = [];
          for (let i = 0; i < nr; i++) {
            const src = rows[r - 1 + i] || [];
            const line = [];
            for (let j = 0; j < nc; j++) {
              const v = src[c - 1 + j];
              line.push(v === undefined || v === null ? '' : (v instanceof Date ? new Date(v.getTime()) : v));
            }
            out.push(line);
          }
          return out;
        },
        setValues(vals) {
          for (let i = 0; i < vals.length; i++) {
            const idx = r - 1 + i;
            while (rows.length <= idx) rows.push([]);
            for (let j = 0; j < vals[i].length; j++) {
              const v = vals[i][j];
              rows[idx][c - 1 + j] = v instanceof Date ? new Date(v.getTime()) : v;
            }
          }
          return range;
        },
        setValue(v) { return range.setValues([[v]]); },
        setNumberFormat() { return range; },
        setFontWeight() { return range; },
        setBackground() { return range; }
      };
      return range;
    },
    _rows: rows
  };
  return sheet;
}

const __sheets = [];
const __ss = {
  getSheetByName: n => __sheets.find(s => s.getName() === n) || null,
  insertSheet(n) { const s = __makeSheet(n); __sheets.push(s); return s; },

/**

const PHIEN_BAN = '1.1';

// Cột luôn lưu dạng chữ (giữ số 0 ở đầu mã vạch, không tự đổi thành ngày tháng).
const COT_CHU = {
  VatTu:     ['MaVT', 'Barcode', 'TenVI', 'TenZH', 'QuyCach', 'DonVi', 'Nhom', 'GhiChu'],
  ViTri:     ['MaViTri', 'Kho', 'Day', 'Ke', 'Tang', 'MoTaVI', 'MoTaZH'],
  TonKho:    ['MaVT', 'MaViTri'],
  GiaoDich:  ['ID', 'Loai', 'MaVT', 'TuViTri', 'DenViTri', 'CongTrinh', 'GhiChu', 'NguoiDung'],
  NguoiDung: ['ID', 'Ten', 'PinHash', 'VaiTro'],
  NhatKy:    ['NguoiDung', 'HanhDong', 'ChiTiet'],

const VAI_TRO = ['admin', 'kysu', 'thukho', 'congnhan'];

// Ai được làm gì. Muốn cho Kỹ sư nhập/xuất thì thêm 'kysu' vào dòng nhapxuat.
// Xem danh sách dụng cụ đang cho mượn: mọi người đã đăng nhập.
const QUYEN = {
  nhapxuat:  ['admin', 'thukho'],
  danhmuc:   ['admin', 'thukho'],
  muontra:   ['admin', 'thukho'],
  nhatky:    ['admin', 'kysu', 'thukho'],
  nguoidung: ['admin']
};

// Tiền tố mã tự tạo theo nhóm vật tư.
const TIEN_TO = { dien: 'DI', nuoc: 'NU', pccc: 'PC', hvac: 'HV', phukien: 'PK', dungcu: 'DC' };

const LOAI_GD = ['NHAP', 'XUAT', 'CHUYEN', 'KIEMKE'];   // loại gửi được qua action 'txn'
// MUON (cho mượn: trừ tồn), TRA (trả: cộng tồn), MAT (báo mất: không đổi tồn) chỉ tạo qua lend / takeBack.
const TINH_TRANG = ['TOT', 'HONG', 'MAT'];
const HANH_DONG_GHI = ['login', 'txn', 'saveItem', 'saveLocation', 'saveUser', 'changePin', 'lend', 'takeBack'];
const PHIEN_GIAY = 21600;      // phiên đăng nhập tối đa 6 giờ
const SAI_TOI_DA = 5;          // sai PIN 5 lần trên 1 máy → khoá 5 phút
const SAI_TOAN_HE_THONG = 30;  // tổng 30 lần sai trong 10 phút → khoá đăng nhập 10 phút

/* ------------------------------------------------------------------ */
/*  Điểm vào                                                          */
/* ------------------------------------------------------------------ */

function doGet() {
  return traVe({ ok: true, data: { app: 'Kho Co Dien', phienBan: PHIEN_BAN } });
}

function doPost(e) {
  let out;
  try {
    const req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    out = { ok: true, data: xuLy(req) };
  } catch (err) {
    out = { ok: false, code: err.code || 'LOI', message: String((err && err.message) || err) };
  }
  return traVe(out);
}

function traVe(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function xuLy(req) {
  let lock = null;
  if (HANH_DONG_GHI.indexOf(req.action) >= 0) {
    lock = LockService.getScriptLock();
    lock.waitLock(25000);
  }
  try {
    return dieuHuong(req);
  } finally {
    if (lock) lock.releaseLock();
  }
}

function dieuHuong(req) {
  const a = req.action, p = req.payload || {};
  if (a === 'login') return dangNhap(p.pin, req.device);
  const u = xacThuc(req.token);
  switch (a) {
    case 'logout':       CacheService.getScriptCache().remove('tk_' + req.token); return true;
    case 'data':         return taiDuLieu(u);
    case 'txn':          canQuyen(u, 'nhapxuat'); return giaoDich(u, p);
    case 'saveItem':     canQuyen(u, 'danhmuc'); return luuVatTu(u, p);
    case 'saveLocation': canQuyen(u, 'danhmuc'); return luuViTri(u, p);
    case 'history':      canQuyen(u, 'nhatky'); return lichSu(p);
    case 'users':        canQuyen(u, 'nguoidung'); return dsNguoiDung();
    case 'saveUser':     canQuyen(u, 'nguoidung'); return luuNguoiDung(u, p);
    case 'changePin':    return doiPin(u, p);
    case 'lend':         canQuyen(u, 'muontra'); return choMuon(u, p);
    case 'takeBack':     canQuyen(u, 'muontra'); return nhanTra(u, p);
    case 'loans':        return dsPhieuMuon(p);
  }
  throw loi('KHONG_HIEU', a);
}

/* ------------------------------------------------------------------ */
/*  Tiện ích                                                          */
/* ------------------------------------------------------------------ */

function loi(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function hoa(v) { return str(v).toUpperCase(); }
function so(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function lamTron(n) { return Math.round(n * 1000) / 1000; }
function iso(v) { return v instanceof Date ? v.toISOString() : str(v); }
function laDung(v) { return v === true || v === 1 || hoa(v) === 'TRUE'; }
// Làm sạch chữ người dùng gõ: bỏ dấu = + @ ở đầu (tránh bị hiểu là công thức), giới hạn độ dài.
function sach(v, max) { return str(v).replace(/^[=+@]+/, '').slice(0, max || 200); }
function ma(v, max) { return sach(v, max || 40).toUpperCase().replace(/\s+/g, '-'); }

// Ngày dạng yyyy-mm-dd theo múi giờ của dự án Apps Script.
function ngayChu(v) {
  if (!(v instanceof Date)) return str(v);
  const p = function (n) { return ('0' + n).slice(-2); };
  return v.getFullYear() + '-' + p(v.getMonth() + 1) + '-' + p(v.getDate());
}
function gioChu(d) {
  const p = function (n) { return ('0' + n).slice(-2); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function laNgay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s));
  if (!m) return false;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.getFullYear() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[3]);
}

function taoTrang(ss, ten) {
  const sh = ss.insertSheet(ten), cols = BANG[ten];
  dinhDangChu(sh, ten, 1, sh.getMaxRows());
  sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#f5c400');
  sh.setFrozenRows(1);
  return sh;
}

function sheet(ten) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(ten);
  // Trang mới (sau bản 1.0) chỉ được tạo trong thao tác ghi, vì các thao tác ghi chạy trong khoá.
  if (!sh && BANG_MOI.indexOf(ten) >= 0) sh = taoTrang(ss, ten);
  if (!sh) throw loi('CHUA_CAI_DAT', ten);
  return sh;
}

// Đọc bảng thành mảng đối tượng (bỏ dòng trống). tuDong: dòng bắt đầu (mặc định 2, ngay dưới tiêu đề).
function docBang(ten, tuDong) {
  if (BANG_MOI.indexOf(ten) >= 0 && !SpreadsheetApp.getActiveSpreadsheet().getSheetByName(ten)) return [];
  const bat = Math.max(2, tuDong || 2);
  const sh = sheet(ten), n = sh.getLastRow(), cols = BANG[ten];
  if (n < bat) return [];
  const vals = sh.getRange(bat, 1, n - bat + 1, cols.length).getValues();
  const out = [];
  for (let i = 0; i < vals.length; i++) {
    const o = { _row: i + bat };
    let rong = true;
    for (let j = 0; j < cols.length; j++) {
      o[cols[j]] = vals[i][j];
      if (vals[i][j] !== '' && vals[i][j] !== null) rong = false;
    }
    if (!rong) out.push(o);
  }
  return out;
}

function dinhDangChu(sh, ten, tuDong, soDong) {
  const cols = BANG[ten];
  (COT_CHU[ten] || []).forEach(function (c) {
    sh.getRange(tuDong, cols.indexOf(c) + 1, soDong, 1).setNumberFormat('@');
  });
}

function themNhieu(ten, objs) {
  if (!objs.length) return;
  const sh = sheet(ten), cols = BANG[ten], r = sh.getLastRow() + 1;
  if (r + objs.length - 1 > sh.getMaxRows()) {
    const them = Math.max(500, objs.length);
    sh.insertRowsAfter(sh.getMaxRows(), them);
    dinhDangChu(sh, ten, 1, sh.getMaxRows());
  }
  sh.getRange(r, 1, objs.length, cols.length).setValues(objs.map(function (o) {
    return cols.map(function (c) { return o[c] === undefined ? '' : o[c]; });
  }));
}
function themDong(ten, obj) { themNhieu(ten, [obj]); }

function suaDong(ten, row, obj) {
  const cols = BANG[ten];
  sheet(ten).getRange(row, 1, 1, cols.length).setValues([cols.map(function (c) { return obj[c] === undefined ? '' : obj[c]; })]);
}

function ghiNhatKy(nguoi, hanhDong, chiTiet) {
  themDong('NhatKy', { ThoiGian: new Date(), NguoiDung: nguoi, HanhDong: hanhDong, ChiTiet: chiTiet || '' });
}

/* ------------------------------------------------------------------ */
/*  PIN, phiên đăng nhập, quyền                                       */
/* ------------------------------------------------------------------ */

function bamPin(pin) {
  const props = PropertiesService.getScriptProperties();
  let salt = props.getProperty('SALT');
  if (!salt) { salt = Utilities.getUuid(); props.setProperty('SALT', salt); }
  const bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + ':' + pin, Utilities.Charset.UTF_8);
  return bytes.map(function (b) { return ('0' + ((b + 256) % 256).toString(16)).slice(-2); }).join('');
}

function congKhai(u) { return { id: str(u.ID), ten: str(u.Ten), vaiTro: str(u.VaiTro) }; }

function dangNhap(pin, device) {
  pin = str(pin);
  const cache = CacheService.getScriptCache();
  const khoaMay = 'f_' + str(device || 'x').slice(0, 60);
  const saiMay = so(cache.get(khoaMay));
  const saiTong = so(cache.get('f_all'));
  if (saiMay >= SAI_TOI_DA || saiTong >= SAI_TOAN_HE_THONG) throw loi('KHOA');
  const h = /^\d{6}$/.test(pin) ? bamPin(pin) : '';
  const u = h ? docBang('NguoiDung').filter(function (x) { return str(x.PinHash) === h && laDung(x.HoatDong); })[0] : null;
  if (!u) {
    cache.put(khoaMay, String(saiMay + 1), 300);
    cache.put('f_all', String(saiTong + 1), 600);
    Utilities.sleep(400);
    const conLai = SAI_TOI_DA - saiMay - 1;
    throw loi(conLai <= 0 ? 'KHOA' : 'PIN_SAI', String(conLai));
  }
  cache.remove(khoaMay);
  const token = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  cache.put('tk_' + token, str(u.ID), PHIEN_GIAY);
  ghiNhatKy(str(u.Ten), 'DANG_NHAP', '');
  return { token: token, user: congKhai(u) };
}

function xacThuc(token) {
  if (!token) throw loi('HET_PHIEN');
  const cache = CacheService.getScriptCache();
  const id = cache.get('tk_' + token);
  if (!id) throw loi('HET_PHIEN');
  const u = docBang('NguoiDung').filter(function (x) { return str(x.ID) === id; })[0];
  if (!u || !laDung(u.HoatDong)) { cache.remove('tk_' + token); throw loi('HET_PHIEN'); }
  cache.put('tk_' + token, id, PHIEN_GIAY);
  return u;
}

function canQuyen(u, q) {
  if (QUYEN[q].indexOf(str(u.VaiTro)) < 0) throw loi('KHONG_QUYEN', q);
}

/* ------------------------------------------------------------------ */
/*  Đọc dữ liệu                                                       */
/* ------------------------------------------------------------------ */

function vatTuRa(r) {
  return {
    maVT: str(r.MaVT), barcode: str(r.Barcode), tenVI: str(r.TenVI), tenZH: str(r.TenZH),
    quyCach: str(r.QuyCach), donVi: str(r.DonVi), nhom: str(r.Nhom),
    tonToiThieu: so(r.TonToiThieu), ghiChu: str(r.GhiChu)
  };
}
function viTriRa(r) {
  return {
    maViTri: str(r.MaViTri), kho: str(r.Kho), day: str(r.Day), ke: str(r.Ke), tang: str(r.Tang),
    moTaVI: str(r.MoTaVI), moTaZH: str(r.MoTaZH)
  };
}

function taiDuLieu(u) {
  const muon = taiPhieuMuon();
  return {
    me: congKhai(u),
    items: docBang('VatTu').map(vatTuRa),
    locations: docBang('ViTri').map(viTriRa),
    stock: docBang('TonKho')
      .filter(function (r) { return so(r.SoLuong) !== 0; })
      .map(function (r) { return { maVT: hoa(r.MaVT), maViTri: hoa(r.MaViTri), soLuong: so(r.SoLuong) }; }),
    loans: muon.loans,
    borrowers: muon.borrowers,
    time: new Date().toISOString()
  };
}

function lichSu(p) {
  const sh = sheet('GiaoDich'), n = sh.getLastRow(), cols = BANG.GiaoDich;
  if (n < 2) return [];
  const bat = Math.max(2, n - 2999);
  const vals = sh.getRange(bat, 1, n - bat + 1, cols.length).getValues();
  const loc = hoa(p.maVT), loai = str(p.loai), viTri = hoa(p.maViTri);
  const gioiHan = Math.min(Math.max(so(p.limit) || 60, 1), 300);
  const out = [];
  for (let i = vals.length - 1; i >= 0 && out.length < gioiHan; i--) {
    const r = vals[i];
    const o = {
      id: str(r[0]), time: iso(r[1]), loai: str(r[2]), maVT: hoa(r[3]), tu: hoa(r[4]), den: hoa(r[5]),
      soLuong: so(r[6]), congTrinh: str(r[7]), ghiChu: str(r[8]), nguoi: str(r[9])
    };
    if (!o.id) continue;
    if (loc && o.maVT !== loc) continue;
    if (loai && o.loai !== loai) continue;
    if (viTri && o.tu !== viTri && o.den !== viTri) continue;
    out.push(o);
  }
  return out;
}

/* ------------------------------------------------------------------ */
/*  Nhập / xuất / chuyển / kiểm kê                                    */
/* ------------------------------------------------------------------ */

function maGiaoDich() {
  return 'GD' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
}

function giaoDich(u, p) {
  if (LOAI_GD.indexOf(str(p.loai)) < 0) throw loi('THIEU_DU_LIEU', 'loai');
  return { stock: thucHienGD(u, p).stock };
}

// Ghi một giao dịch và cập nhật tồn. Dùng chung cho nhập/xuất/chuyển/kiểm kê và mượn/trả/mất.
function thucHienGD(u, p) {
  const loai = str(p.loai);
  const maVT = hoa(p.maVT);
  if (!docBang('VatTu').some(function (v) { return hoa(v.MaVT) === maVT; })) throw loi('KHONG_CO_VT', maVT);

  const dsViTri = docBang('ViTri').map(function (v) { return hoa(v.MaViTri); });
  function kiemViTri(m) {
    m = hoa(m);
    if (!m || dsViTri.indexOf(m) < 0) throw loi('KHONG_CO_VITRI', m);
    return m;
  }
  const sl = lamTron(Number(p.soLuong));
  if (!isFinite(sl) || (loai === 'KIEMKE' ? sl < 0 : sl <= 0)) throw loi('SO_LUONG');

  const sh = sheet('TonKho');
  const cSL = BANG.TonKho.indexOf('SoLuong') + 1;
  const ton = docBang('TonKho');
  function dong(m) {
    return ton.filter(function (r) { return hoa(r.MaVT) === maVT && hoa(r.MaViTri) === m; })[0];
  }
  function hienCo(m) { const r = dong(m); return r ? so(r.SoLuong) : 0; }
  function datTon(m, q) {
    q = lamTron(q);
    const r = dong(m);
    if (r) {
      sh.getRange(r._row, cSL, 1, 2).setValues([[q, new Date()]]);
      r.SoLuong = q;
    } else {
      themDong('TonKho', { MaVT: maVT, MaViTri: m, SoLuong: q, CapNhat: new Date() });
      ton.push({ _row: sh.getLastRow(), MaVT: maVT, MaViTri: m, SoLuong: q });
    }
  }

  let tu = '', den = '', slGhi = sl, ghiChu = sach(p.ghiChu, 300);
  if (loai === 'NHAP' || loai === 'TRA') {
    den = kiemViTri(p.denViTri);
    datTon(den, hienCo(den) + sl);
  } else if (loai === 'XUAT' || loai === 'MUON') {
    tu = kiemViTri(p.tuViTri);
    if (hienCo(tu) < sl) throw loi('KHONG_DU_TON', String(hienCo(tu)));
    datTon(tu, hienCo(tu) - sl);
  } else if (loai === 'MAT') {
    // Dụng cụ đã trừ tồn lúc cho mượn; báo mất chỉ ghi lại, không đổi tồn.
  } else if (loai === 'CHUYEN') {
    tu = kiemViTri(p.tuViTri);
    den = kiemViTri(p.denViTri);
    if (tu === den) throw loi('TRUNG_VITRI');
    if (hienCo(tu) < sl) throw loi('KHONG_DU_TON', String(hienCo(tu)));
    datTon(tu, hienCo(tu) - sl);
    datTon(den, hienCo(den) + sl);
  } else { // KIEMKE: nhập số thực tế, lưu phần chênh lệch
    den = kiemViTri(p.denViTri);
    const cu = hienCo(den);
    slGhi = lamTron(sl - cu);
    ghiChu = ('[' + cu + ' → ' + sl + '] ' + ghiChu).trim();
    datTon(den, sl);
  }

  themDong('GiaoDich', {
    ID: maGiaoDich(), ThoiGian: new Date(), Loai: loai, MaVT: maVT, TuViTri: tu, DenViTri: den,
    SoLuong: slGhi, CongTrinh: sach(p.congTrinh, 120), GhiChu: ghiChu, NguoiDung: str(u.Ten)
  });

  return {
    maVT: maVT, tu: tu, den: den, soLuong: sl,
    stock: ton
      .filter(function (r) { return hoa(r.MaVT) === maVT && so(r.SoLuong) !== 0; })
      .map(function (r) { return { maVT: maVT, maViTri: hoa(r.MaViTri), soLuong: so(r.SoLuong) }; })
  };
}

/* ------------------------------------------------------------------ */
/*  Mượn – trả dụng cụ                                                */
/* ------------------------------------------------------------------ */

function maPhieuMuon() {
  return 'MT' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
}

function muonRa(r) {
  const sl = so(r.SoLuong), daTra = so(r.DaTra), mat = so(r.Mat);
  return {
    id: str(r.ID), time: iso(r.ThoiGian), maVT: hoa(r.MaVT), tu: hoa(r.TuViTri), soLuong: sl,
    nguoiMuon: str(r.NguoiMuon), congTrinh: str(r.CongTrinh), hanTra: ngayChu(r.HanTra), ghiChu: str(r.GhiChu),
    nguoiChoMuon: str(r.NguoiChoMuon), daTra: daTra, hong: so(r.Hong), mat: mat,
    conLai: lamTron(sl - daTra - mat), trangThai: str(r.TrangThai), capNhat: iso(r.CapNhat), lichSuTra: str(r.LichSuTra)
  };
}
function dangMuon(r) { return str(r.TrangThai) === 'DANG_MUON'; }

// Phiếu đang mượn + tên người mượn gần đây (để gợi ý khi gõ). Chỉ đọc phần cuối trang cho nhanh.
function taiPhieuMuon() {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('MuonTra');
  const rong = { loans: [], borrowers: [] };
  if (!sh) return rong;
  const n = sh.getLastRow();
  if (n < 2) return rong;
  const tt = sh.getRange(2, BANG.MuonTra.indexOf('TrangThai') + 1, n - 1, 1).getValues();
  let dau = Math.max(0, tt.length - 400);
  for (let i = 0; i < dau; i++) { if (str(tt[i][0]) === 'DANG_MUON') { dau = i; break; } }
  const rows = docBang('MuonTra', dau + 2);
  const ten = [];
  for (let i = rows.length - 1; i >= 0 && ten.length < 40; i--) {
    const x = str(rows[i].NguoiMuon);
    if (x && ten.indexOf(x) < 0) ten.push(x);
  }
  return { loans: rows.filter(dangMuon).map(muonRa), borrowers: ten };
}

// Danh sách phiếu (mặc định: đã trả xong), mới nhất trước.
function dsPhieuMuon(p) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('MuonTra');
  if (!sh) return [];
  const rows = docBang('MuonTra', Math.max(2, sh.getLastRow() - 1499));
  const maVT = hoa(p.maVT), daTra = p.daTra !== false;
  const gioiHan = Math.min(Math.max(so(p.limit) || 100, 1), 300);
  return rows
    .filter(function (r) { return str(r.ID) && dangMuon(r) !== daTra && (!maVT || hoa(r.MaVT) === maVT); })
    .map(muonRa)
    .sort(function (a, b) { return a.capNhat < b.capNhat ? 1 : a.capNhat > b.capNhat ? -1 : 0; })
    .slice(0, gioiHan);
}

function choMuon(u, p) {
  const nguoi = sach(p.nguoiMuon, 60).replace(/[\[\]]/g, '').trim();
  if (!nguoi) throw loi('THIEU_NGUOI_MUON');
  const han = str(p.hanTra);
  if (!laNgay(han)) throw loi('HAN_TRA');
  const ct = sach(p.congTrinh, 120), ghiChu = sach(p.ghiChu, 200);
  const kq = thucHienGD(u, {
    loai: 'MUON', maVT: p.maVT, tuViTri: p.tuViTri, soLuong: p.soLuong, congTrinh: ct,
    ghiChu: ('[' + nguoi + '] ' + ghiChu).trim()
  });
  const m = {
    ID: maPhieuMuon(), ThoiGian: new Date(), MaVT: kq.maVT, TuViTri: kq.tu, SoLuong: kq.soLuong,
    NguoiMuon: nguoi, CongTrinh: ct, HanTra: han, GhiChu: ghiChu, NguoiChoMuon: str(u.Ten),
    DaTra: 0, Hong: 0, Mat: 0, TrangThai: 'DANG_MUON', CapNhat: new Date(), LichSuTra: ''
  };
  themDong('MuonTra', m);
  return { stock: kq.stock, loan: muonRa(m) };
}

function nhanTra(u, p) {
  const id = str(p.id);
  const m = id ? docBang('MuonTra').filter(function (r) { return str(r.ID) === id; })[0] : null;
  if (!m) throw loi('KHONG_CO_PHIEU', id);
  const conLai = lamTron(so(m.SoLuong) - so(m.DaTra) - so(m.Mat));
  if (!dangMuon(m) || conLai <= 0) throw loi('DA_TRA_XONG');
  const sl = lamTron(Number(p.soLuong));
  if (!isFinite(sl) || sl <= 0) throw loi('SO_LUONG');
  if (sl > conLai) throw loi('TRA_QUA_SO', String(conLai));
  const tt = TINH_TRANG.indexOf(str(p.tinhTrang)) >= 0 ? str(p.tinhTrang) : 'TOT';
  const ghiChu = sach(p.ghiChu, 200);
  const nhan = { TOT: '', HONG: 'Hỏng 损坏', MAT: 'Mất 丢失' }[tt];
  const noiDung = ('[' + str(m.NguoiMuon) + '] ' + [nhan, ghiChu].filter(function (x) { return x; }).join(' · ')).trim();

  const kq = tt === 'MAT'
    ? thucHienGD(u, { loai: 'MAT', maVT: m.MaVT, soLuong: sl, congTrinh: m.CongTrinh, ghiChu: noiDung })
    : thucHienGD(u, { loai: 'TRA', maVT: m.MaVT, denViTri: str(p.denViTri) || str(m.TuViTri), soLuong: sl, congTrinh: m.CongTrinh, ghiChu: noiDung });

  if (tt === 'MAT') m.Mat = lamTron(so(m.Mat) + sl);
  else {
    m.DaTra = lamTron(so(m.DaTra) + sl);
    if (tt === 'HONG') m.Hong = lamTron(so(m.Hong) + sl);
  }
  const xong = lamTron(so(m.SoLuong) - so(m.DaTra) - so(m.Mat)) <= 0;
  m.TrangThai = xong ? 'DA_TRA' : 'DANG_MUON';
  m.CapNhat = new Date();
  const dong = gioChu(m.CapNhat) + ' · ' + { TOT: 'Trả 归还', HONG: 'Trả 归还 · Hỏng 损坏', MAT: 'Mất 丢失' }[tt] +
    ' ' + sl + (kq.den ? ' → ' + kq.den : '') + (ghiChu ? ' · ' + ghiChu : '') + ' (' + str(u.Ten) + ')';
  m.LichSuTra = (str(m.LichSuTra) ? str(m.LichSuTra) + ' | ' : '') + dong;
  m.LichSuTra = m.LichSuTra.slice(-2000);
  suaDong('MuonTra', m._row, m);
  return { stock: kq.stock, loan: muonRa(m) };
}

/* ------------------------------------------------------------------ */
/*  Danh mục: vật tư, vị trí                                          */
/* ------------------------------------------------------------------ */

function maMoi(ds, nhom) {
  const tt = TIEN_TO[nhom] || 'VT';
  const re = new RegExp('^' + tt + '-(\\d+)$');
  let lon = 0;
  ds.forEach(function (v) { const m = hoa(v.MaVT).match(re); if (m) lon = Math.max(lon, Number(m[1])); });
  return tt + '-' + ('000' + (lon + 1)).slice(-4);
}

function luuVatTu(u, p) {
  const ds = docBang('VatTu');
  const dsViTri = docBang('ViTri').map(function (v) { return hoa(v.MaViTri); });
  const nhom = sach(p.nhom, 20), donVi = sach(p.donVi, 20);
  const tenVI = sach(p.tenVI, 150), tenZH = sach(p.tenZH, 150), barcode = sach(p.barcode, 60);
  if (!nhom || !donVi) throw loi('THIEU_DU_LIEU');
  if (!tenVI && !tenZH) throw loi('THIEU_TEN');

  const goc = hoa(p.maGoc);
  const cu = goc ? ds.filter(function (v) { return hoa(v.MaVT) === goc; })[0] : null;
  if (goc && !cu) throw loi('KHONG_CO_VT', goc);

  let maVT;
  if (cu) maVT = goc;                         // sửa: giữ nguyên mã
  else {
    maVT = ma(p.maVT) || maMoi(ds, nhom);
    if (ds.some(function (v) { return hoa(v.MaVT) === maVT; }) || dsViTri.indexOf(maVT) >= 0) throw loi('TRUNG_MA', maVT);
  }
  if (barcode) {
    const b = barcode.toUpperCase();
    const trung = ds.some(function (v) {
      return v !== cu && (hoa(v.Barcode) === b || hoa(v.MaVT) === b);
    }) || dsViTri.indexOf(b) >= 0;
    if (trung) throw loi('TRUNG_BARCODE', barcode);
  }

  const obj = {
    MaVT: maVT, Barcode: barcode, TenVI: tenVI, TenZH: tenZH, QuyCach: sach(p.quyCach, 150),
    DonVi: donVi, Nhom: nhom, TonToiThieu: Math.max(0, lamTron(so(p.tonToiThieu))),
    GhiChu: sach(p.ghiChu, 300), NgayTao: cu ? cu.NgayTao : new Date()
  };
  if (cu) suaDong('VatTu', cu._row, obj); else themDong('VatTu', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_VAT_TU' : 'THEM_VAT_TU', maVT);

  let stock = null;
  if (!cu && so(p.soLuongDau) > 0 && str(p.viTriDau)) {
    canQuyen(u, 'nhapxuat');
    stock = giaoDich(u, { loai: 'NHAP', maVT: maVT, denViTri: p.viTriDau, soLuong: p.soLuongDau, ghiChu: 'Tồn ban đầu khi tạo vật tư' }).stock;
  }
  return { item: vatTuRa(obj), stock: stock };
}

function luuViTri(u, p) {
  const ds = docBang('ViTri');
  const dsVT = docBang('VatTu').map(function (v) { return hoa(v.MaVT); });
  const kho = ma(p.kho, 10), day = ma(p.day, 10), ke = ma(p.ke, 10), tang = ma(p.tang, 10);
  const goc = hoa(p.maGoc);
  const cu = goc ? ds.filter(function (v) { return hoa(v.MaViTri) === goc; })[0] : null;
  if (goc && !cu) throw loi('KHONG_CO_VITRI', goc);

  let maViTri;
  if (cu) maViTri = goc;
  else {
    maViTri = ma(p.maViTri) || [kho, day, ke, tang].filter(function (x) { return x; }).join('-');
    if (!maViTri) throw loi('THIEU_DU_LIEU');
    if (ds.some(function (v) { return hoa(v.MaViTri) === maViTri; }) || dsVT.indexOf(maViTri) >= 0) throw loi('TRUNG_MA', maViTri);
  }
  const obj = {
    MaViTri: maViTri, Kho: kho, Day: day, Ke: ke, Tang: tang,
    MoTaVI: sach(p.moTaVI, 150), MoTaZH: sach(p.moTaZH, 150)
  };
  if (cu) suaDong('ViTri', cu._row, obj); else themDong('ViTri', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_VI_TRI' : 'THEM_VI_TRI', maViTri);
  return { location: viTriRa(obj) };
}

/* ------------------------------------------------------------------ */
/*  Người dùng                                                        */
/* ------------------------------------------------------------------ */

function dsNguoiDung() {
  return docBang('NguoiDung').map(function (u) {
    return { id: str(u.ID), ten: str(u.Ten), vaiTro: str(u.VaiTro), hoatDong: laDung(u.HoatDong) };
  });
}

function pinDaDung(h, ds, boQuaId) {
  return ds.some(function (x) { return str(x.ID) !== boQuaId && str(x.PinHash) === h; });
}

function luuNguoiDung(u, p) {
  const ds = docBang('NguoiDung');
  const ten = sach(p.ten, 60), vaiTro = str(p.vaiTro), pin = str(p.pin);
  const hoatDong = p.hoatDong !== false;
  if (!ten || VAI_TRO.indexOf(vaiTro) < 0) throw loi('THIEU_DU_LIEU');
  const cu = p.id ? ds.filter(function (x) { return str(x.ID) === str(p.id); })[0] : null;
  if (p.id && !cu) throw loi('THIEU_DU_LIEU', 'id');
  if (!cu && !pin) throw loi('PIN_DINH_DANG');
  if (pin && !/^\d{6}$/.test(pin)) throw loi('PIN_DINH_DANG');

  const id = cu ? str(cu.ID) : 'U' + ('00' + (ds.reduce(function (m, x) {
    const n = Number(str(x.ID).replace(/\D/g, '')); return Math.max(m, isFinite(n) ? n : 0);
  }, 0) + 1)).slice(-3);
  let h = cu ? str(cu.PinHash) : '';
  if (pin) {
    h = bamPin(pin);
    if (pinDaDung(h, ds, id)) throw loi('PIN_TRUNG');
  }

  // Luôn phải còn ít nhất 1 Quản trị đang hoạt động
  const conAdmin = ds.some(function (x) {
    return str(x.ID) !== id && str(x.VaiTro) === 'admin' && laDung(x.HoatDong);
  }) || (vaiTro === 'admin' && hoatDong);
  if (!conAdmin) throw loi('ADMIN_CUOI');

  const obj = { ID: id, Ten: ten, PinHash: h, VaiTro: vaiTro, HoatDong: hoatDong, NgayTao: cu ? cu.NgayTao : new Date() };
  if (cu) suaDong('NguoiDung', cu._row, obj); else themDong('NguoiDung', obj);
  ghiNhatKy(str(u.Ten), cu ? 'SUA_NGUOI_DUNG' : 'THEM_NGUOI_DUNG', id + ' ' + ten + ' (' + vaiTro + ')');
  return dsNguoiDung();
}

function doiPin(u, p) {
  if (bamPin(str(p.pinCu)) !== str(u.PinHash)) throw loi('PIN_CU_SAI');
  const moi = str(p.pinMoi);
  if (!/^\d{6}$/.test(moi)) throw loi('PIN_DINH_DANG');
  const h = bamPin(moi);
  const ds = docBang('NguoiDung');
  if (pinDaDung(h, ds, str(u.ID))) throw loi('PIN_TRUNG');
  const cu = ds.filter(function (x) { return str(x.ID) === str(u.ID); })[0];
  cu.PinHash = h;
  suaDong('NguoiDung', cu._row, cu);
  ghiNhatKy(str(u.Ten), 'DOI_PIN', '');
  return true;
}

/** Chạy 1 lần sau khi dán code. Chạy lại cũng không mất dữ liệu đã có. */
function caiDat() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const props = PropertiesService.getScriptProperties();
  if (!props.getProperty('SALT')) props.setProperty('SALT', Utilities.getUuid());

  Object.keys(BANG).forEach(function (ten) {
    const sh = ss.getSheetByName(ten);
    if (!sh) { taoTrang(ss, ten); return; }
    const cols = BANG[ten];
    dinhDangChu(sh, ten, 1, sh.getMaxRows());
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#f5c400');
    sh.setFrozenRows(1);
  });

  const trong = function (ten) { return sheet(ten).getLastRow() < 2; };
  const now = Date.now(), gio = 3600 * 1000;

  if (trong('ViTri')) {
    themNhieu('ViTri', MAU.viTri.map(function (r) {
      return { MaViTri: r[0], Kho: r[1], Day: r[2], Ke: r[3], Tang: r[4], MoTaVI: r[5], MoTaZH: r[6] };
    }));
  }
  if (trong('VatTu')) {
    themNhieu('VatTu', MAU.vatTu.map(function (r) {
      return { MaVT: r[0], Barcode: r[1], TenVI: r[2], TenZH: r[3], QuyCach: r[4], DonVi: r[5], Nhom: r[6], TonToiThieu: r[7], GhiChu: '', NgayTao: new Date(now - 240 * gio) };
    }));
  }
  if (trong('TonKho') && trong('GiaoDich')) {
    // Tính ngược tồn đầu kỳ từ tồn hiện tại và các giao dịch mẫu
    const dau = {};
    const khoa = function (m, v) { return m + '|' + v; };
    const coMuon = trong('MuonTra');
    MAU.ton.forEach(function (r) { dau[khoa(r[0], r[1])] = r[2]; });
    MAU.giaoDich.slice().reverse().forEach(function (g) {
      const loai = g[0], m = g[1], tu = g[2], den = g[3], sl = g[4];
      if (loai === 'XUAT' || loai === 'CHUYEN') dau[khoa(m, tu)] = (dau[khoa(m, tu)] || 0) + sl;
      if (loai === 'CHUYEN') dau[khoa(m, den)] = (dau[khoa(m, den)] || 0) - sl;
    });
    if (coMuon) MAU.muonTra.forEach(function (r) { dau[khoa(r[0], r[1])] = (dau[khoa(r[0], r[1])] || 0) + r[2]; });
    const gd = [];
    Object.keys(dau).forEach(function (k) {
      if (dau[k] <= 0) return;
      const p = k.split('|');
      gd.push({ t: now - 216 * gio, ID: 'GD-MAU-' + (gd.length + 1), Loai: 'NHAP', MaVT: p[0], TuViTri: '', DenViTri: p[1], SoLuong: dau[k], CongTrinh: '', GhiChu: 'Tồn đầu kỳ (dữ liệu mẫu)', NguoiDung: 'Thủ kho Lan' });
    });
    MAU.giaoDich.forEach(function (g, i) {
      gd.push({ t: now - g[6] * gio, ID: 'GD-MAU-X' + (i + 1), Loai: g[0], MaVT: g[1], TuViTri: g[2], DenViTri: g[3], SoLuong: g[4], CongTrinh: g[5], GhiChu: '', NguoiDung: g[7] });
    });
    if (coMuon) {
      const phieu = MAU.muonTra.map(function (r, i) {
        const t = now - r[5] * gio;
        gd.push({ t: t, ID: 'GD-MAU-M' + (i + 1), Loai: 'MUON', MaVT: r[0], TuViTri: r[1], DenViTri: '', SoLuong: r[2], CongTrinh: r[4], GhiChu: '[' + r[3] + ']', NguoiDung: r[7] });
        return {
          ID: 'MT-MAU-' + (i + 1), ThoiGian: new Date(t), MaVT: r[0], TuViTri: r[1], SoLuong: r[2], NguoiMuon: r[3], CongTrinh: r[4],
          HanTra: ngayChu(new Date(t + r[6] * 24 * gio)), GhiChu: '', NguoiChoMuon: r[7], DaTra: 0, Hong: 0, Mat: 0,
          TrangThai: 'DANG_MUON', CapNhat: new Date(t), LichSuTra: ''
        };
      });
      themNhieu('MuonTra', phieu);
    }
    gd.sort(function (a, b) { return a.t - b.t; });
    themNhieu('GiaoDich', gd.map(function (g) { g.ThoiGian = new Date(g.t); return g; }));
    themNhieu('TonKho', MAU.ton.map(function (r) {
      return { MaVT: r[0], MaViTri: r[1], SoLuong: r[2], CapNhat: new Date(now - 2 * gio) };
    }));
  }
  if (trong('NguoiDung')) {
    themNhieu('NguoiDung', MAU.nguoiDung.map(function (r) {
      return { ID: r[0], Ten: r[1], PinHash: bamPin(r[2]), VaiTro: r[3], HoatDong: true, NgayTao: new Date() };
    }));
  }

  // Xoá trang trống mặc định (Trang tính1 / Sheet1)
  ss.getSheets().forEach(function (sh) {
    if (!BANG[sh.getName()] && sh.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(sh);
  });
  return 'Đã cài đặt xong. Tiếp theo: Triển khai → Ứng dụng web.';
}

/** Xoá toàn bộ vật tư, vị trí, tồn kho, giao dịch, phiếu mượn (giữ người dùng và nhật ký). */
function xoaDuLieuMau() {
  ['VatTu', 'ViTri', 'TonKho', 'GiaoDich', 'MuonTra'].forEach(function (ten) {
    const sh = sheet(ten), n = sh.getLastRow();
    if (n >= 2) sh.deleteRows(2, n - 1);
  });
  return 'Đã xoá dữ liệu mẫu.';
}

// Dữ liệu mẫu kho cơ điện — chỉ dùng khi chạy caiDat() trên Sheet trống.
const MAU = {
  // MaViTri, Kho, Dãy, Kệ, Tầng, Mô tả VI, Mô tả ZH
  viTri: [
    ['K1-A-01-1', 'K1', 'A', '01', '1', 'Dây & cáp điện – tầng 1', '电线电缆 第1层'],
    ['K1-A-01-2', 'K1', 'A', '01', '2', 'Dây & cáp điện – tầng 2', '电线电缆 第2层'],
    ['K1-A-02-1', 'K1', 'A', '02', '1', 'Thiết bị đóng cắt (aptomat)', '开关设备（断路器）'],

function setData(d) {
  S.me = d.me; S.items = d.items; S.locs = d.locations; S.stock = d.stock;
  S.loans = d.loans || []; S.borrowers = d.borrowers || []; S.closedLoans = null;

}
function reindex() {
  S.items.sort((a, b) => a.maVT.localeCompare(b.maVT));
  S.locs.sort((a, b) => a.maViTri.localeCompare(b.maViTri));
  S.itemMap = new Map(S.items.map(i => [i.maVT.toUpperCase(), i]));
  S.locMap = new Map(S.locs.map(l => [l.maViTri.toUpperCase(), l]));
  S.byItem = new Map(); S.byLoc = new Map();
  for (const s of S.stock) {
    if (!s.soLuong) continue;
    if (!S.byItem.has(s.maVT)) S.byItem.set(s.maVT, []);
    if (!S.byLoc.has(s.maViTri)) S.byLoc.set(s.maViTri, []);
    S.byItem.get(s.maVT).push(s); S.byLoc.get(s.maViTri).push(s);
  }
  for (const it of S.items) {
    const rows = (S.byItem.get(it.maVT.toUpperCase()) || []).sort((a, b) => b.soLuong - a.soLuong);
    it._locs = rows;
    it._total = rows.reduce((a, s) => a + s.soLuong, 0);
    it._low = it.tonToiThieu > 0 && it._total < it.tonToiThieu;
    const hay = [it.maVT, it.barcode, it.tenVI, it.tenZH, it.quyCach, GROUPS[it.nhom] ? GROUPS[it.nhom].join(' ') : it.nhom].join(' ');
    it._n = norm(hay); it._c = compact(hay);
  }
  for (const l of S.locs) {
    const hay = [l.maViTri, l.moTaVI, l.moTaZH].join(' ');
    l._n = norm(hay); l._c = compact(hay);
    l._items = (S.byLoc.get(l.maViTri.toUpperCase()) || []);
  }
  // Phiếu mượn: hạn sớm nhất lên trước; cộng số đang cho mượn vào từng vật tư
  S.loans.sort((a, b) => a.hanTra.localeCompare(b.hanTra) || a.time.localeCompare(b.time));
  const lent = new Map();
  for (const L of S.loans) lent.set(L.maVT, (lent.get(L.maVT) || 0) + L.conLai);
  for (const it of S.items) it._lent = lent.get(it.maVT.toUpperCase()) || 0;
}

/* ---------------- Điều hướng ---------------- */
const USE_HIST = !IS_PREVIEW;
function go(v, p, replace) {
  const entry = { v, p: p || {} };
  if (replace && NAV.length) NAV[NAV.length - 1] = entry;
  else {
    NAV.push(entry);
    if (USE_HIST && NAV.length > 1) { try { history.pushState({ d: NAV.length }, ''); } catch (e) { /* bỏ qua */ } }
  }
  render(); window.scrollTo(0, 0);
}
function goBack() {
  if (NAV.length <= 1) return;
  if (USE_HIST) { try { history.back(); return; } catch (e) { /* tiếp tục */ } }
  NAV.pop(); render();
}
window.addEventListener('popstate', () => {
  if (NAV.length > 1) { NAV.pop(); closeSheet(); render(); }
});
// Sau khi lưu: nếu màn trước chính là trang đích thì quay lại, không thì thay màn hiện tại
function finishTo(v, p) {
  const prev = NAV[NAV.length - 2];
  if (prev && prev.v === v && (!p || !p.id || prev.p.id === p.id)) goBack();
  else go(v, p, true);
}
function cur() { return NAV[NAV.length - 1] || { v: 'login', p: {} }; }

const K = k => [tv(k), tz(k)];
const TITLES = {
  item: p => [p.id, tp('item')], loc: p => [p.id, tp('location')], items: () => K('itemsAll'), locs: () => K('locations'),
  txn: p => K('a_' + p.loai), itemForm: p => K(p.id ? 'editItem' : 'addItem'), locForm: p => K(p.id ? 'editLoc' : 'addLoc'),
  labels: () => K('labels'), log: () => K('log'), users: () => K('users'), userForm: p => K(p.id ? 'editUser' : 'addUser'), pin: () => K('changePin'),
  loans: () => K('loans'), lend: () => K('lendTitle'),
  giveBack: p => { const L = findLoan(p.id); return K(L && L.trangThai === 'DANG_MUON' && can('muontra') ? 'returnTitle' : 'loanDetail'); }
};
const VIEWS = {};
function render() {
  const c = cur();
  const home = c.v === 'home' || c.v === 'login';
  const tt = !home && TITLES[c.v] ? TITLES[c.v](c.p) : K('appName');
  $('#barTitle').textContent = tt[0];
  $('#barSub').textContent = tt[1];
  $('#barSub').lang = c.v === 'item' || c.v === 'loc' ? '' : 'zh-CN';
  $('#barTitle').className = c.v === 'item' || c.v === 'loc' ? 'mono' : '';
  $('#btnBack').hidden = NAV.length <= 1 || c.v === 'login';
  $('#barLogo').hidden = c.v !== 'home';
  if (!$('#barLogo').firstChild) $('#barLogo').innerHTML = LOGO;
  $('#btnBack').innerHTML = ic('back');
  $('#btnBack').setAttribute('aria-label', tp('back'));
  $('#btnUser').hidden = !S.token;
  $('#btnUser').innerHTML = ic('user');
  $('#btnUser').setAttribute('aria-label', S.me ? S.me.ten : '');
  $('#demo').hidden = !DEMO;
  $('#demoText').innerHTML = '<b>' + esc(tp('demoTitle')) + '</b> · ' + t('demoBanner') + (IS_PREVIEW ? '' : ' ' + t('demoLocal'));
  (VIEWS[c.v] || VIEWS.home)(c.p);
}

let pinBuf = '';
VIEWS.login = function () {
  pinBuf = '';
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
  const hints = DEMO ? '<div class="hints"><span class="muted">' + t('demoPins') + '</span>' +
    [['111111', 'admin'], ['222222', 'kysu'], ['333333', 'thukho'], ['444444', 'congnhan']]
      .map(([p, r]) => '<button type="button" class="hint" data-act="demoPin" data-pin="' + p + '"><b>' + p + '</b> ' + roleName(r) + '</button>').join('') + '</div>' : '';
  main.innerHTML = `
  <section class="login">
    <div class="brand">
      <div class="brand-mark">${LOGO}</div>
      <b>${esc(TX.appName[0])}</b><span>${esc(TX.appName[1])}</span>
    </div>
    <div class="pin-label" id="pinLabel">${t('enterPin')}</div>
    <div class="dots" id="dots" aria-live="polite">${'<i></i>'.repeat(6)}</div>
    <p class="pin-msg" id="pinMsg"></p>
    <div class="keypad">${keys.map(k => k === '' ? '<span></span>' :
      k === 'del' ? `<button type="button" class="key ghost" data-act="pinKey" data-k="del" aria-label="Xoá">⌫</button>` :
      `<button type="button" class="key" data-act="pinKey" data-k="${k}">${k}</button>`).join('')}</div>
    ${hints}
  </section>`;
};
function pinDots() { document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length)); }
async function pinKey(k) {
  if (!$('#dots') || $('#dots').dataset.wait) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 6) pinBuf += k;
  pinDots();
  if (pinBuf.length === 6) await doLogin(pinBuf);
}
async function doLogin(pin) {
  const dots = $('#dots'); dots.dataset.wait = '1';
  $('#pinMsg').innerHTML = t('loading');
  try {
    const r = await api('login', { pin });
    S.token = r.token; S.me = r.user; stor('s', 'kho_tk', r.token);
    await loadData();
    NAV.length = 0; go('home'); poke();
  } catch (e) {
    pinBuf = ''; delete dots.dataset.wait; pinDots();
    $('#pinMsg').innerHTML = errMsg(e);
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  }
}
async function loadData() { setData(await api('data')); }
function endSession() {
  S.token = null; S.me = null; stor('s', 'kho_tk', null);
  clearTimeout(idleT); closeSheet(); closeScanner();
  NAV.length = 0; NAV.push({ v: 'login', p: {} }); render();
}
function logout() {
  if (S.token) api('logout').catch(() => {});
  endSession();
}
let idleT;
function poke() {
  clearTimeout(idleT);
  if (S.token) idleT = setTimeout(() => { logout(); toast(t('idleOut')); }, IDLE_MIN * 60000);
}
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, poke, { passive: true }));
document.addEventListener('keydown', e => {
  if (cur().v === 'login' && !$('#sheetRoot').firstChild) {
    if (/^\d$/.test(e.key)) pinKey(e.key);
    else if (e.key === 'Backspace') pinKey('del');
  }
});

async function loadHistory(q, sel, withItem) {

VIEWS.txn = function (F) {

        <button type="button" class="btn small" data-act="unpick">${t('change')}</button></div>`
      : `<div class="with-btn"><input class="inp" id="fPick" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${esc(tp('pickItemPh'))}" value="${esc(F.pickQ || '')}">
        <button type="button" class="sq" data-act="scanItem" aria-label="${tp('scan')}">${ic('scan')}</button></div><div id="pickRes"></div>`}
    </div>
    ${locs}
    ${it && !noStock ? `
    <div class="field"><label for="fQty">${loai === 'KIEMKE' ? t('actualQty') : t('quantity')} (${esc(unitName(u))}) <span class="req">*</span></label>
      <input class="inp mono" id="fQty" inputmode="decimal" autocomplete="off" value="${esc(F.qty || '')}" placeholder="0">
      <div class="hintline" id="qtyHint"></div></div>
    ${loai === 'XUAT' ? `<div class="field"><label for="fCt">${t('project')}</label><input class="inp" id="fCt" value="${esc(F.ct || '')}" placeholder="${esc(tp('projectPh'))}"></div>` : ''}
    <div class="field"><label for="fNote">${t('note')} <span class="muted">(${t('optional')})</span></label><input class="inp" id="fNote" value="${esc(F.note || '')}"></div>
    <button type="submit" class="btn primary" id="fSubmit">${t('c_' + loai)}</button>` : ''}
  </form>`;

  const pick = $('#fPick');
  if (pick) {
    const show = () => {
      F.pickQ = pick.value;
      const res = pick.value.trim() ? searchItems(pick.value, 8) : [];
      $('#pickRes').innerHTML = res.length ? `<div class="picker-res">${res.map(i => `<button type="button" class="row" data-act="pick" data-id="${esc(i.maVT)}">
        <div class="row-main"><span class="nm">${esc(nm1(i))}</span><span class="meta"><span class="plate">${esc(i.maVT)}</span>${i.quyCach ? `<span>${esc(i.quyCach)}</span>` : ''}</span></div>
        <div class="qty"><b>${fmt(i._total)}</b><small>${esc(unitName(i.donVi))}</small></div></button>`).join('')}</div>` : '';
    };
    pick.addEventListener('input', show); show();
  }
  const hint = () => {
    const h = $('#qtyHint'); if (!h || !it) return;
    const q = parseQty($('#fQty').value);
    if (loai === 'XUAT' || loai === 'CHUYEN') h.innerHTML = F.tu ? `<span>${t('available')}: <b>${fmt(qtyAt(F.tu))}</b> ${esc(unitName(u))}</span>` : '';
    else if (loai === 'KIEMKE') {
      const c = F.den ? qtyAt(F.den) : 0;
      const d = isNaN(q) ? null : q - c;
      h.innerHTML = F.den ? `<span>${t('current')}: <b>${fmt(c)}</b></span>` + (d === null ? '' :
        `<span>${t('diff')}: <b class="${d < 0 ? 'diff-neg' : d > 0 ? 'diff-pos' : ''}">${d > 0 ? '+' : ''}${fmt(d)}</b></span>`) : '';
    } else h.innerHTML = F.den && qtyAt(F.den) ? `<span>${t('current')}: <b>${fmt(qtyAt(F.den))}</b> ${esc(unitName(u))}</span>` : '';

    const g = id => { const e = $('#' + id); return e ? e.value : undefined; };

    if (g('fNote') !== undefined) F.note = g('fNote');
  };

  ['fTu', 'fDen'].forEach(id => {
    const e = $('#' + id);
    if (e) e.addEventListener('change', () => { sync(); F[id === 'fTu' ? 'tu' : 'den'] = e.value; if (id === 'fTu' && F.den === e.value) F.den = ''; render(); });
  });
  const qEl = $('#fQty'); if (qEl) qEl.addEventListener('input', hint);
  hint();

  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    if (!it) return toast(t('errNoItem'), 'bad');
    const qty = parseQty(F.qty);
    if (loai === 'KIEMKE' ? !(qty >= 0) : !(qty > 0)) return toast(t(loai === 'KIEMKE' ? 'errQtyKK' : 'errQty'), 'bad');
    const needTu = loai === 'XUAT' || loai === 'CHUYEN', needDen = loai !== 'XUAT';
    if ((needTu && !F.tu) || (needDen && !F.den)) return toast(t('errNoLoc'), 'bad');
    if (needTu && qty > qtyAt(F.tu)) return toast(t('errNotEnough', { n: fmt(qtyAt(F.tu)) }), 'bad');
    const btn = $('#fSubmit'); btn.disabled = true;
    try {
      const r = await api('txn', { loai, maVT: it.maVT, tuViTri: needTu ? F.tu : '', denViTri: needDen ? F.den : '', soLuong: qty, congTrinh: F.ct || '', ghiChu: F.note || '' });
      updateStock(it.maVT, r.stock);
      const qs = qtyU(qty, u);
      toast(t('d_' + loai, { q: qs, l: loai === 'XUAT' ? F.tu : F.den, a: F.tu, b: F.den }));
      finishTo('item', { id: it.maVT });
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
  });
};

  return `<span class="pill grey">${t('dueShort')} ${esc(fmtDay(L.hanTra))}</span>`;

    <button type="submit" class="btn primary" id="fSubmit" ${it && !have.length ? 'disabled' : ''}>${t('c_LEND')}</button>
  </form>`;

  // Chọn dụng cụ: chưa gõ gì thì hiện sẵn các dụng cụ còn trong kho
  const pick = $('#fPick');
  if (pick) {
    const tools = S.items.filter(i => i.nhom === 'dungcu' && i._total > 0);
    const show = () => {
      F.pickQ = pick.value;
      const q = pick.value.trim();
      const res = q ? searchItems(q, 8) : tools;
      $('#pickRes').innerHTML = res.length ? (q ? '' : `<p class="hintline" style="margin:8px 0 6px">${t('toolsAvail')}</p>`) +
        `<div class="picker-res">${res.map(pickRow).join('')}</div>` : '';
    };
    pick.addEventListener('input', show); show();
  }
  // Gợi ý người mượn gần đây
  const who = $('#fWho');
  const sug = () => {
    const v = who.value.trim(), q = norm(v).trim();
    const names = [...new Set(S.borrowers.concat(S.loans.map(L => L.nguoiMuon)))]
      .filter(n => n && n !== v && (!q || norm(n).includes(q))).slice(0, 6);
    $('#whoSug').innerHTML = names.map(n => `<button type="button" class="chip" data-act="whoPick" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  };
  who.addEventListener('input', sug); sug();
  const due = $('#fDue');
  due.addEventListener('change', () => {
    F.due = due.value;
    main.querySelectorAll('[data-act="due"]').forEach(b => b.setAttribute('aria-pressed', String(F.due === addDays(+b.dataset.d))));
  });
  const sync = () => {
    const g = id => { const e = $('#' + id); return e ? e.value : undefined; };
    [['fQty', 'qty'], ['fWho', 'who'], ['fDue', 'due'], ['fCt', 'ct'], ['fNote', 'note']].forEach(([id, k]) => { const v = g(id); if (v !== undefined) F[k] = v; });
  };
  F._sync = sync;
  const tu = $('#fTu');
  if (tu) tu.addEventListener('change', () => { sync(); F.tu = tu.value; render(); });

  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    if (!it) return toast(t('errNoItem'), 'bad');
    const qty = parseQty(F.qty);
    if (!(qty > 0)) return toast(t('errQty'), 'bad');
    if (!F.tu) return toast(t('errNoLoc'), 'bad');
    if (qty > qtyAt(F.tu)) return toast(t('errNotEnough', { n: fmt(qtyAt(F.tu)) }), 'bad');
    const name = (F.who || '').trim();
    if (!name) { toast(t('errBorrower'), 'bad'); $('#fWho').focus(); return; }
    if (!dayOf(F.due) || F.due < addDays(0)) return toast(t('errDue'), 'bad');
    const btn = $('#fSubmit'); btn.disabled = true;
    try {
      const r = await api('lend', { maVT: it.maVT, tuViTri: F.tu, soLuong: qty, nguoiMuon: name, congTrinh: F.ct || '', hanTra: F.due, ghiChu: F.note || '' });
      updateStock(it.maVT, r.stock);
      upsertLoan(r.loan);
      F.done.push({ maVT: it.maVT, name: nm1(it), qty, who: r.loan.nguoiMuon });
      toast(t('d_LEND', { w: r.loan.nguoiMuon, q: qtyU(qty, u) }));
      // Giữ người mượn, hạn trả, công trình để cho mượn tiếp món khác
      Object.assign(F, { maVT: '', _init: false, tu: '', qty: '1', note: '', pickQ: '', who: r.loan.nguoiMuon });
      render(); window.scrollTo(0, 0);

  });
};

/* ---------------- In tem QR ---------------- */
let qrReady = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const had = document.querySelector('script[src="' + src + '"]');
    if (had && had.dataset.ok) return res();
    const s = had || document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => { s.dataset.ok = '1'; res(); };
    s.onerror = () => { s.remove(); rej(new Error('load ' + src)); };
    if (!had) document.head.appendChild(s);
  });
}
function ensureQR() {
  if (!qrReady) qrReady = loadScript(LIB_QR).then(() => {
    if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  }).catch(e => { qrReady = null; throw e; });
  return qrReady;
}
function qrSvg(text) {
  if (!window.qrcode) return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/></svg>';
  const q = qrcode(0, 'M'); q.addData(String(text)); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="${esc(text)}"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelHtml(kind, code) {
  if (kind === 'loc') {
    const l = S.locMap.get(code) || { maViTri: code };
    const parts = [l.kho && 'Kho ' + l.kho, l.day && 'Dãy ' + l.day, l.ke && 'Kệ ' + l.ke, l.tang && 'Tầng ' + l.tang].filter(Boolean).join(' · ');
    return `<div class="lbl loc"><div class="lbl-qr">${qrSvg(l.maViTri)}</div><div class="lbl-txt">
      <div class="lbl-code">${esc(l.maViTri)}</div><div class="lbl-spec">${esc(parts)}</div>
      ${l.moTaVI ? `<div class="lbl-vi">${esc(l.moTaVI)}</div>` : ''}${l.moTaZH ? `<div class="lbl-zh">${esc(l.moTaZH)}</div>` : ''}</div></div>`;
  }
  const it = S.itemMap.get(code) || { maVT: code };
  return `<div class="lbl"><div class="lbl-qr">${qrSvg(it.maVT)}</div><div class="lbl-txt">
    <div class="lbl-code">${esc(it.maVT)}</div>${it.tenVI ? `<div class="lbl-vi">${esc(it.tenVI)}</div>` : ''}
    ${it.tenZH ? `<div class="lbl-zh">${esc(it.tenZH)}</div>` : ''}${it.quyCach ? `<div class="lbl-spec">${esc(it.quyCach)}</div>` : ''}</div></div>`;
}

    </div>
    <div class="list" id="lblList" style="max-height:320px;overflow-y:auto"></div>
    <p class="help muted" style="margin:0;font-size:12.5px">${t('paper')}</p>
    <div id="lblPrevBox"></div>
    ${IS_PREVIEW ? `<p class="note">${t('printPreviewNote')}</p>` : ''}
    <button type="button" class="btn primary" id="lblPrint" data-act="print" ${IS_PREVIEW ? 'hidden' : ''}></button>
  </div>`;
  const drawPrev = () => {
    const sel = p.sel[p.kind];
    const codes = src.map(o => o[key].toUpperCase()).filter(c => sel.has(c));
    const total = codes.length * p.copies, pv = [];
    codes.forEach(c => { for (let i = 0; i < p.copies && pv.length < 8; i++) pv.push(labelHtml(p.kind, c)); });
    $('#lblCopies').textContent = p.copies;
    $('#lblPrevBox').innerHTML = pv.length ? `<div class="lbl-preview">${pv.join('')}${total > pv.length ? `<span class="muted" style="align-self:center">${t('more', { n: total - pv.length })}</span>` : ''}</div>` : '';
    const b = $('#lblPrint'); b.disabled = !total; b.innerHTML = ic('print') + t('print', { n: total });
    if (codes.length && !window.qrcode) ensureQR().then(() => { if (cur().p === p) drawPrev(); }).catch(() => toast(t('network'), 'bad'));
  };
  const drawList = () => {
    const sel = p.sel[p.kind];
    const shown = p.f.trim() ? src.filter(o => matchScore(o, p.f) > 0) : src;
    $('#lblList').innerHTML = shown.map(o => {
      const c = o[key].toUpperCase();
      return `<label class="sel-row"><input type="checkbox" data-code="${esc(c)}" ${sel.has(c) ? 'checked' : ''}>
        <span class="row-main"><span><span class="plate ${p.kind === 'loc' ? 'loc' : ''}">${esc(o[key])}</span></span>
        <span class="nm2">${esc(p.kind === 'item' ? [nm1(o), nm2(o)].filter(Boolean).join(' / ') : locFull(o))}</span></span></label>`;
    }).join('') || `<p class="empty" style="padding:0 14px">${t('noResults')}</p>`;
    $('#lblList').querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
      if (cb.checked) sel.add(cb.dataset.code); else sel.delete(cb.dataset.code);
      drawPrev();
    }));
    drawPrev();
  };
  p._drawList = drawList; p._drawPrev = drawPrev;
  const f = $('#lblF');
  f.addEventListener('input', () => { p.f = f.value; drawList(); });
  drawList();
};
async function doPrint(p) {
  const key = p.kind === 'item' ? 'maVT' : 'maViTri';
  const src = p.kind === 'item' ? S.items : S.locs;
  const codes = src.map(o => o[key].toUpperCase()).filter(c => p.sel[p.kind].has(c));
  if (!codes.length) return toast(t('selNone'), 'bad');
  try { await ensureQR(); } catch (e) { return toast(t('network'), 'bad'); }
  const all = [];
  codes.forEach(c => { for (let i = 0; i < p.copies; i++) all.push(labelHtml(p.kind, c)); });
  let html = '';
  for (let i = 0; i < all.length; i += 24) html += '<div class="page">' + all.slice(i, i + 24).join('') + '</div>';
  $('#printArea').innerHTML = html;
  setTimeout(() => window.print(), 150);
}

/* ---------------- Quét mã ---------------- */
const SC = { q: null, cb: null, gen: 0, done: false };
function scanLib() {
  const w = window, L2 = w.__Html5QrcodeLibrary__ || {};
  return { Q: w.Html5Qrcode || L2.Html5Qrcode, F: w.Html5QrcodeSupportedFormats || L2.Html5QrcodeSupportedFormats };
}
function scanCfg(F) {
  const c = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
  if (F) c.formatsToSupport = ['QR_CODE', 'CODE_128', 'CODE_39', 'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'ITF', 'DATA_MATRIX'].map(k => F[k]).filter(v => v !== undefined);
  return c;
}
async function openScanner(cb) {
  SC.cb = cb; SC.done = false; const gen = ++SC.gen;
  $('#scanner').hidden = false; document.body.classList.add('noscroll');
  $('#scanTitle').innerHTML = t('scanTitle');
  $('#scanClose').innerHTML = ic('close'); $('#scanClose').setAttribute('aria-label', tp('close'));
  $('#scanPhotoBtn').innerHTML = ic('camera') + t('scanPhoto');
  $('#scanCode').value = ''; $('#scanCode').placeholder = tp('scanManual');
  const msg = $('#scanMsg'), reader = $('#reader');
  if (IS_PREVIEW || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    reader.hidden = true; msg.innerHTML = IS_PREVIEW ? t('scanPreview') : t('scanNoCam'); return;
  }
  reader.hidden = false; msg.innerHTML = t('loading');
  try {
    await loadScript(LIB_SCAN);
    if (gen !== SC.gen) return;
    const { Q, F } = scanLib();
    const q = new Q('reader', scanCfg(F));
    SC.q = q;
    await q.start({ facingMode: 'environment' }, {
      fps: 10, aspectRatio: 1.333,
      qrbox: (w, h) => ({ width: Math.floor(Math.min(w, 360) * 0.85), height: Math.floor(Math.min(h, 360) * 0.6) })
    }, text => gotCode(text), () => {});
    if (gen !== SC.gen) { stopLive(); return; }
    msg.innerHTML = t('scanHint');
  } catch (e) {
    if (gen !== SC.gen) return;
    SC.q = null; reader.hidden = true; msg.innerHTML = t('scanNoCam');
  }
}
function stopLive() {
  const q = SC.q; SC.q = null;
  if (q) { try { q.stop().then(() => q.clear()).catch(() => {}); } catch (e) { /* bỏ qua */ } }
}
function closeScanner() {
  SC.gen++; stopLive();
  $('#scanner').hidden = true; document.body.classList.remove('noscroll');
}
function gotCode(text) {
  if (SC.done) return;
  const code = String(text || '').trim();
  if (!code) return;
  SC.done = true;
  try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* bỏ qua */ }
  const cb = SC.cb; closeScanner();
  if (cb) cb(code);
}
$('#scanClose').addEventListener('click', closeScanner);
$('#scanManual').addEventListener('submit', e => { e.preventDefault(); gotCode($('#scanCode').value); });
$('#scanPhotoBtn').addEventListener('click', () => { stopLive(); $('#reader').hidden = true; $('#scanFile').value = ''; $('#scanFile').click(); });
$('#scanFile').addEventListener('change', async () => {
  const file = $('#scanFile').files[0]; if (!file) return;
  const msg = $('#scanMsg'); msg.innerHTML = t('scanReading');
  try {
    await loadScript(LIB_SCAN);
    const { Q, F } = scanLib();
    const q = new Q('qrFileReader', scanCfg(F));
    const text = await q.scanFile(file, false);
    try { q.clear(); } catch (e) { /* bỏ qua */ }
    gotCode(text);
  } catch (e) { msg.innerHTML = t('scanFail'); }
});
function openCode(code) {
  const it = findItemByCode(code);
  if (it) return go('item', { id: it.maVT });
  const l = S.locMap.get(code.toUpperCase());
  if (l) return go('loc', { id: l.maViTri });
  openSheet(`<h3>${t('unknownCode', { x: code })}</h3><div class="btns">
    ${can('danhmuc') ? `<button type="button" class="btn signal" data-act="addBarcode" data-code="${esc(code)}">${ic('add')}${t('addWithBarcode')}</button>` : ''}
    <button type="button" class="btn" data-act="searchCode" data-code="${esc(code)}">${ic('search')}${t('searchIt')}</button>
    <button type="button" class="btn" data-act="sheetClose">${t('close')}</button></div>`);
}

/* ---------------- Bấm nút (uỷ quyền sự kiện) ---------------- */
const ACT = {
  back: () => goBack(),
  userMenu: () => userMenu(),
  sheetBg: (el, ev) => { if (ev.target === el) closeSheet(); },

  itemForm: el => go('itemForm', { id: el.dataset.id || '', name: el.dataset.name || '' }),
  addBarcode: el => { closeSheet(); go('itemForm', { barcode: el.dataset.code }); },
  searchCode: el => { closeSheet(); S.q = el.dataset.code; if (cur().v !== 'home') { NAV.length = 1; } render(); },
  locForm: el => go('locForm', { id: el.dataset.id || '' }),
  labels: el => go('labels', { kind: el.dataset.kind || 'item', id: el.dataset.id || '' }),
  lblKind: el => { cur().p.kind = el.dataset.kind; render(); },
  lblAll: () => { const p = cur().p; const key = p.kind === 'item' ? 'maVT' : 'maViTri'; const src = p.kind === 'item' ? S.items : S.locs;
    (p.f.trim() ? src.filter(o => matchScore(o, p.f) > 0) : src).forEach(o => p.sel[p.kind].add(o[key].toUpperCase())); p._drawList(); },
  lblNone: () => { const p = cur().p; p.sel[p.kind].clear(); p._drawList(); },
  copies: el => { const p = cur().p; p.copies = Math.min(10, Math.max(1, p.copies + Number(el.dataset.d))); p._drawPrev(); },
  print: () => doPrint(cur().p),
  logF: el => { cur().p.loai = el.dataset.loai; render(); },
  userForm: el => go('userForm', { id: el.dataset.id || '' }),
  // Mượn – trả
  lend: el => go('lend', { maVT: el.dataset.id || '' }),
  lendDone: () => goBack(),
  loanOpen: el => go('giveBack', { id: el.dataset.id }),
  loanTab: el => { cur().p.tab = el.dataset.tab; render(); },
  due: el => {
    const F = cur().p; F.due = addDays(Number(el.dataset.d));
    const d = $('#fDue'); if (d) d.value = F.due;
    document.querySelectorAll('[data-act="due"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  },
  whoPick: el => {
    const F = cur().p; F.who = el.dataset.name;
    const w = $('#fWho'); if (w) { w.value = F.who; w.dispatchEvent(new Event('input')); }
  },
  scanReturn: () => openScanner(code => {
    const it = findItemByCode(code);
    if (!it) return toast(t('unknownCode', { x: code }), 'bad');
    const k = it.maVT.toUpperCase(), ls = S.loans.filter(L => L.maVT === k);
    if (!ls.length) return toast(t('noOpenLoanFor', { x: it.maVT }), 'bad');
    if (ls.length === 1) return go('giveBack', { id: ls[0].id });
    const p = cur().p; p.tab = 'open'; p.f = it.maVT; render();
  })
};
/* ---------------- iPhone: chạm vào ô nhập phải mở được bàn phím ---------------- */
// iOS chỉ mở bàn phím khi ô được focus ngay trong lần chạm. Nếu ô đang "kẹt" (có focus mà không có bàn phím)
// thì chạm lại không có tác dụng → nhả focus lúc bắt đầu chạm, rồi focus lại khi nhấc tay.
const TEXT_IN = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=date]):not([disabled]):not([readonly]),textarea';
function kbOpen() { const v = window.visualViewport; return !!v && v.height < window.innerHeight * 0.8; }
const TAP = { el: null, x: 0, y: 0 };
document.addEventListener('touchstart', e => {
  const el = e.target.closest ? e.target.closest(TEXT_IN) : null;
  TAP.el = el;
  if (!el) return;
  const p = e.touches[0]; TAP.x = p.clientX; TAP.y = p.clientY;
  if (el === document.activeElement && !kbOpen()) el.blur();
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!TAP.el) return;
  const p = e.touches[0];
  if (Math.abs(p.clientX - TAP.x) > 10 || Math.abs(p.clientY - TAP.y) > 10) TAP.el = null;   // đang cuộn, không phải chạm
}, { passive: true });
document.addEventListener('touchend', () => {
  const el = TAP.el; TAP.el = null;
  if (el && el.isConnected && el !== document.activeElement) { try { el.focus(); } catch (err) { /* bỏ qua */ } }
}, { passive: true });
// Mở lại app từ nền (iOS hay làm ô nhập "chết"): nhả focus và vẽ lại màn hình hiện tại
let hiddenAt = 0;
function resumeApp() {
  const a = document.activeElement; if (a && a.blur && a !== document.body) a.blur();
  if (!$('#scanner').hidden || $('#sheetRoot').firstChild) return;
  const p = cur().p || {};
  try { if (p._sync) p._sync(); if (p.F && p.F._sync) p.F._sync(); } catch (err) { /* bỏ qua */ }
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 1000) resumeApp();
  hiddenAt = 0;
});
window.addEventListener('pageshow', e => { if (e.persisted) resumeApp(); });

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, ev);
});

})();
