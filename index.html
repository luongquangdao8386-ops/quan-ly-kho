const THU_MUC_SAO_LUU = 'Kho Cơ Điện – Sao lưu';
const THU_MUC_ANH = 'Kho Cơ Điện – Ảnh vật tư';
const SO_BAN_SAO_LUU = 12;       // giữ 12 bản mới nhất (khoảng 3 tháng), bản cũ hơn vào thùng rác

// Thư mục trong Google Drive: nhớ mã thư mục; bị xoá thì tạo lại.
function thuMuc(ten, khoa) {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty(khoa);
  if (id) {
    try { const f = DriveApp.getFolderById(id); if (!f.isTrashed()) return f; } catch (e) { /* thư mục đã bị xoá */ }
  }
  const it = DriveApp.getFoldersByName(ten);
  const f = it.hasNext() ? it.next() : DriveApp.createFolder(ten);
  props.setProperty(khoa, f.getId());
  return f;
}

/** Chép cả file Sheet vào thư mục "Kho Cơ Điện – Sao lưu" trong Google Drive. Chạy tay được. */
function saoLuu() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const folder = thuMuc(THU_MUC_SAO_LUU, 'THU_MUC_SAO_LUU');
  const now = new Date();
  const p = function (n) { return ('0' + n).slice(-2); };
  const ten = ss.getName() + ' – sao lưu ' + ngayChu(now) + ' ' + p(now.getHours()) + 'h' + p(now.getMinutes());
  DriveApp.getFileById(ss.getId()).makeCopy(ten, folder);
  const ds = [];
  const it = folder.getFiles();
  while (it.hasNext()) { const f = it.next(); if (f.getMimeType() === MimeType.GOOGLE_SHEETS) ds.push(f); }
  ds.sort(function (a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });
  ds.slice(SO_BAN_SAO_LUU).forEach(function (f) { f.setTrashed(true); });
  PropertiesService.getScriptProperties().setProperty('SAO_LUU_CUOI', now.toISOString());
  return 'Đã sao lưu: ' + ten;
}

// Chạy theo lịch mỗi tuần. Chờ thao tác ghi đang chạy xong để bản sao không bị dở dang.
function saoLuuTuDong() {
  const lock = LockService.getScriptLock();
  const coKhoa = lock.tryLock(60000);
  try { return saoLuu(); } finally { if (coKhoa) lock.releaseLock(); }
}

/** Bật sao lưu tự động mỗi Chủ nhật, 21–22 giờ (chạy lại không bị trùng). */
function batSaoLuuTuDong() {
  xoaLich('saoLuuTuDong');
  ScriptApp.newTrigger('saoLuuTuDong').timeBased().onWeekDay(ScriptApp.WeekDay.SUNDAY).atHour(21).create();
  return 'Đã bật sao lưu tự động mỗi Chủ nhật 21–22 giờ.';
}
function tatSaoLuuTuDong() { xoaLich('saoLuuTuDong'); return 'Đã tắt sao lưu tự động.'; }

// Màn Quản trị hệ thống trong app
function thongTinQuanTri() {
  const props = PropertiesService.getScriptProperties();
  const bt = caiDatBaoTin();
  let lich = [], coQuyen = true, mailConLai = -1;
  try { lich = ScriptApp.getProjectTriggers().map(function (t) { return t.getHandlerFunction(); }); } catch (e) { coQuyen = false; }
  try { mailConLai = MailApp.getRemainingDailyQuota(); } catch (e) { mailConLai = -1; }
  let loi = null;
  try { loi = JSON.parse(props.getProperty('BAO_TIN_LOI') || 'null'); } catch (e) { loi = null; }
  const nd = docBang('NguoiDung');
  return {
    phienBan: PHIEN_BAN, muiGio: Session.getScriptTimeZone(), coQuyen: coQuyen,
    saoLuu: { cuoi: str(props.getProperty('SAO_LUU_CUOI')), tuDong: lich.indexOf('saoLuuTuDong') >= 0, soBan: SO_BAN_SAO_LUU, thuMuc: THU_MUC_SAO_LUU },
    baoTin: {
      tgBat: !!bt.tgBat, tgCoMa: !!bt.tgToken, tgMaCuoi: bt.tgToken ? String(bt.tgToken).slice(-4) : '',
      tgChat: str(bt.tgChat), tgTen: str(bt.tgTen), mailBat: !!bt.mailBat,
      sang: !!bt.sang, gioSang: so(bt.gioSang), lichSang: lich.indexOf('baoTinBuoiSang') >= 0,
      linkApp: str(bt.linkApp), mailConLai: mailConLai, loi: loi,
      coEmail: nd.filter(function (x) { return laDung(x.HoatDong) && laEmail(str(x.Email)); }).length
    }
  };
}

/* ------------------------------------------------------------------ */
/*  Bản 1.3 · Nhập danh mục vật tư từ Excel                           */
/*  Điện thoại đọc file Excel, gửi từng gói tối đa 200 dòng.          */
/*  Mã đã có → cập nhật (ô trống = giữ nguyên). Không ghi mã mà trùng  */
/*  tên + quy cách với vật tư đã có → cập nhật vật tư đó.              */
/*  Số lượng đầu chỉ áp dụng cho vật tư mới.                           */
/* ------------------------------------------------------------------ */

const NHAP_TOI_DA = 200;
function khoaTen(vi, zh, qc) {
  const s = function (x) { return str(x).toLowerCase().replace(/\s+/g, ' '); };
  return (s(vi) || s(zh)) + '|' + s(qc);
}
function coGiaTri(v) { return v !== null && v !== undefined && str(v) !== ''; }
function nhomTheoMa(maVT) {
  const m = /^([A-Z]+)-\d+$/.exec(hoa(maVT));
  if (!m) return '';
  return Object.keys(TIEN_TO).filter(function (k) { return TIEN_TO[k] === m[1]; })[0] || '';
}

function nhapVatTu(u, p) {
  const rows = Array.isArray(p.rows) ? p.rows : [];
  if (!rows.length) throw loi('THIEU_DU_LIEU');
  if (rows.length > NHAP_TOI_DA) throw loi('NHAP_NHIEU');
  const sh = capNhatTieuDe('VatTu'), cols = BANG.VatTu, n = sh.getLastRow();
  const C = {};
  cols.forEach(function (c, i) { C[c] = i; });
  const all = n >= 2 ? sh.getRange(2, 1, n - 1, cols.length).getValues() : [];
  const soCu = all.length;
  const dsViTri = docBang('ViTri').map(function (v) { return hoa(v.MaViTri); });
  const theoMa = {}, theoTen = {}, theoMaVach = {}, lonNhat = {};
  function ghiNho(r, i) {
    const m = hoa(r[C.MaVT]);
    if (!m) return;
    theoMa[m] = i;
    const k = khoaTen(r[C.TenVI], r[C.TenZH], r[C.QuyCach]);
    if (!(k in theoTen)) theoTen[k] = i;
    const b = hoa(r[C.Barcode]);
    if (b) theoMaVach[b] = m;
    const mm = /^([A-Z]+)-(\d+)$/.exec(m);
    if (mm) lonNhat[mm[1]] = Math.max(lonNhat[mm[1]] || 0, Number(mm[2]));
  }
  all.forEach(ghiNho);
  function kiemMaVach(b, maVT) {
    if (!b) return;
    const B = b.toUpperCase();
    if ((theoMaVach[B] && theoMaVach[B] !== maVT) || (B in theoMa && B !== maVT) || dsViTri.indexOf(B) >= 0) throw loi('TRUNG_BARCODE', b);
  }
  function soKhongAm(v) {
    const x = lamTron(Number(str(v).replace(',', '.')));
    if (!isFinite(x) || x < 0) throw loi('SO_LUONG');
    return x;
  }

  const daGap = {}, doi = {}, tonDau = [], loiDs = [];
  let soMoi = 0, soSua = 0, soGiu = 0;
  rows.forEach(function (x, k) {
    x = x || {};
    const dong = so(x.dong) || k + 1;
    try {
      const tenVI = sach(x.tenVI, 150), tenZH = sach(x.tenZH, 150), quyCach = sach(x.quyCach, 150);
      const nhom = sach(x.nhom, 20), donVi = sach(x.donVi, 20), barcode = sach(x.barcode, 60), ghiChu = sach(x.ghiChu, 300);
      let maVT = ma(x.maVT), idx = -1;
      if (maVT) { if (maVT in theoMa) idx = theoMa[maVT]; }
      else if (tenVI || tenZH) { const kt = khoaTen(tenVI, tenZH, quyCach); if (kt in theoTen) idx = theoTen[kt]; }
      if (idx >= 0) maVT = hoa(all[idx][C.MaVT]);
      if (maVT && daGap[maVT]) throw loi('TRUNG_FILE', String(daGap[maVT]));
      if (idx >= soCu) throw loi('TRUNG_FILE', '');

      if (idx < 0) {
        // Vật tư mới
        if (!tenVI && !tenZH) throw loi('THIEU_TEN');
        const nh = nhom || nhomTheoMa(maVT);
        if (!nh) throw loi('THIEU_NHOM');
        if (!donVi) throw loi('THIEU_DON_VI');
        if (maVT && dsViTri.indexOf(maVT) >= 0) throw loi('TRUNG_MA', maVT);
        const tmin = coGiaTri(x.tonToiThieu) ? soKhongAm(x.tonToiThieu) : 0;
        const sl = coGiaTri(x.soLuongDau) ? soKhongAm(x.soLuongDau) : 0;
        const vtri = hoa(x.viTri);
        if (sl > 0) {
          if (!vtri) throw loi('THIEU_VITRI');
          if (dsViTri.indexOf(vtri) < 0) throw loi('KHONG_CO_VITRI', vtri);
          canQuyen(u, 'nhapxuat');
        }
        let maMoi = maVT;
        if (!maMoi) {
          const tt = TIEN_TO[nh] || 'VT';
          maMoi = tt + '-' + ('000' + ((lonNhat[tt] || 0) + 1)).slice(-4);
        }
        kiemMaVach(barcode, maMoi);
        const r = cols.map(function () { return ''; });
        r[C.MaVT] = maMoi; r[C.Barcode] = barcode; r[C.TenVI] = tenVI; r[C.TenZH] = tenZH; r[C.QuyCach] = quyCach;
        r[C.DonVi] = donVi; r[C.Nhom] = nh; r[C.TonToiThieu] = tmin; r[C.GhiChu] = ghiChu; r[C.NgayTao] = new Date();
        all.push(r);
        ghiNho(r, all.length - 1);
        daGap[maMoi] = dong;
        if (sl > 0) tonDau.push({ maVT: maMoi, viTri: vtri, sl: sl });
        soMoi++;
        return;
      }
      // Cập nhật: kiểm tra hết rồi mới ghi, ô trống giữ nguyên
      const r = all[idx];
      const moi = {};
      if (tenVI) moi.TenVI = tenVI;
      if (tenZH) moi.TenZH = tenZH;
      if (quyCach) moi.QuyCach = quyCach;
      if (nhom) moi.Nhom = nhom;
      if (donVi) moi.DonVi = donVi;
      if (ghiChu) moi.GhiChu = ghiChu;
      if (coGiaTri(x.tonToiThieu)) moi.TonToiThieu = soKhongAm(x.tonToiThieu);
      if (barcode) { kiemMaVach(barcode, maVT); moi.Barcode = barcode; }
      daGap[maVT] = dong;
      const khac = Object.keys(moi).some(function (c) { return str(r[C[c]]) !== str(moi[c]); });
      if (!khac) { soGiu++; return; }
      const bCu = hoa(r[C.Barcode]);
      Object.keys(moi).forEach(function (c) { r[C[c]] = moi[c]; });
      if (bCu && theoMaVach[bCu] === maVT && bCu !== hoa(r[C.Barcode])) delete theoMaVach[bCu];
      ghiNho(r, idx);
      doi[idx] = true;
      soSua++;
    } catch (e) {
      loiDs.push({ dong: dong, code: e.code || 'LOI', msg: str(e.message) });
    }
  });

  // Ghi hàng loạt: vật tư sửa (ít thì từng dòng, nhiều thì cả khối), vật tư mới một lần
  const sua = Object.keys(doi).map(Number);
  if (sua.length > 20) sh.getRange(2, 1, soCu, cols.length).setValues(all.slice(0, soCu));
  else sua.forEach(function (i) { sh.getRange(i + 2, 1, 1, cols.length).setValues([all[i]]); });
  const hang = function (r) { const o = {}; cols.forEach(function (c, i) { o[c] = r[i]; }); return o; };
  const moiRows = all.slice(soCu).map(hang);
  themNhieu('VatTu', moiRows);

  // Tồn đầu: cộng vào tồn kho + ghi giao dịch NHAP
  const stock = [];
  if (tonDau.length) {
    const ton = docBang('TonKho'), shTon = sheet('TonKho');
    const cSL = BANG.TonKho.indexOf('SoLuong') + 1;
    const themTon = [], gd = [], goc = maGiaoDich();
    tonDau.forEach(function (t, i) {
      const r = ton.filter(function (z) { return hoa(z.MaVT) === t.maVT && hoa(z.MaViTri) === t.viTri; })[0];
      if (r) { r.SoLuong = lamTron(so(r.SoLuong) + t.sl); shTon.getRange(r._row, cSL, 1, 2).setValues([[r.SoLuong, new Date()]]); }
      else { const z = { MaVT: t.maVT, MaViTri: t.viTri, SoLuong: t.sl, CapNhat: new Date() }; themTon.push(z); ton.push(z); }
      gd.push({
        ID: goc + '-' + (i + 1), ThoiGian: new Date(), Loai: 'NHAP', MaVT: t.maVT, TuViTri: '', DenViTri: t.viTri,
        SoLuong: t.sl, CongTrinh: '', GhiChu: 'Tồn đầu (nhập Excel) 期初（Excel导入）', NguoiDung: str(u.Ten)
      });
    });
    themNhieu('TonKho', themTon);
    kiemCotGD();
    themNhieu('GiaoDich', gd);
    const cacMa = tonDau.map(function (t) { return t.maVT; });
    ton.forEach(function (z) {
      if (cacMa.indexOf(hoa(z.MaVT)) >= 0 && so(z.SoLuong) !== 0) stock.push({ maVT: hoa(z.MaVT), maViTri: hoa(z.MaViTri), soLuong: so(z.SoLuong) });
    });
  }
  if (soMoi || soSua) ghiNhatKy(str(u.Ten), 'NHAP_EXCEL', 'Mới ' + soMoi + ' · Sửa ' + soSua + ' · Giữ nguyên ' + soGiu + ' · Lỗi ' + loiDs.length);
  return {
    moi: soMoi, sua: soSua, giu: soGiu, loi: loiDs,
    items: sua.map(function (i) { return vatTuRa(hang(all[i])); }).concat(moiRows.map(vatTuRa)),
    stock: stock
  };
}

/* ------------------------------------------------------------------ */
/*  Bản 1.3 · Báo cáo xuất kho theo công trình                        */
/*  Chỉ tính giao dịch XUAT (gồm xuất theo phiếu đề xuất).            */
/*  Mượn dụng cụ không tính. Không ghi công trình: gom một nhóm.      */
/* ------------------------------------------------------------------ */

const BAO_CAO_CHI_TIET = 3000;   // số dòng chi tiết tối đa trả về
function khoaCT(x) { return str(x).toLowerCase().replace(/\s+/g, ' '); }
function ngayTuChu(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); }

// Người nhận của một dòng xuất. Dòng ghi trước bản 1.3.2 chưa có cột này: xuất theo phiếu thì lấy người đề xuất trong ghi chú.
function nhanCuaGD(nn, ghiChu) {
  if (nn) return nn;
  const m = /^DX-\d+ · ([^·]+?)(?: · |$)/.exec(ghiChu);
  return m ? m[1].trim() : '';
}

function baoCao(p) {
  const tu = str(p.tu), den = str(p.den);
  if (!laNgay(tu) || !laNgay(den) || tu > den) throw loi('KHOANG_NGAY');
  const a = ngayTuChu(tu), b = ngayTuChu(den);
  b.setDate(b.getDate() + 1);
  // p.ct: không gửi = mọi công trình; '' = chỉ giao dịch không ghi công trình; chữ = một công trình
  const loc = p.ct === undefined || p.ct === null ? null : khoaCT(p.ct);
  const kq = { tu: tu, den: den, congTrinhs: [], theoCT: [], theoVT: [], chiTiet: [], soLan: 0, catBot: false };
  const sh = sheet('GiaoDich'), n = sh.getLastRow(), cols = BANG.GiaoDich;
  if (n < 2) return kq;
  // Đọc cột thời gian trước để biết khoảng dòng cần đọc (giao dịch ghi nối tiếp theo thời gian)
  const tg = sh.getRange(2, cols.indexOf('ThoiGian') + 1, n - 1, 1).getValues();
  let dau = -1, cuoi = -1;
  for (let i = 0; i < tg.length; i++) {
    const t = tg[i][0];
    if (t instanceof Date && t >= a && t < b) { if (dau < 0) dau = i; cuoi = i; }
  }
  if (dau < 0) return kq;
  const vals = sh.getRange(dau + 2, 1, cuoi - dau + 1, cols.length).getValues();
  const C = {};
  cols.forEach(function (c, i) { C[c] = i; });
  const dsCT = {}, theoCT = {}, theoVT = {};
  vals.forEach(function (r) {
    const t = r[C.ThoiGian];
    if (!(t instanceof Date) || t < a || t >= b || str(r[C.Loai]) !== 'XUAT') return;
    const ten = str(r[C.CongTrinh]), k = khoaCT(ten), maVT = hoa(r[C.MaVT]), sl = so(r[C.SoLuong]);
    if (!dsCT[k]) dsCT[k] = { k: k, ten: ten, soLan: 0 };
    dsCT[k].soLan++;
    if (loc !== null && k !== loc) return;
    const phieu = (/\bDX-\d+/.exec(str(r[C.GhiChu])) || [''])[0];
    kq.soLan++;
    if (!theoCT[k]) theoCT[k] = { k: k, ten: ten, soLan: 0, vt: {} };
    const c = theoCT[k];
    c.soLan++;
    if (!c.vt[maVT]) c.vt[maVT] = { maVT: maVT, sl: 0, lan: 0, phieu: [] };
    const d = c.vt[maVT];
    d.sl = lamTron(d.sl + sl); d.lan++;
    if (phieu && d.phieu.indexOf(phieu) < 0) d.phieu.push(phieu);
    if (!theoVT[maVT]) theoVT[maVT] = { maVT: maVT, sl: 0, lan: 0, ct: {} };
    const v = theoVT[maVT];
    v.sl = lamTron(v.sl + sl); v.lan++;
    v.ct[k] = { ten: ten, sl: lamTron(((v.ct[k] || {}).sl || 0) + sl) };
    if (kq.chiTiet.length < BAO_CAO_CHI_TIET) {
      kq.chiTiet.push({ time: iso(t), ct: ten, maVT: maVT, sl: sl, tu: hoa(r[C.TuViTri]), phieu: phieu, nguoi: str(r[C.NguoiDung]),
        nhan: nhanCuaGD(str(r[C.NguoiNhan]), str(r[C.GhiChu])), ghiChu: str(r[C.GhiChu]) });
    } else kq.catBot = true;
  });
  const theoTenCT = function (x, y) { return !x.k ? 1 : !y.k ? -1 : x.ten.localeCompare(y.ten); };
  kq.congTrinhs = Object.keys(dsCT).map(function (k) { return dsCT[k]; }).sort(theoTenCT);
  kq.theoCT = Object.keys(theoCT).map(function (k) {
    const c = theoCT[k];
    return { k: c.k, ten: c.ten, soLan: c.soLan, dong: Object.keys(c.vt).sort().map(function (m) { return c.vt[m]; }) };
  }).sort(theoTenCT);
  kq.theoVT = Object.keys(theoVT).sort().map(function (m) {
    const v = theoVT[m];
    return { maVT: m, sl: v.sl, lan: v.lan, ct: Object.keys(v.ct).map(function (k) { return v.ct[k]; }).sort(function (x, y) { return y.sl - x.sl; }) };
  });
  return kq;
}

/*  Bản 1.3 · Báo tin qua nhóm Telegram và email                      */
/*  Quản trị nhập mã bot, nhóm, bật/tắt từng kênh trong app            */
/*  (lưu trong Script Properties, không để trong code).                */
/* ------------------------------------------------------------------ */

const BAO_TIN_MAC_DINH = { tgBat: false, tgToken: '', tgChat: '', tgTen: '', mailBat: false, sang: true, gioSang: 7, linkApp: '' };
const DON_VI = { cai: 'cái 个', chiec: 'chiếc 台', bo: 'bộ 套', met: 'm 米', cuon: 'cuộn 卷', cay: 'cây 根',
  hop: 'hộp 盒', kg: 'kg 公斤', lit: 'lít 升', binh: 'bình 瓶', tui: 'túi 袋', tam: 'tấm 张' };
const TIN_CHO = [];   // tin chờ gửi trong lần xử lý này (gửi sau khi nhả khoá)

function caiDatBaoTin() {
  let o = {};
  try { o = JSON.parse(PropertiesService.getScriptProperties().getProperty('BAO_TIN') || '{}') || {}; } catch (e) { o = {}; }
  return Object.assign({}, BAO_TIN_MAC_DINH, o);
}
function luuCaiDatBaoTin(o) { PropertiesService.getScriptProperties().setProperty('BAO_TIN', JSON.stringify(o)); }

function datLichBaoSang(gio) {
  xoaLich('baoTinBuoiSang');
  ScriptApp.newTrigger('baoTinBuoiSang').timeBased().everyDays(1).atHour(Math.min(23, Math.max(0, Math.round(so(gio))))).create();
}

function luuBaoTin(u, p) {
  const bt = caiDatBaoTin();
  const token = str(p.tgToken).replace(/\s+/g, '');
  if (token) {
    if (!/^\d{5,}:[\w-]{20,}$/.test(token)) throw loi('TG_MA');
    bt.tgToken = token;
  }
  if (p.xoaMa === true) bt.tgToken = '';
  const chat = str(p.tgChat).replace(/\s+/g, '');
  if (chat && !/^(-?\d{3,20}|@\w{4,})$/.test(chat)) throw loi('TG_NHOM');
  bt.tgChat = chat;
  bt.tgTen = sach(p.tgTen, 100);
  bt.tgBat = p.tgBat === true;
  if (bt.tgBat && (!bt.tgToken || !bt.tgChat)) throw loi('TG_THIEU');
  bt.mailBat = p.mailBat === true;
  bt.sang = p.sang !== false;
  const gioCu = so(bt.gioSang), gio = Math.round(Number(p.gioSang));
  if (isFinite(gio) && gio >= 0 && gio <= 23) bt.gioSang = gio;
  const link = str(p.linkApp);
  if (/^https:\/\/[^\s"'<>]+$/.test(link)) bt.linkApp = link.slice(0, 200);
  luuCaiDatBaoTin(bt);
  try { if (bt.gioSang !== gioCu || !coLich('baoTinBuoiSang')) datLichBaoSang(bt.gioSang); } catch (e) { /* chưa chạy capQuyen */ }
  ghiNhatKy(str(u.Ten), 'CAI_DAT_BAO_TIN', 'Telegram ' + (bt.tgBat ? 'bật' : 'tắt') + ' · Email ' + (bt.mailBat ? 'bật' : 'tắt'));
  return thongTinQuanTri();
}

function goiTelegram(token, method, body) {
  const res = UrlFetchApp.fetch('https://api.telegram.org/bot' + token + '/' + method, {
    method: 'post', contentType: 'application/json', payload: JSON.stringify(body || {}), muteHttpExceptions: true
  });
  try { return JSON.parse(res.getContentText()); } catch (e) { return { ok: false, description: 'HTTP ' + res.getResponseCode() }; }
}

// Tìm các nhóm đã nhắn tin cho bot (thêm bot vào nhóm rồi gửi một tin bất kỳ trong nhóm).
function timNhomTelegram(p) {
  const token = str(p.tgToken).replace(/\s+/g, '') || caiDatBaoTin().tgToken;
  if (!token) throw loi('TG_THIEU');
  if (!/^\d{5,}:[\w-]{20,}$/.test(token)) throw loi('TG_MA');
  const r = goiTelegram(token, 'getUpdates', {});
  if (!r.ok) throw loi(/unauthorized|not found/i.test(str(r.description)) ? 'TG_MA' : 'TG_LOI', str(r.description));
  const thay = {}, out = [];
  (r.result || []).slice().reverse().forEach(function (x) {
    const m = x.message || x.edited_message || x.channel_post || x.my_chat_member || x.chat_member;
    const c = m && m.chat;
    if (!c || thay[c.id]) return;
    thay[c.id] = true;
    out.push({ id: String(c.id), ten: str(c.title) || [str(c.first_name), str(c.last_name)].join(' ').trim() || str(c.username), loai: str(c.type) });
  });
  return out.sort(function (x, y) { return (x.loai === 'private') - (y.loai === 'private'); });
}

function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function guiTelegram(bt, dong) {
  const text = '<b>' + escHtml(dong[0]) + '</b>\n' + dong.slice(1).map(escHtml).join('\n');
  const body = { chat_id: bt.tgChat, text: text.slice(0, 4000), parse_mode: 'HTML', disable_web_page_preview: true };
  let r = goiTelegram(bt.tgToken, 'sendMessage', body);
  // Nhóm được nâng cấp thành siêu nhóm: Telegram đổi mã nhóm → lưu mã mới rồi gửi lại
  const moi = r && !r.ok && r.parameters && r.parameters.migrate_to_chat_id;
  if (moi) {
    const bt2 = caiDatBaoTin(); bt2.tgChat = String(moi); luuCaiDatBaoTin(bt2);
    bt.tgChat = String(moi); body.chat_id = bt.tgChat;
    r = goiTelegram(bt.tgToken, 'sendMessage', body);
  }
  if (!r || !r.ok) throw loi('TG_LOI', str(r && r.description));
}

function guiMail(ds, tieuDe, dong) {
  if (!ds.length) return;
  MailApp.sendEmail({ to: ds.join(','), subject: '[Kho Cơ Điện 机电仓库] ' + tieuDe, body: dong.join('\n'), name: 'Kho Cơ Điện 机电仓库' });
}

// Người nhận email: theo vai trò (không ai có email thì gửi Quản trị) + người cụ thể; bỏ người vừa làm.
function nguoiNhanMail(nd, tin) {
  const co = nd.filter(function (x) { return laDung(x.HoatDong) && laEmail(str(x.Email)); });
  let ds = [];
  (tin.vaiTro || []).forEach(function (vt) {
    let c = co.filter(function (x) { return str(x.VaiTro) === vt; });
    if (!c.length) c = co.filter(function (x) { return str(x.VaiTro) === 'admin'; });
    ds = ds.concat(c);
  });
  (tin.ids || []).forEach(function (id) { ds = ds.concat(co.filter(function (x) { return str(x.ID) === id; })); });
  const out = [];
  ds.forEach(function (x) {
    const e = str(x.Email).toLowerCase();
    if (str(x.ID) !== str(tin.tru) && out.indexOf(e) < 0) out.push(e);
  });
  return out;
}

function ghiLoiBaoTin(kenh, e) {
  try {
    PropertiesService.getScriptProperties().setProperty('BAO_TIN_LOI',
      JSON.stringify({ time: new Date().toISOString(), kenh: kenh, msg: str(e && (e.message || e)).slice(0, 300) }));
  } catch (x) { /* bỏ qua */ }
}

// tin: { tieuDe (tiêu đề email), dong: [dòng đầu là tiêu đề, ...], vaiTro: [...], ids: [...], tru: id người làm }
function baoTin(tin) { TIN_CHO.push(tin); }

function guiTinCho() {
  if (!TIN_CHO.length) return;
  const ds = TIN_CHO.splice(0);
  try {
    const bt = caiDatBaoTin();
    if (!bt.tgBat && !bt.mailBat) return;
    let nd = null;
    ds.forEach(function (tin) {
      const dong = tin.dong.concat(bt.linkApp ? ['', bt.linkApp] : []);
      if (bt.tgBat && bt.tgToken && bt.tgChat) {
        try { guiTelegram(bt, dong); } catch (e) { ghiLoiBaoTin('Telegram', e); }
      }
      if (bt.mailBat) {
        try {
          if (!nd) nd = docBang('NguoiDung');
          guiMail(nguoiNhanMail(nd, tin), tin.tieuDe, dong);
        } catch (e) { ghiLoiBaoTin('Email', e); }
      }
    });
  } catch (e) { ghiLoiBaoTin('?', e); }
}

function tenDV(d) { return DON_VI[d] || d || ''; }
function ngayNgan(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s)); return m ? m[3] + '/' + m[2] : str(s); }

// Nội dung báo tin phiếu đề xuất (song ngữ, có số phiếu)
function baoTinDX(kieu, r, u, lyDo, ttCu) {
  const bt = caiDatBaoTin();
  if (!bt.tgBat && !bt.mailBat) return;
  const vt = {};
  docBang('VatTu').forEach(function (v) { vt[hoa(v.MaVT)] = v; });
  const lines = dongDX(r);
  function dsVT(key) {
    const ds = lines.filter(function (l) { return l[key] > 0; });
    const out = ds.slice(0, 12).map(function (l) {
      const v = vt[l.maVT] || {};
      return '• ' + (str(v.TenVI) || str(v.TenZH) || l.maVT) + ' (' + l.maVT + ') × ' + lamTron(l[key]) + ' ' + tenDV(str(v.DonVi));
    });
    if (ds.length > 12) out.push('… +' + (ds.length - 12));
    return out;
  }
  const id = str(r.ID), nguoi = str(u.Ten), taoId = str(r.NguoiTaoID);
  const dau = [id + ' · ' + str(r.CongTrinh), 'Người đề xuất 申请人: ' + str(r.NguoiTao)];
  const can = ngayChu(r.CanNgay) ? ['Cần ngày 需用日期: ' + ngayNgan(ngayChu(r.CanNgay))] : [];
  const ghi = str(r.GhiChu) ? ['Ghi chú 备注: ' + str(r.GhiChu)] : [];
  const yk = str(r.YKien);
  const ly = str(lyDo) ? ['Lý do 原因: ' + str(lyDo)] : [];
  let tin;
  if (kieu === 'moi' || kieu === 'guiLai') {
    const tieu = kieu === 'moi' ? '📋 Phiếu đề xuất mới · 新物料申请' : '✏️ Phiếu đã sửa, gửi duyệt lại · 申请已修改，重新提交';
    tin = { tieuDe: id + ' cần duyệt · 待审批', vaiTro: ['kysu'],
      dong: [tieu].concat(dau, can, dsVT('sl'), ghi, ['👉 Chờ kỹ sư duyệt · 等待工程师审批']) };
  } else if (kieu === 'duyet') {
    tin = { tieuDe: id + ' đã duyệt · 已批准', vaiTro: ['thukho'], ids: [taoId],
      dong: ['✅ Đã duyệt · 已批准'].concat(dau, ['Người duyệt 审批人: ' + nguoi], yk ? ['Ý kiến 意见: ' + yk] : [], can, dsVT('duyet'),
        ['👉 Chờ thủ kho xuất · 等待仓管员出库']) };
  } else if (kieu === 'tuChoi') {
    tin = { tieuDe: id + ' bị từ chối · 已驳回', ids: [taoId],
      dong: ['❌ Bị từ chối · 已驳回'].concat(dau, ['Người duyệt 审批人: ' + nguoi, 'Lý do 原因: ' + yk],
        ['👉 Sửa phiếu rồi gửi lại · 可修改后重新提交']) };
  } else if (kieu === 'xuatXong') {
    tin = { tieuDe: id + ' đã xuất đủ · 已全部出库', ids: [taoId],
      dong: ['📦 Đã xuất đủ · 已全部出库'].concat(dau, ['Thủ kho 仓管员: ' + nguoi], dsVT('daXuat')) };
  } else if (kieu === 'dong') {
    tin = { tieuDe: id + ' đã đóng · 已关闭', ids: [taoId],
      dong: ['📦 Đã đóng phiếu, xuất một phần · 申请已关闭（部分出库）'].concat(dau, ['Người đóng 关闭人: ' + nguoi], ly, dsVT('daXuat')) };
  } else if (kieu === 'huy') {
    // Người tạo tự huỷ: báo người đang phải xử lý; người khác huỷ: báo người tạo
    const tuHuy = str(u.ID) === taoId;
    if (tuHuy && ttCu !== 'CHO_DUYET' && ttCu !== 'DA_DUYET') return;
    tin = { tieuDe: id + ' đã huỷ · 已撤销',
      vaiTro: tuHuy ? [ttCu === 'DA_DUYET' ? 'thukho' : 'kysu'] : [], ids: tuHuy ? [] : [taoId],
      dong: ['🚫 Phiếu đã huỷ · 申请已撤销'].concat(dau, ['Người huỷ 撤销人: ' + nguoi], ly) };
  } else return;
  tin.tru = str(u.ID);
  baoTin(tin);
}

/** Chạy mỗi sáng (hẹn giờ): dụng cụ quá hạn trả, vật tư dưới mức tối thiểu, phiếu đang chờ → thủ kho. */
function baoTinBuoiSang() {
  const bt = caiDatBaoTin();
  if (!bt.sang || (!bt.tgBat && !bt.mailBat)) return 'Chưa bật báo tin buổi sáng.';
  const tin = tinBuoiSang();
  if (!tin) return 'Không có việc cần nhắc.';
  TIN_CHO.length = 0;
  baoTin(tin);
  guiTinCho();
  return 'Đã gửi nhắc việc buổi sáng.';
}

function tinBuoiSang() {
  const now = new Date(), homNay = ngayChu(now);
  const vt = {}, dsVT = docBang('VatTu');
  dsVT.forEach(function (v) { vt[hoa(v.MaVT)] = v; });
  const ten = function (m) { const v = vt[m] || {}; return (str(v.TenVI) || str(v.TenZH) || m) + ' (' + m + ')'; };
  const quaHan = taiPhieuMuon().loans.filter(function (L) { return L.hanTra && L.hanTra < homNay; })
    .sort(function (x, y) { return x.hanTra < y.hanTra ? -1 : 1; });
  const ton = {};
  docBang('TonKho').forEach(function (r) { const m = hoa(r.MaVT); ton[m] = lamTron((ton[m] || 0) + so(r.SoLuong)); });
  const thieu = dsVT.filter(function (v) { return so(v.TonToiThieu) > 0 && (ton[hoa(v.MaVT)] || 0) < so(v.TonToiThieu); });
  const mo = taiDeXuat({ VaiTro: 'admin', ID: '' });
  const choDuyet = mo.filter(function (r) { return r.trangThai === 'CHO_DUYET'; }).length;
  const choXuat = mo.filter(function (r) { return r.trangThai === 'DA_DUYET'; }).length;
  if (!quaHan.length && !thieu.length && !choDuyet && !choXuat) return null;
  const dong = ['☀️ Nhắc việc buổi sáng ' + ngayNgan(homNay) + ' · 早间提醒'];
  const toiDa = 15;
  if (quaHan.length) {
    dong.push('', '⏰ Dụng cụ quá hạn trả · 工具逾期未还: ' + quaHan.length);
    quaHan.slice(0, toiDa).forEach(function (L) {
      const tre = Math.round((ngayTuChu(homNay) - ngayTuChu(L.hanTra)) / 864e5);
      dong.push('• ' + ten(L.maVT) + ' × ' + L.conLai + ' — ' + L.nguoiMuon + ' — hạn 期限 ' + ngayNgan(L.hanTra) +
        ' (quá ' + tre + ' ngày · 逾期' + tre + '天)');
    });
    if (quaHan.length > toiDa) dong.push('… +' + (quaHan.length - toiDa));
  }
  if (thieu.length) {
    dong.push('', '📉 Dưới mức tối thiểu · 低于最低库存: ' + thieu.length);
    thieu.slice(0, toiDa).forEach(function (v) {
      const m = hoa(v.MaVT);
      dong.push('• ' + ten(m) + ': còn 剩 ' + (ton[m] || 0) + ' / tối thiểu 最低 ' + so(v.TonToiThieu) + ' ' + tenDV(str(v.DonVi)));
    });
    if (thieu.length > toiDa) dong.push('… +' + (thieu.length - toiDa));
  }
  if (choDuyet || choXuat) dong.push('', '📋 Phiếu chờ duyệt · 待审批: ' + choDuyet + ' · Chờ xuất · 待出库: ' + choXuat);
  return { tieuDe: 'Nhắc việc buổi sáng ' + ngayNgan(homNay) + ' · 早间提醒', vaiTro: ['thukho'], dong: dong, tru: '' };
}

// Nút "Gửi thử" trong app: gửi ngay, báo kết quả từng kênh
function thuBaoTin(u) {
  const bt = caiDatBaoTin();
  const dong = ['🔔 Tin thử từ Kho Cơ Điện · 机电仓库测试消息', 'Người gửi 发送人: ' + str(u.Ten),
    'Nhận được tin này là báo tin đã chạy. · 收到此消息说明通知已生效。'].concat(bt.linkApp ? ['', bt.linkApp] : []);
  const kq = { telegram: 'TAT', email: 'TAT', emailTo: '' };
  if (bt.tgBat) {
    try { guiTelegram(bt, dong); kq.telegram = 'OK'; } catch (e) { kq.telegram = str(e.message) || 'LOI'; ghiLoiBaoTin('Telegram', e); }
  }
  if (bt.mailBat) {
    const me = str(u.Email);
    if (!laEmail(me)) kq.email = 'CHUA_CO_EMAIL';

    }
  }
  if (kq.telegram === 'OK' || kq.email === 'OK') PropertiesService.getScriptProperties().deleteProperty('BAO_TIN_LOI');
  return kq;
}

/*  Điện thoại thu nhỏ ảnh (cạnh dài 1024px) rồi gửi lên.              */
/*  Mỗi vật tư một ảnh; thay ảnh thì ảnh cũ vào thùng rác.             */

const ANH_TOI_DA = 3000000;   // số ký tự base64 tối đa (~2.2MB ảnh)
function luuAnhVatTu(u, p) {
  const maVT = hoa(p.maVT);
  const sh = capNhatTieuDe('VatTu');
  const v = maVT ? docBang('VatTu').filter(function (x) { return hoa(x.MaVT) === maVT; })[0] : null;
  if (!v) throw loi('KHONG_CO_VT', maVT);
  const cu = str(v.Anh);
  let moi = '';
  if (p.xoa !== true) {
    const b64 = String(p.base64 || '').replace(/^data:image\/[\w+.-]+;base64,/, '').replace(/\s+/g, '');
    if (!b64 || b64.length > ANH_TOI_DA || !/^[A-Za-z0-9+/]+=*$/.test(b64)) throw loi('ANH_LOI');
    const ten = (maVT + ' ' + (str(v.TenVI) || str(v.TenZH))).replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 80).trim() + '.jpg';
    const f = thuMuc(THU_MUC_ANH, 'THU_MUC_ANH').createFile(Utilities.newBlob(Utilities.base64Decode(b64), 'image/jpeg', ten));
    // Ai có đường link đều xem được: điện thoại hiện ảnh không cần đăng nhập Google
    try { f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); }
    catch (e) { f.setTrashed(true); throw loi('ANH_CHIA_SE', str(e.message)); }
    moi = f.getId();
  }
  sh.getRange(v._row, BANG.VatTu.indexOf('Anh') + 1).setValue(moi);
  if (cu && cu !== moi) { try { DriveApp.getFileById(cu).setTrashed(true); } catch (e) { /* ảnh cũ đã bị xoá tay */ } }
  v.Anh = moi;
  ghiNhatKy(str(u.Ten), moi ? 'ANH_VAT_TU' : 'XOA_ANH_VAT_TU', maVT);
  return { item: vatTuRa(v) };
}

/** Chạy 1 lần sau khi dán code. Chạy lại cũng không mất dữ liệu đã có. */
function caiDat() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const props = PropertiesService.getScriptProperties();
  if (!props.getProperty('SALT')) props.setProperty('SALT', Utilities.getUuid());

  Object.keys(BANG).forEach(function (ten) {
    const sh = ss.getSheetByName(ten);
    if (!sh) { taoTrang(ss, ten); return; }
    const cols = BANG[ten];
    dinhDangChu(sh, ten, 1, sh.getMaxRows());
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#f5c400');
    sh.setFrozenRows(1);
  });

  const trong = function (ten) { return sheet(ten).getLastRow() < 2; };
  const now = Date.now(), gio = 3600 * 1000;
  const vatTuMau = trong('VatTu');   // chỉ thêm phiếu đề xuất mẫu khi vật tư cũng là mẫu

  if (trong('ViTri')) {
    themNhieu('ViTri', MAU.viTri.map(function (r) {
      return { MaViTri: r[0], Kho: r[1], Day: r[2], Ke: r[3], Tang: r[4], MoTaVI: r[5], MoTaZH: r[6] };
    }));
  }
  if (trong('VatTu')) {
    themNhieu('VatTu', MAU.vatTu.map(function (r) {
      return { MaVT: r[0], Barcode: r[1], TenVI: r[2], TenZH: r[3], QuyCach: r[4], DonVi: r[5], Nhom: r[6], TonToiThieu: r[7], GhiChu: '', NgayTao: new Date(now - 240 * gio) };
    }));
  }
  if (trong('TonKho') && trong('GiaoDich')) {
    // Tính ngược tồn đầu kỳ từ tồn hiện tại và các giao dịch mẫu
    const dau = {};
    const khoa = function (m, v) { return m + '|' + v; };
    const coMuon = trong('MuonTra');
    MAU.ton.forEach(function (r) { dau[khoa(r[0], r[1])] = r[2]; });
    MAU.giaoDich.slice().reverse().forEach(function (g) {
      const loai = g[0], m = g[1], tu = g[2], den = g[3], sl = g[4];
      if (loai === 'XUAT' || loai === 'CHUYEN') dau[khoa(m, tu)] = (dau[khoa(m, tu)] || 0) + sl;
      if (loai === 'CHUYEN') dau[khoa(m, den)] = (dau[khoa(m, den)] || 0) - sl;
    });
    if (coMuon) MAU.muonTra.forEach(function (r) { dau[khoa(r[0], r[1])] = (dau[khoa(r[0], r[1])] || 0) + r[2]; });
    const gd = [];
    Object.keys(dau).forEach(function (k) {
      if (dau[k] <= 0) return;
      const p = k.split('|');
      gd.push({ t: now - 216 * gio, ID: 'GD-MAU-' + (gd.length + 1), Loai: 'NHAP', MaVT: p[0], TuViTri: '', DenViTri: p[1], SoLuong: dau[k], CongTrinh: '', GhiChu: 'Tồn đầu kỳ (dữ liệu mẫu)', NguoiDung: 'Thủ kho Lan' });
    });
    MAU.giaoDich.forEach(function (g, i) {
      gd.push({ t: now - g[6] * gio, ID: 'GD-MAU-X' + (i + 1), Loai: g[0], MaVT: g[1], TuViTri: g[2], DenViTri: g[3], SoLuong: g[4], CongTrinh: g[5], GhiChu: '', NguoiDung: g[7], NguoiNhan: g[8] || '' });
    });
    if (coMuon) {
      const phieu = MAU.muonTra.map(function (r, i) {
        const t = now - r[5] * gio;
        gd.push({ t: t, ID: 'GD-MAU-M' + (i + 1), Loai: 'MUON', MaVT: r[0], TuViTri: r[1], DenViTri: '', SoLuong: r[2], CongTrinh: r[4], GhiChu: '[' + r[3] + ']', NguoiDung: r[7], NguoiNhan: r[3] });
        return {
          ID: 'MT-MAU-' + (i + 1), ThoiGian: new Date(t), MaVT: r[0], TuViTri: r[1], SoLuong: r[2], NguoiMuon: r[3], CongTrinh: r[4],
          HanTra: ngayChu(new Date(t + r[6] * 24 * gio)), GhiChu: '', NguoiChoMuon: r[7], DaTra: 0, Hong: 0, Mat: 0,
          TrangThai: 'DANG_MUON', CapNhat: new Date(t), LichSuTra: ''
        };
      });
      themNhieu('MuonTra', phieu);
    }
    gd.sort(function (a, b) { return a.t - b.t; });
    themNhieu('GiaoDich', gd.map(function (g) { g.ThoiGian = new Date(g.t); return g; }));
    themNhieu('TonKho', MAU.ton.map(function (r) {
      return { MaVT: r[0], MaViTri: r[1], SoLuong: r[2], CapNhat: new Date(now - 2 * gio) };
    }));
  }
  if (trong('NguoiDung')) {
    themNhieu('NguoiDung', MAU.nguoiDung.map(function (r) {
      return { ID: r[0], Ten: r[1], PinHash: bamPin(r[2]), VaiTro: r[3], HoatDong: true, NgayTao: new Date() };
    }));
  }
  if (vatTuMau && trong('DeXuat')) {
    const ten = function (id) { const x = MAU.nguoiDung.filter(function (n) { return n[0] === id; })[0]; return x ? x[1] : id; };
    const ghiMau = function (t, noiDung, nguoi) { return gioChu(new Date(t)) + ' · ' + noiDung + ' (' + nguoi + ')'; };
    themNhieu('DeXuat', MAU.deXuat.map(function (r, i) {
      const t = now - r[2] * gio, tDuyet = t + r[8] * gio, tt = r[3];
      const lines = r[4].map(function (x) { return { maVT: x[0], sl: x[1], duyet: x.length > 2 ? x[2] : 0, daXuat: 0 }; });
      const lich = [ghiMau(t, 'Tạo 创建 · ' + lines.length + ' mục 项', ten(r[1]))];
      if (tt === 'DA_DUYET') lich.push(ghiMau(tDuyet, 'Duyệt 批准' + (r[7] ? ': ' + r[7] : ''), 'Kỹ sư Minh'));
      if (tt === 'TU_CHOI') lich.push(ghiMau(tDuyet, 'Từ chối 驳回: ' + r[7], 'Kỹ sư Minh'));
      const daXuLy = tt !== 'CHO_DUYET';
      return {
        ID: 'DX-' + String(i + 1).padStart(4, '0'), ThoiGian: new Date(t), NguoiTao: ten(r[1]), NguoiTaoID: r[1], CongTrinh: r[0],
        CanNgay: r[5] === null ? '' : ngayChu(new Date(now + r[5] * 24 * gio)), GhiChu: r[6], ChiTiet: JSON.stringify(lines),
        TrangThai: tt, NguoiDuyet: daXuLy ? 'Kỹ sư Minh' : '', ThoiGianDuyet: daXuLy ? new Date(tDuyet) : '', YKien: r[7],
        CapNhat: new Date(daXuLy ? tDuyet : t), LichSu: lich.join(' | ')
      };
    }));
  }

  // Xoá trang trống mặc định (Trang tính1 / Sheet1)
  ss.getSheets().forEach(function (sh) {
    if (!BANG[sh.getName()] && sh.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(sh);
  });
  return 'Đã cài đặt xong. Tiếp theo: Triển khai → Ứng dụng web.';
}

/** Xoá toàn bộ vật tư, vị trí, tồn kho, giao dịch, phiếu mượn, phiếu đề xuất (giữ người dùng và nhật ký). */

  ['VatTu', 'ViTri', 'TonKho', 'GiaoDich', 'MuonTra', 'DeXuat'].forEach(function (ten) {

    if (n >= 2) sh.deleteRows(2, n - 1);

}

function fill(s, v) { return v ? s.replace(/\{(\w+)\}/g, (m, n) => (v[n] === undefined ? '' : v[n])) : s; }
function tv(k, v) { return fill(TX[k] ? TX[k][0] : k, v); }
function tz(k, v) { return fill(TX[k] ? TX[k][1] : k, v); }
// t(): HTML song ngữ "Tiếng Việt <span>中文</span>" (đã escape). tp(): chữ thường "Việt · 中文" cho thuộc tính.
function t(k, v) {
  const a = tv(k, v), c = tz(k, v);
  return esc(a) + (a === c ? '' : '<span class="zi" lang="zh-CN">' + esc(c) + '</span>');
}
function tp(k, v) { const a = tv(k, v), c = tz(k, v); return a === c ? a : a + ' · ' + c; }
function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function stor(kind, k, v) {
  try {
    const st = kind === 's' ? sessionStorage : localStorage;
    if (v === undefined) return st.getItem(k);
    if (v === null) st.removeItem(k); else st.setItem(k, v);
  } catch (e) { /* bộ nhớ trình duyệt bị chặn: bỏ qua */ }
  return null;

/* ---------------- Gọi máy chủ ---------------- */
let pending = 0;

// opts.opId: mã thao tác (máy chủ chỉ ghi một lần dù nhận nhiều lần). opts.timeout: số giây chờ tối đa.
async function api(action, payload, opts) {
  opts = opts || {};
  // Đăng nhập lúc mất mạng thì chưa có phiên: có mạng lại thì tự đăng nhập bằng PIN đang giữ trong bộ nhớ
  if (action !== 'login' && !S.token && S._pin) {
    if (!await ensureToken()) throw { ok: false, code: 'MANG', message: 'offline' };
  }
  const req = { action, payload: payload || {}, token: S.token, device: deviceId() };
  if (opts.opId) req.opId = opts.opId;
  let res;
  busy(1);
  try {
    if (DEMO) {
      if (S.simDown) { await new Promise(r => setTimeout(r, 200)); throw new Error('offline (demo)'); }
      res = await DemoBackend.call(req);
    } else {
      // Sóng yếu: không chờ quá lâu. Việc ghi có mã thao tác nên gửi lại sau cũng không bị trùng.
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const tm = setTimeout(() => { if (ctl) ctl.abort(); }, (opts.timeout || (action === 'data' ? 45 : 30)) * 1000);
      try {
        const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined });
        res = await r.json();
      } finally { clearTimeout(tm); }
    }
  } catch (e) {

  } finally { busy(-1); }
  setOffline(res.code === 'MANG');
  if (!res.ok) {
    if (res.code === 'HET_PHIEN' && action !== 'login' && S.token) { endSession(); toast(t('sessionExpired'), 'bad'); }
    throw res;
  }
  return res.data;
}

/* ---------------- Mạng yếu: hàng chờ gửi ---------------- */

}

// Ghi dữ liệu. Có mạng: gửi ngay như cũ (lỗi nghiệp vụ báo ngay). Mất mạng: lưu vào hàng chờ, hiện luôn trên máy.
// Trả về { data } (máy chủ đã làm, có kết quả), { queued, tmpId } (đang chờ gửi) hoặc { dup, id } (máy chủ đã làm từ trước).
async function send(action, payload, info) {

  const now = new Date(op.t).toISOString();

      congTrinh: p.congTrinh || '', hanTra: p.hanTra, ghiChu: p.ghiChu || '', nguoiChoMuon: S.me.ten, daTra: 0, hong: 0, mat: 0,

      canNgay: p.canNgay || '', ghiChu: p.ghiChu || '', lines: mergeLines(p.lines),
      trangThai: 'CHO_DUYET', nguoiDuyet: '', tgDuyet: '', yKien: '', capNhat: now, lichSu: '' });

        const l = R.lines.find(z => z.maVT === U(x.maVT)); if (!l) return;
        add(x.maVT, x.tuViTri, -Number(x.soLuong)); l.daXuat = r3(l.daXuat + Number(x.soLuong));
      });
      if (p.dong || R.lines.every(l => l.daXuat >= l.duyet)) R.trangThai = 'HOAN_TAT';
    } else if (op.a === 'closeRequest') {
      if (!reqOpen(R)) return;

    } else if (op.a === 'editRequest') {

// Dòng vật tư của phiếu: gộp dòng trùng mã (giống máy chủ)
function mergeLines(lines) {
  const gop = new Map();
  (lines || []).forEach(x => {
    const m = String(x.maVT || '').toUpperCase();
    gop.set(m, Math.round(((gop.get(m) || 0) + Number(x.soLuong)) * 1000) / 1000);
  });
  return [...gop].map(([m, sl]) => ({ maVT: m, sl, duyet: 0, daXuat: 0 }));
}

// Gửi lần lượt các việc đang chờ. Việc bị máy chủ từ chối thì đánh dấu lỗi, việc sau vẫn gửi tiếp.
// Tự gửi lại cách nhau ít nhất 10 giây (tránh gửi dồn dập khi sóng chập chờn); bấm "Gửi ngay" thì gửi luôn.
let flushP = null, lastFlushTry = 0;
function flush(manual) {
  if (flushP) return flushP;
  if (!S.me || !waitingOps().length) return Promise.resolve();
  if (!manual && Date.now() - lastFlushTry < 10000) return Promise.resolve();
  lastFlushTry = Date.now();
  flushP = (async () => {
    let sent = 0, bad = 0;
    updateNet();
    try {
      for (const op of waitingOps()) {
        try {
          const r = await api(op.a, op.p, { opId: op.id });
          const newId = r && (r.dup ? r.id : (r.request && r.request.id) || (r.loan && r.loan.id));
          if (newId) S.idMap['tmp-' + op.id] = newId;
          op.st = 'ok'; op.okAt = Date.now(); sent++;
        } catch (e) {
          if (e.code === 'MANG' || e.code === 'HET_PHIEN' || !S.me) break;
          op.st = 'loi'; op.err = { code: e.code || 'LOI', message: String(e.message || '') }; bad++;
        }
        saveQ();
      }
      if (sent || bad) { try { await loadData(); } catch (e) { rebuild(); } }
      if (bad) toast(t('syncFailed', { n: bad }), 'bad');
      else if (sent) toast(t('synced', { n: sent }));
      else if (manual && S.offline) toast(t('network'), 'bad');
    } finally {
      flushP = null;
      if (sent || bad) refreshView(); else updateNet();
      // Có việc mới được thêm trong lúc đang gửi: gửi tiếp
      if (sent && !S.offline && waitingOps().length) { lastFlushTry = 0; setTimeout(() => flush(), 0); }
    }
  })();
  return flushP;
}

let reconP = null;
function reconnect(reload, fresh) {
  if (fresh) lastFlushTry = 0;
  if (reconP || !S.me) return reconP || Promise.resolve();
  reconP = (async () => {
    try {
      if (waitingOps().length) await flush();
      else if (S.offline || reload) { await loadData(); refreshView(); }
    } catch (e) { /* vẫn mất mạng */ }
  })().finally(() => { reconP = null; updateNet(); });

}

// Lúc đăng nhập có mạng, lưu trên máy một mã băm chậm (PBKDF2) của PIN, không lưu PIN.
async function pinHash(pin, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 100000 }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function canHash() { return !!(window.crypto && crypto.subtle && window.TextEncoder); }
async function rememberPin(pin, user) {
  if (!canHash()) return;
  try {
    const salt = rid() + rid();
    const h = await pinHash(pin, salt);
    const list = (pjson('kho_ol') || []).filter(x => x.me && x.me.id !== user.id);
    list.unshift({ me: user, salt, h, at: Date.now() });
    pset('kho_ol', JSON.stringify(list.slice(0, 8)));
  } catch (e) { /* bỏ qua */ }
}
function forgetPin(uid) {
  if (!uid) return;
  const list = (pjson('kho_ol') || []).filter(x => x.me && x.me.id !== uid);
  pset('kho_ol', list.length ? JSON.stringify(list) : null);
}
// Trả về người dùng khớp PIN, null nếu không khớp. Sai 5 lần liền: khoá 5 phút (throw KHOA).
async function offlineCheck(pin) {
  const lk = pjson('kho_olf') || { n: 0, until: 0 };
  if (lk.until > Date.now()) throw { code: 'KHOA' };
  const list = pjson('kho_ol') || [];
  if (!list.length || !canHash()) return null;
  for (const x of list) {
    if (await pinHash(pin, x.salt) === x.h) { pset('kho_olf', null); return x.me; }
  }
  lk.n = (lk.n || 0) + 1;
  if (lk.n >= 5) { lk.n = 0; lk.until = Date.now() + 5 * 60000; }
  pset('kho_olf', JSON.stringify(lk));
  return null;
}

function pinDots() { document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length)); }
async function pinKey(k) {
  if (!$('#dots') || $('#dots').dataset.wait) return;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 6) pinBuf += k;
  pinDots();
  if (pinBuf.length === 6) await doLogin(pinBuf);
}
async function doLogin(pin) {
  const dots = $('#dots'); dots.dataset.wait = '1';
  $('#pinMsg').innerHTML = t('loading');
  try {
    let r = null;
    try { r = await api('login', { pin }); }
    catch (e) {
      if (e.code === 'PIN_SAI' || e.code === 'KHOA') offlineCheck(pin).then(me => { if (me) forgetPin(me.id); }).catch(() => {});
      if (e.code !== 'MANG') throw e;
    }
    if (r) { startSession(r.token, r.user); rememberPin(pin, r.user); }
    else {
      // Mất mạng: vào bằng PIN đã từng đăng nhập trên máy này + dữ liệu lưu trên máy
      const me = await offlineCheck(pin);
      if (!me) throw { code: 'X', html: t('offlineNoPin') };
      S.sessionMe = me; S.me = me; S._pin = pin;
    }
    try { await loadData(); }
    catch (e) { if (e.code !== 'MANG' || !useSnap()) throw (e.code === 'MANG' ? { code: 'X', html: t('offlineNoData') } : e); }
    NAV.length = 0; go('home'); poke();
    if (!r) toast(t('offlineLogin'));
    else if (waitingOps().length) flush();
  } catch (e) {
    S.token = null; S.me = null; S.sessionMe = null; S._pin = null; stor('s', 'kho_tk', null);
    pinBuf = ''; delete dots.dataset.wait; pinDots();
    $('#pinMsg').innerHTML = e.html || errMsg(e);
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  }
}
async function loadData() { const t0 = Date.now(); setData(await api('data'), t0); }
function endSession() {
  saveSnap();
  S.token = null; S.me = null; S.sessionMe = null; S._pin = null; S.base = null; S.draft = null; S.idMap = {};
  stor('s', 'kho_tk', null); stor('s', 'kho_me', null);
  clearTimeout(idleT); closeSheet(); closeScanner();
  NAV.length = 0; NAV.push({ v: 'login', p: {} }); render();
}
function logout() {
  if (S.token) api('logout').catch(() => {});
  endSession();
}
let idleT;
function poke() {
  clearTimeout(idleT);
  if (S.me) idleT = setTimeout(() => { logout(); toast(t('idleOut')); }, IDLE_MIN * 60000);
}
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, poke, { passive: true }));
document.addEventListener('keydown', e => {
  if (cur().v === 'login' && !$('#sheetRoot').firstChild) {
    if (/^\d$/.test(e.key)) pinKey(e.key);
    else if (e.key === 'Backspace') pinKey('del');
  }
});

    <div class="top"><span class="plate loc huge">${esc(l.maViTri)}</span></div>

    ${l.moTaVI || l.moTaZH ? `<h1>${esc(locDesc(l))}</h1>` : ''}
    ${locDesc2(l) ? `<div class="nm2" lang="zh-CN" style="font-size:15px">${esc(locDesc2(l))}</div>` : ''}
  </div>
  ${can('nhapxuat') ? `<div class="links">
    <button type="button" class="btn small" data-act="txn" data-loai="NHAP" data-den="${esc(l.maViTri)}">${ic('NHAP')}${t('inHere')}</button>
    <button type="button" class="btn small" data-act="txn" data-loai="KIEMKE" data-den="${esc(l.maViTri)}">${ic('KIEMKE')}${t('countHere')}</button></div>` : ''}
  <h2 class="sec">${t('itemsHere')} <span class="count">${rows.length}</span></h2>
  ${rows.length ? `<div class="list">${rows.map(s => {
    const it = S.itemMap.get(s.maVT) || { maVT: s.maVT, tenVI: s.maVT, donVi: '' };
    return `<button type="button" class="row" data-act="item" data-id="${esc(s.maVT)}">
      <div class="row-main"><span class="nm">${esc(nm1(it))}</span>${nm2(it) ? `<span class="nm2" lang="zh-CN">${esc(nm2(it))}</span>` : ''}
      <span class="meta"><span class="plate">${esc(s.maVT)}</span>${it.quyCach ? `<span>${esc(it.quyCach)}</span>` : ''}</span></div>
      <div class="qty"><b>${fmt(s.soLuong)}</b><small>${esc(unitName(it.donVi))}</small></div></button>`;

/* ---------------- Nhập / xuất / chuyển / kiểm kê ---------------- */
function locOptions(sel, filterFn, qtyFn, unit) {
  return `<option value="">${esc(tp('pickLoc'))}</option>` + S.locs.filter(filterFn || (() => true)).map(l => {
    const q = qtyFn ? qtyFn(l.maViTri) : 0;
    return `<option value="${esc(l.maViTri)}" ${sel === l.maViTri ? 'selected' : ''}>${esc(l.maViTri)} · ${esc(locFull(l))}${q ? ' — ' + fmt(q) + ' ' + esc(unitName(unit)) : ''}</option>`;
  }).join('');
}
VIEWS.txn = function (F) {
  const loai = F.loai;
  const it = F.maVT ? S.itemMap.get(F.maVT.toUpperCase()) : null;
  const have = it ? it._locs : [];
  const qtyAt = m => { const s = have.find(x => x.maViTri === m); return s ? s.soLuong : 0; };
  if (it && !F._init) {
    F._init = true;
    if ((loai === 'XUAT' || loai === 'CHUYEN') && !F.tu && have.length) F.tu = have[0].maViTri;
    if ((loai === 'NHAP' || loai === 'KIEMKE') && !F.den && have.length) F.den = have[0].maViTri;
  }
  const u = it ? it.donVi : '';
  const fromField = (label) => `<div class="field"><label for="fTu">${label} <span class="req">*</span></label>
    <div class="with-btn"><select class="inp" id="fTu">${locOptions(F.tu, l => qtyAt(l.maViTri) > 0, qtyAt, u)}</select>
    <button type="button" class="sq" data-act="scanLoc" data-f="tu" aria-label="${tp('scan')}">${ic('scan')}</button></div></div>`;
  const toField = (label, exclude) => `<div class="field"><label for="fDen">${label} <span class="req">*</span></label>
    <div class="with-btn"><select class="inp" id="fDen">${locOptions(F.den, l => l.maViTri !== exclude, qtyAt, u)}</select>
    <button type="button" class="sq" data-act="scanLoc" data-f="den" aria-label="${tp('scan')}">${ic('scan')}</button></div></div>`;
  let locs = '';
  if (it) {
    if (loai === 'NHAP') locs = toField(t('toLoc'));
    else if (loai === 'KIEMKE') locs = toField(t('location'));
    else if (!have.length) locs = `<p class="note">${t('noStockHere')}</p>`;
    else if (loai === 'XUAT') locs = fromField(t('fromLoc'));
    else locs = fromField(t('fromLoc')) + toField(t('toLoc'), F.tu);
  }
  const noStock = it && (loai === 'XUAT' || loai === 'CHUYEN') && !have.length;
  main.innerHTML = `
  <form id="f" class="form" novalidate>
    <div class="field"><label class="lab" ${it ? '' : 'for="fPick"'}>${t('item')} <span class="req">*</span></label>
      ${it ? `<div class="picked"><div class="row-main"><span class="nm">${esc(nm1(it))}</span>${nm2(it) ? `<span class="nm2" lang="zh-CN">${esc(nm2(it))}</span>` : ''}
        <span class="meta"><span class="plate">${esc(it.maVT)}</span><span>${t('total')}: <b class="mono">${fmt(it._total)}</b> ${esc(unitName(u))}</span></span></div>
        <button type="button" class="btn small" data-act="unpick">${t('change')}</button></div>`
      : `<div class="with-btn"><input class="inp" id="fPick" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${esc(tp('pickItemPh'))}" value="${esc(F.pickQ || '')}">
        <button type="button" class="sq" data-act="scanItem" aria-label="${tp('scan')}">${ic('scan')}</button></div><div id="pickRes"></div>`}
    </div>
    ${locs}
    ${it && !noStock ? `
    <div class="field"><label for="fQty">${loai === 'KIEMKE' ? t('actualQty') : t('quantity')} (${esc(unitName(u))}) <span class="req">*</span></label>
      <input class="inp mono" id="fQty" inputmode="decimal" autocomplete="off" value="${esc(F.qty || '')}" placeholder="0">
      <div class="hintline" id="qtyHint"></div></div>
    ${loai === 'XUAT' ? nhanField(F.nhan) : ''}
    ${loai === 'XUAT' ? `<div class="field"><label for="fCt">${t('project')}</label><input class="inp" id="fCt" autocomplete="off" value="${esc(F.ct || '')}" placeholder="${esc(tp('projectPh'))}">
      <div class="opts" id="ctSug"></div></div>` : ''}
    <div class="field"><label for="fNote">${t('note')} <span class="muted">(${t('optional')})</span></label><input class="inp" id="fNote" value="${esc(F.note || '')}"></div>
    <button type="submit" class="btn primary" id="fSubmit">${t('c_' + loai)}</button>` : ''}
  </form>`;

  const pick = $('#fPick');
  if (pick) {
    const show = () => {
      F.pickQ = pick.value;
      const res = pick.value.trim() ? searchItems(pick.value, 8) : [];
      $('#pickRes').innerHTML = res.length ? `<div class="picker-res">${res.map(i => `<button type="button" class="row" data-act="pick" data-id="${esc(i.maVT)}">
        <div class="row-main"><span class="nm">${esc(nm1(i))}</span><span class="meta"><span class="plate">${esc(i.maVT)}</span>${i.quyCach ? `<span>${esc(i.quyCach)}</span>` : ''}</span></div>
        <div class="qty"><b>${fmt(i._total)}</b><small>${esc(unitName(i.donVi))}</small></div></button>`).join('')}</div>` : '';
    };
    pick.addEventListener('input', show); show();
  }
  const hint = () => {
    const h = $('#qtyHint'); if (!h || !it) return;
    const q = parseQty($('#fQty').value);
    if (loai === 'XUAT' || loai === 'CHUYEN') h.innerHTML = F.tu ? `<span>${t('available')}: <b>${fmt(qtyAt(F.tu))}</b> ${esc(unitName(u))}</span>` : '';
    else if (loai === 'KIEMKE') {
      const c = F.den ? qtyAt(F.den) : 0;
      const d = isNaN(q) ? null : q - c;
      h.innerHTML = F.den ? `<span>${t('current')}: <b>${fmt(c)}</b></span>` + (d === null ? '' :
        `<span>${t('diff')}: <b class="${d < 0 ? 'diff-neg' : d > 0 ? 'diff-pos' : ''}">${d > 0 ? '+' : ''}${fmt(d)}</b></span>`) : '';
    } else h.innerHTML = F.den && qtyAt(F.den) ? `<span>${t('current')}: <b>${fmt(qtyAt(F.den))}</b> ${esc(unitName(u))}</span>` : '';
  };
  const sync = () => {
    const g = id => { const e = $('#' + id); return e ? e.value : undefined; };
    if (g('fQty') !== undefined) F.qty = g('fQty');
    if (g('fCt') !== undefined) F.ct = g('fCt');
    if (g('fNhan') !== undefined) F.nhan = g('fNhan');
    if (g('fNote') !== undefined) F.note = g('fNote');
  };
  F._sync = sync;
  ['fTu', 'fDen'].forEach(id => {
    const e = $('#' + id);
    if (e) e.addEventListener('change', () => { sync(); F[id === 'fTu' ? 'tu' : 'den'] = e.value; if (id === 'fTu' && F.den === e.value) F.den = ''; render(); });
  });
  const qEl = $('#fQty'); if (qEl) qEl.addEventListener('input', hint);
  hint();
  bindCtSug(F);
  bindNhanSug(F);

  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    if (!it) return toast(t('errNoItem'), 'bad');
    const qty = parseQty(F.qty);
    if (loai === 'KIEMKE' ? !(qty >= 0) : !(qty > 0)) return toast(t(loai === 'KIEMKE' ? 'errQtyKK' : 'errQty'), 'bad');
    const needTu = loai === 'XUAT' || loai === 'CHUYEN', needDen = loai !== 'XUAT';
    if ((needTu && !F.tu) || (needDen && !F.den)) return toast(t('errNoLoc'), 'bad');
    if (needTu && qty > qtyAt(F.tu)) return toast(t('errNotEnough', { n: fmt(qtyAt(F.tu)) }), 'bad');
    const nhan = loai === 'XUAT' ? cleanName(F.nhan) : '';
    if (loai === 'XUAT' && !nhan) { toast(t('errReceiver'), 'bad'); $('#fNhan').focus(); return; }
    const btn = $('#fSubmit'); btn.disabled = true;
    try {
      const pl = { loai, maVT: it.maVT, tuViTri: needTu ? F.tu : '', denViTri: needDen ? F.den : '', soLuong: qty, congTrinh: (F.ct || '').trim(), ghiChu: F.note || '' };
      if (nhan) pl.nguoiNhan = nhan;
      const r = await send('txn', pl);
      if (r.data) updateStock(it.maVT, r.data.stock);
      if (F.ct) addProject(F.ct);
      if (nhan) addReceiver(nhan);
      const qs = qtyU(qty, u);
      toast(t(nhan ? 'd_XUAT_to' : 'd_' + loai, { q: qs, l: loai === 'XUAT' ? F.tu : F.den, a: F.tu, b: F.den, w: nhan }) + qn(r));
      finishTo('item', { id: it.maVT });
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
  });
};
// Ô người nhận (xuất kho, xuất theo phiếu): bắt buộc, có nút chọn nhanh tên đã dùng / người dùng / người mượn
function nhanField(v, help) {
  return `<div class="field"><label for="fNhan">${t('receiver')} <span class="req">*</span></label>
    <input class="inp" id="fNhan" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(v || '')}" placeholder="${esc(tp('receiverPh'))}">
    ${help ? `<p class="help muted" style="margin:0;font-size:12.5px">${t(help)}</p>` : ''}
    <div class="opts" id="nhanSug"></div></div>`;
}
function bindNhanSug(F) {
  const inp = $('#fNhan'), box = $('#nhanSug');
  if (!inp || !box) return;
  const draw = () => {
    const v = inp.value.trim(), q = norm(v).trim();
    const list = [...new Set(S.receivers.concat(S.borrowers))].filter(n => n && n !== v && (!q || norm(n).includes(q))).slice(0, 8);
    box.innerHTML = list.map(n => `<button type="button" class="chip" data-act="nhanPick" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  };
  inp.addEventListener('input', () => { F.nhan = inp.value; draw(); });
  draw();
}
// Gợi ý tên công trình đã dùng (viết thống nhất để sau này báo cáo theo công trình)
function bindCtSug(F) {
  const inp = $('#fCt'), box = $('#ctSug');
  if (!inp || !box) return;
  const draw = () => {
    const v = inp.value.trim(), q = norm(v).trim();
    const list = S.projects.filter(x => x !== v && (!q || norm(x).includes(q))).slice(0, 6);
    box.innerHTML = list.map(x => `<button type="button" class="chip" data-act="ctPick" data-name="${esc(x)}">${esc(x)}</button>`).join('');
  };
  inp.addEventListener('input', () => { F.ct = inp.value; draw(); });
  draw();
}

/* ---------------- Mượn – trả dụng cụ ---------------- */
function loanItem(L) { return S.itemMap.get(L.maVT) || { maVT: L.maVT, tenVI: L.maVT, tenZH: '', donVi: '' }; }
function duePill(L) {
  if (L.trangThai !== 'DANG_MUON') return '';
  const late = daysLate(L.hanTra);
  if (late > 0) return `<span class="pill bad">${t('overdueN', { n: late })}</span>`;
  if (late === 0) return `<span class="pill warn">${t('dueToday')}</span>`;
  return `<span class="pill grey">${t('dueShort')} ${esc(fmtDay(L.hanTra))}</span>`;
}
function pendPill() { return `<span class="pill pend">${t('pendingPill')}</span>`; }
function loanRow(L, whoFirst) {
  const it = loanItem(L);
  const open = L.trangThai === 'DANG_MUON';
  const who = `<span class="who">${ic('user')}${esc(L.nguoiMuon)}</span>`;
  const pills = open
    ? duePill(L) + (L.daTra || L.mat ? `<span class="pill grey">${t('partial', { a: fmt(L.daTra + L.mat), b: fmt(L.soLuong) })}</span>` : '')
    : `<span class="pill ok">${t('closedAt')} ${esc(fmtTime(L.capNhat))}</span>` +
      (L.hong ? `<span class="pill warn">${t('damagedQty')} ${fmt(L.hong)}</span>` : '') +
      (L.mat ? `<span class="pill bad">${t('lostQty')} ${fmt(L.mat)}</span>` : '');
  return `<button type="button" class="row" data-act="loanOpen" data-id="${esc(L.id)}">
    <div class="row-main">
      ${whoFirst ? `<span class="nm">${who}</span>` :
        `<span class="nm">${esc(nm1(it))}</span>${nm2(it) ? `<span class="nm2" lang="zh-CN">${esc(nm2(it))}</span>` : ''}
        <span class="meta"><span class="plate">${esc(it.maVT)}</span>${who}</span>`}
      <span class="meta"><span>${t('lentShort')} ${esc(fmtTime(L.time))}</span>${L.pending ? pendPill() : ''}${pills}</span>
      ${L.congTrinh ? `<span class="meta"><span>${esc(L.congTrinh)}</span></span>` : ''}
    </div>
    <div class="qty"><b>${fmt(open ? L.conLai : L.soLuong)}</b><small>${esc(unitName(it.donVi))}</small></div>
  </button>`;
}
// Mục "Đang cho mượn" trên trang vật tư: hiện khi có người đang mượn, hoặc với nhóm Dụng cụ
function lentSection(it) {
  const lent = S.loans.filter(L => L.maVT === it.maVT.toUpperCase());
  if (!lent.length && !(it.nhom === 'dungcu' && can('muontra'))) return '';
  return `<h2 class="sec">${t('lentOut')} <span class="count">${lent.length}</span></h2>
    ${lent.length ? `<div class="list">${lent.map(L => loanRow(L, true)).join('')}</div>` : `<p class="empty">${t('noLoansItem')}</p>`}
    ${can('muontra') && it._total > 0 ? `<div class="links"><button type="button" class="btn small" data-act="lend" data-id="${esc(it.maVT)}">${ic('lend')}${t('lend')}</button></div>` : ''}`;
}

VIEWS.loans = function (p) {
  p.tab = p.tab || 'open';
  if (p.f === undefined) p.f = '';
  const late = lateLoans();
  main.innerHTML = `
    ${can('muontra') ? `<div class="two" style="margin-bottom:12px">
      <button type="button" class="btn signal tall" data-act="lend">${ic('lend')}<span class="bl">${t('lend')}</span></button>
      <button type="button" class="btn tall" data-act="scanReturn">${ic('scan')}<span class="bl">${t('scanReturn')}</span></button></div>` : ''}
    <div class="seg three" role="group">${[['open', 'onLoan', S.loans.length], ['late', 'overdue', late.length], ['done', 'returned', null]].map(([k, lab, n]) =>
      `<button type="button" data-act="loanTab" data-tab="${k}" aria-pressed="${p.tab === k}">${esc(tv(lab))}<span class="zi" lang="zh-CN">${esc(tz(lab))}${n === null ? '' : `<span class="count">${n}</span>`}</span></button>`).join('')}</div>
    <label class="search-box" for="loanF" style="margin-bottom:12px">${ic('search')}<input id="loanF" type="search" autocomplete="off" placeholder="${esc(tp('loanFilterPh'))}" value="${esc(p.f)}"></label>
    <div id="loanBox"></div>`;
  const draw = () => {
    const box = $('#loanBox'); if (!box) return;
    let src = p.tab === 'done' ? S.closedLoans : p.tab === 'late' ? late : S.loans;
    if (!src) { box.innerHTML = `<p class="empty">${t('loading')}</p>`; return; }
    const toks = norm(p.f).trim().split(/\s+/).filter(Boolean);
    if (toks.length) src = src.filter(L => {
      const it = loanItem(L), h = norm([L.maVT, it.barcode, it.tenVI, it.tenZH, L.nguoiMuon, L.congTrinh].join(' '));
      return toks.every(k => h.includes(k));
    });
    box.innerHTML = src.length ? `<div class="list">${src.map(L => loanRow(L)).join('')}</div>`
      : `<p class="empty">${t(toks.length ? 'noResults' : p.tab === 'done' ? 'noReturned' : p.tab === 'late' ? 'noLate' : 'noLoans')}</p>`;
  };
  const f = $('#loanF');
  f.addEventListener('input', () => { p.f = f.value; draw(); });
  draw();
  if (p.tab === 'done') {
    const at = cur();
    api('loans', { daTra: true, limit: 150 }).then(list => { S.closedLoans = list; if (cur() === at) draw(); })
      .catch(e => { const box = $('#loanBox'); if (box && cur() === at) box.innerHTML = `<p class="empty">${errMsg(e)}</p>`; });
  }
};

        <span class="meta"><span class="plate">${esc(it.maVT)}</span><span>${t('total')}: <b class="mono">${fmt(it._total)}</b> ${esc(unitName(u))}</span></span></div>
        <button type="button" class="btn small" data-act="unpick">${t('change')}</button></div>`
      : `<div class="with-btn"><input class="inp" id="fPick" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${esc(tp('pickItemPh'))}" value="${esc(F.pickQ || '')}">
        <button type="button" class="sq" data-act="scanItem" aria-label="${tp('scan')}">${ic('scan')}</button></div><div id="pickRes"></div>`}
    </div>
    ${it && !have.length ? `<p class="note">${t('noStockLend')}</p>` : ''}
    ${it && have.length ? `
    <div class="field"><label for="fTu">${t('fromLoc')} <span class="req">*</span></label>
      <div class="with-btn"><select class="inp" id="fTu">${locOptions(F.tu, l => qtyAt(l.maViTri) > 0, qtyAt, u)}</select>
      <button type="button" class="sq" data-act="scanLoc" data-f="tu" aria-label="${tp('scan')}">${ic('scan')}</button></div></div>
    <div class="field"><label for="fQty">${t('quantity')} (${esc(unitName(u))}) <span class="req">*</span></label>
      <input class="inp mono" id="fQty" inputmode="decimal" autocomplete="off" value="${esc(F.qty)}" placeholder="1">
      <div class="hintline">${F.tu ? `<span>${t('available')}: <b>${fmt(qtyAt(F.tu))}</b> ${esc(unitName(u))}</span>` : ''}</div></div>` : ''}
    <div class="field"><label for="fWho">${t('borrower')} <span class="req">*</span></label>
      <input class="inp" id="fWho" autocomplete="off" value="${esc(F.who || '')}" placeholder="${esc(tp('borrowerPh'))}">
      <div class="opts" id="whoSug"></div></div>
    <div class="field"><label for="fDue">${t('dueDate')} <span class="req">*</span></label>

    const show = () => {
      F.pickQ = pick.value;
      const q = pick.value.trim();
      const res = q ? searchItems(q, 8) : tools;
      $('#pickRes').innerHTML = res.length ? (q ? '' : `<p class="hintline" style="margin:8px 0 6px">${t('toolsAvail')}</p>`) +
        `<div class="picker-res">${res.map(pickRow).join('')}</div>` : '';
    };
    pick.addEventListener('input', show); show();
  }
  // Gợi ý người mượn gần đây
  const who = $('#fWho');
  const sug = () => {
    const v = who.value.trim(), q = norm(v).trim();
    const names = [...new Set(S.borrowers.concat(S.loans.map(L => L.nguoiMuon)))]
      .filter(n => n && n !== v && (!q || norm(n).includes(q))).slice(0, 6);
    $('#whoSug').innerHTML = names.map(n => `<button type="button" class="chip" data-act="whoPick" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  };
  who.addEventListener('input', sug); sug();
  const due = $('#fDue');
  due.addEventListener('change', () => {
    F.due = due.value;
    main.querySelectorAll('[data-act="due"]').forEach(b => b.setAttribute('aria-pressed', String(F.due === addDays(+b.dataset.d))));
  });
  const sync = () => {
    const g = id => { const e = $('#' + id); return e ? e.value : undefined; };
    [['fQty', 'qty'], ['fWho', 'who'], ['fDue', 'due'], ['fCt', 'ct'], ['fNote', 'note']].forEach(([id, k]) => { const v = g(id); if (v !== undefined) F[k] = v; });
  };
  F._sync = sync;
  const tu = $('#fTu');
  if (tu) tu.addEventListener('change', () => { sync(); F.tu = tu.value; render(); });
  bindCtSug(F);

  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    if (!it) return toast(t('errNoItem'), 'bad');
    const qty = parseQty(F.qty);
    if (!(qty > 0)) return toast(t('errQty'), 'bad');
    if (!F.tu) return toast(t('errNoLoc'), 'bad');
    if (qty > qtyAt(F.tu)) return toast(t('errNotEnough', { n: fmt(qtyAt(F.tu)) }), 'bad');
    const name = (F.who || '').trim();
    if (!name) { toast(t('errBorrower'), 'bad'); $('#fWho').focus(); return; }
    if (!dayOf(F.due) || F.due < addDays(0)) return toast(t('errDue'), 'bad');
    const btn = $('#fSubmit'); btn.disabled = true;
    try {
      const r = await send('lend', { maVT: it.maVT, tuViTri: F.tu, soLuong: qty, nguoiMuon: name, congTrinh: (F.ct || '').trim(), hanTra: F.due, ghiChu: F.note || '' });
      if (r.data) { updateStock(it.maVT, r.data.stock); upsertLoan(r.data.loan); }
      if (F.ct) addProject(F.ct);
      const who = r.data ? r.data.loan.nguoiMuon : name.replace(/[[\]]/g, '').trim();
      F.done.push({ maVT: it.maVT, name: nm1(it), qty, who });
      toast(t('d_LEND', { w: who, q: qtyU(qty, u) }) + qn(r));
      // Giữ người mượn, hạn trả, công trình để cho mượn tiếp món khác
      Object.assign(F, { maVT: '', _init: false, tu: '', qty: '1', note: '', pickQ: '', who });
      render(); window.scrollTo(0, 0);
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
  });
};

    <div class="field"><label for="fQty">${t(lost ? 'lostQtyInp' : 'returnQty')} (${esc(unitName(u))}) <span class="req">*</span></label>

    <div class="field"><label for="fNote">${t('note')} <span class="muted">(${t('optional')})</span></label><input class="inp" id="fNote" value="${esc(p.note)}"></div>

/* ---------------- Đề xuất vật tư ---------------- */
function reqPill(R) {
  const cls = { CHO_DUYET: 'warn', DA_DUYET: 'move', HOAN_TAT: 'ok', TU_CHOI: 'bad', DA_HUY: 'grey' }[R.trangThai] || 'grey';
  return `<span class="pill ${cls}">${t('st_' + R.trangThai)}</span>` + (R.pending ? pendPill() : '');
}
function needPill(R) {
  if (!R.canNgay || !reqOpen(R)) return '';
  const late = daysLate(R.canNgay);
  if (late > 0) return `<span class="pill bad">${t('needLate', { n: late })}</span>`;
  if (late === 0) return `<span class="pill warn">${t('needToday')}</span>`;
  return `<span class="pill grey">${t('needOn', { x: fmtDay(R.canNgay) })}</span>`;
}
function reqApproved(R) { return R.trangThai === 'DA_DUYET' || R.trangThai === 'HOAN_TAT' || (R.trangThai === 'DA_HUY' && !!R.nguoiDuyet); }
function linesSummary(R) {
  const ok = reqApproved(R);
  const xs = R.lines.filter(l => !ok || l.duyet > 0).map(l => {
    const it = S.itemMap.get(l.maVT);
    return (it ? nm1(it) : l.maVT) + ' × ' + fmt(ok ? l.duyet : l.sl);
  });
  return xs.slice(0, 3).join(', ') + (xs.length > 3 ? ', …' : '');
}
function reqRow(R) {
  const ok = R.lines.filter(l => l.duyet > 0);
  const partial = R.trangThai === 'DA_DUYET' && R.lines.some(l => l.daXuat > 0);
  return `<button type="button" class="row" data-act="reqOpen" data-id="${esc(R.id)}">
    <div class="row-main">
      <span class="meta" style="margin-top:0">${isTmp(R.id) ? '' : `<span class="plate">${esc(R.id)}</span>`}${reqPill(R)}${needPill(R)}${partial ? `<span class="pill grey">${t('outProgress', { a: ok.filter(l => l.daXuat >= l.duyet).length, b: ok.length })}</span>` : ''}</span>
      <span class="nm">${esc(R.congTrinh)}</span>
      <span class="nm2">${esc(linesSummary(R))}</span>
      <span class="meta"><span class="who">${ic('user')}${esc(R.nguoiTao)}</span><span>${esc(fmtTime(R.time))}</span></span>
    </div>
    <div class="qty"><b>${R.lines.length}</b><small>${t('nLinesShort')}</small></div>
  </button>`;
}

VIEWS.reqs = function (p) {
  if (!p.tab) p.tab = can('nhapxuat') && !can('duyet') ? 'ok' : 'wait';
  if (p.f === undefined) p.f = '';
  const wait = S.requests.filter(R => R.trangThai === 'CHO_DUYET');
  const okL = S.requests.filter(R => R.trangThai === 'DA_DUYET');
  main.innerHTML = `
    ${can('dexuat') ? `<div style="margin-bottom:12px"><button type="button" class="btn signal tall full" data-act="reqNew">${ic('add')}<span class="bl">${t('reqNew')}</span></button></div>` : ''}
    <div class="seg three" role="group">${[['wait', 'st_CHO_DUYET', wait.length], ['ok', 'st_DA_DUYET', okL.length], ['done', 'tabClosed', null]].map(([k, lab, n]) =>
      `<button type="button" data-act="reqTab" data-tab="${k}" aria-pressed="${p.tab === k}">${esc(tv(lab))}<span class="zi" lang="zh-CN">${esc(tz(lab))}${n === null ? '' : `<span class="count">${n}</span>`}</span></button>`).join('')}</div>
    <label class="search-box" for="reqF" style="margin-bottom:12px">${ic('search')}<input id="reqF" type="search" autocomplete="off" placeholder="${esc(tp('reqFilterPh'))}" value="${esc(p.f)}"></label>
    <div id="reqBox"></div>`;
  const draw = () => {
    const box = $('#reqBox'); if (!box) return;
    let src;
    if (p.tab === 'done') {
      const local = S.requests.filter(R => !reqOpen(R));
      if (!S.closedReqs && !p.err && !local.length) { box.innerHTML = `<p class="empty">${t('loading')}</p>`; return; }
      const seen = new Set(); src = [];
      local.concat(S.closedReqs || []).forEach(R => { if (!seen.has(R.id)) { seen.add(R.id); src.push(R); } });
      src.sort((a, b) => b.capNhat.localeCompare(a.capNhat));
    } else src = p.tab === 'ok' ? okL : wait;
    const toks = norm(p.f).trim().split(/\s+/).filter(Boolean);
    if (toks.length) src = src.filter(R => {
      const h = norm([R.id, R.congTrinh, R.nguoiTao, R.ghiChu].concat(R.lines.map(l => {
        const it = S.itemMap.get(l.maVT); return l.maVT + ' ' + (it ? it.tenVI + ' ' + it.tenZH : '');
      })).join(' '));
      return toks.every(k => h.includes(k));
    });
    box.innerHTML = (src.length ? `<div class="list">${src.map(reqRow).join('')}</div>` : `<p class="empty">${t(toks.length ? 'noResults' : 'noReqs')}</p>`) +
      (p.tab === 'done' && p.err ? `<p class="empty">${p.err}</p>` : '');
  };
  const f = $('#reqF');
  f.addEventListener('input', () => { p.f = f.value; draw(); });
  draw();
  if (p.tab === 'done' && !p._loading) {
    const at = cur(); p._loading = true; p.err = '';
    api('requests', { done: true, limit: 150 }).then(list => { S.closedReqs = list; })
      .catch(e => { p.err = errMsg(e); })
      .finally(() => { p._loading = false; if (cur() === at) draw(); });
  }
};

// Phiếu đang soạn (giữ trên máy, rời màn hình quay lại vẫn còn)
function draftNew() { return { ct: '', need: '', note: '', lines: [], pickQ: '' }; }
// Form đang mở: phiếu đang soạn (lưu trên máy) hoặc phiếu đang sửa (chỉ trong màn hình này)
function reqF() { const p = cur().p || {}; return p.edit ? p.F : (S.draft || (S.draft = draftNew())); }
function reqSave() { if (!(cur().p || {}).edit) saveDraft(); }
function formAdd(maVT) {
