        <div class="qty"><b>${fmt(i._total)}</b><small>${esc(unitName(i.donVi))}</small></div></button>`;
    }).join('')}</div>` : '';
  };
  pick.addEventListener('input', show); show();
  bindCtSug(F);
  const need = $('#fNeed');
  need.addEventListener('change', () => {
    F.need = need.value; reqSave();
    main.querySelectorAll('[data-act="needBy"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === F.need)));
  });
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    const ct = F.ct.trim();
    if (!ct) { toast(t('errProject'), 'bad'); $('#fCt').focus(); return; }
    if (!F.lines.length) return toast(t('errReqEmpty'), 'bad');
    for (let i = 0; i < F.lines.length; i++) {
      if (parseQty(F.lines[i].q) > 0) continue;
      const it = S.itemMap.get(F.lines[i].maVT);
      toast(t('errReqQty', { x: it ? nm1(it) : F.lines[i].maVT }), 'bad');
      const e = $('#fL' + i); if (e) e.focus();
      return;
    }
    if (F.need && !dayOf(F.need)) return toast(t('errNeedBy'), 'bad');
    const btn = $('#fSubmit'); btn.disabled = true;
    const noiDung = { congTrinh: ct, canNgay: F.need || '', ghiChu: F.note.trim(), lines: F.lines.map(l => ({ maVT: l.maVT, soLuong: parseQty(l.q) })) };
    if (E) {
      try {
        const r = await send('editRequest', Object.assign({ id: E.id, trangThai: E.trangThai }, noiDung), { ct });
        if (r.data) upsertReq(r.data.request);
        toast(t(E.trangThai === 'CHO_DUYET' ? 'd_EDIT' : 'd_RESUBMIT', { x: E.id }) + qn(r));
        finishTo('req', { id: E.id });
      } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
      return;
    }
    try {
      const r = await send('request', noiDung);
      if (r.data) upsertReq(r.data.request);
      const id = r.data ? r.data.request.id : r.queued ? r.tmpId : r.id;
      S.draft = null; saveDraft();
      toast(t('d_REQ', { x: isTmp(id) ? '' : id }) + qn(r));
      if (findReq(id)) go('req', { id }, true); else finishTo('reqs', {});
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
  });
};

VIEWS.req = function (p) {
  const R = findReq(p.id);
  if (!R) { main.innerHTML = `<p class="empty">${t('errNoReq')}</p>`; return; }
  p.id = R.id;   // phiếu vừa gửi xong: đổi sang số phiếu thật
  const tmp = isTmp(R.id);
  const mode = tmp ? 'view' : R.trangThai === 'CHO_DUYET' && can('duyet') ? 'approve' : R.trangThai === 'DA_DUYET' && can('nhapxuat') ? 'issue' : 'view';
  const mineR = S.me && R.nguoiTaoId === S.me.id;
  const anyOut = R.lines.some(l => l.daXuat > 0);
  let closeKind = '';
  if (!tmp && R.trangThai === 'CHO_DUYET' && (mineR || S.me.vaiTro === 'admin')) closeKind = 'cancel';
  else if (!tmp && R.trangThai === 'DA_DUYET' && (can('nhapxuat') || (mineR && !anyOut))) closeKind = anyOut ? 'close' : 'cancel';
  const hist = R.lichSu ? R.lichSu.split(' | ') : [];
  const itemOf = l => S.itemMap.get(l.maVT) || { maVT: l.maVT, tenVI: l.maVT, tenZH: '', donVi: '', _total: 0, _locs: [] };
  const nameBlock = it => `<span class="nm">${esc(nm1(it))}</span>${nm2(it) ? `<span class="nm2" lang="zh-CN">${esc(nm2(it))}</span>` : ''}`;
  const showOk = reqApproved(R);
  const trio = (l, it) => `<span class="trio"><span>${t('qtyReq')} <b>${fmt(l.sl)}</b></span>${showOk ? `<span>${t('qtyOk')} <b>${fmt(l.duyet)}</b></span>` : ''}${l.daXuat ? `<span>${t('qtyOut')} <b>${fmt(l.daXuat)}</b></span>` : ''}${reqOpen(R) ? `<span>${t('inStock')} <b>${fmt(it._total || 0)}</b></span>` : ''}</span>`;
  const head = `
  <div class="head">
    <div class="top">${tmp ? '' : `<span class="plate big">${esc(R.id)}</span>`}${reqPill(R)}${needPill(R)}</div>
    <h1>${esc(R.congTrinh)}</h1>
  </div>
  <dl class="facts loan">
    <dt>${t('requester')}</dt><dd><span class="who">${ic('user')}${esc(R.nguoiTao)}</span> · ${esc(fmtTime(R.time))}</dd>
    ${R.canNgay ? `<dt>${t('reqNeedBy')}</dt><dd>${esc(fmtDay(R.canNgay))}</dd>` : ''}
    ${R.ghiChu ? `<dt>${t('note')}</dt><dd>${esc(R.ghiChu)}</dd>` : ''}
    ${R.nguoiDuyet ? `<dt>${t('approver')}</dt><dd>${esc(R.nguoiDuyet)}${R.tgDuyet ? ' · ' + esc(fmtTime(R.tgDuyet)) : ''}</dd>` : ''}
    ${R.yKien ? `<dt>${t('approveNote')}</dt><dd>${esc(R.yKien)}</dd>` : ''}
  </dl>
  ${tmp ? `<p class="note" style="margin-top:12px">${t('reqPendingSync')}</p>` : ''}`;
  const canEdit = !tmp && (mineR || S.me.vaiTro === 'admin') && reqEditable(R);
  const canCopy = !reqOpen(R) && R.trangThai !== 'TU_CHOI' && can('dexuat');
  const btns = [
    canEdit ? `<button type="button" class="btn small ${R.trangThai === 'TU_CHOI' ? 'signal' : ''}" data-act="reqEdit" data-id="${esc(R.id)}">${ic('edit')}${t(R.trangThai === 'TU_CHOI' ? 'editResubmit' : 'editReq')}</button>` : '',
    canCopy ? `<button type="button" class="btn small" data-act="reqCopy" data-id="${esc(R.id)}">${ic('add')}${t('copyReq')}</button>` : '',
    closeKind ? `<button type="button" class="btn small danger" data-act="reqClose" data-id="${esc(R.id)}" data-kind="${closeKind}">${t(closeKind === 'close' ? 'closeReq' : 'cancelReq')}</button>` : ''
  ].filter(Boolean);
  const tail = (btns.length ? `<div class="links" id="reqBtns">${btns.join('')}</div>` : '') +
    (hist.length ? `<h2 class="sec">${t('history2')}</h2><div class="lich">${hist.map(h => `<span>${esc(h)}</span>`).join('')}</div>` : '');

  if (mode === 'view') {
    main.innerHTML = head + `<h2 class="sec">${t('reqLines')} <span class="count">${R.lines.length}</span></h2>
      <div class="list">${R.lines.map(l => {
        const it = itemOf(l);
        return `<button type="button" class="row" data-act="item" data-id="${esc(l.maVT)}"><div class="row-main">${nameBlock(it)}
          <span class="meta"><span class="plate">${esc(l.maVT)}</span></span>${trio(l, it)}</div>
          <div class="qty"><b>${fmt(showOk ? l.duyet : l.sl)}</b><small>${esc(unitName(it.donVi))}</small></div></button>`;
      }).join('')}</div>${tail}`;
    return;
  }

  if (mode === 'approve') {
    if (!p.A) p.A = { q: R.lines.map(l => String(l.sl)), yk: '' };
    const A = p.A;
    main.innerHTML = head + `
    <form id="f" class="form" novalidate autocomplete="off" style="margin-top:16px">
      <div class="field"><span class="lab">${t('reqLines')} <span class="count">${R.lines.length}</span></span>
      <div class="list">${R.lines.map((l, i) => {
        const it = itemOf(l);
        return `<div class="rq-line"><div class="row-main">${nameBlock(it)}<span class="meta"><span class="plate">${esc(l.maVT)}</span></span>${trio(l, it)}</div>
          <label class="rq-q"><small>${t('qtyApprove')}</small><input class="inp mono" id="fA${i}" inputmode="decimal" autocomplete="off" value="${esc(A.q[i])}"><small>${esc(unitName(it.donVi))}</small></label></div>`;
      }).join('')}</div></div>
      <div class="field"><label for="fYk">${t('approveNote')}</label><input class="inp" id="fYk" value="${esc(A.yk)}" placeholder="${esc(tp('approveNotePh'))}"></div>
      <div class="btn-row"><button type="button" class="btn danger" id="bReject">${t('reject')}</button>
        <button type="submit" class="btn primary" id="fSubmit">${ic('check')}${t('approve')}</button></div>
    </form>${tail}`;
    const sync = () => { R.lines.forEach((l, i) => { A.q[i] = $('#fA' + i).value; }); A.yk = $('#fYk').value; };
    p._sync = sync;
    const decide = async dongY => {
      sync();
      const lines = R.lines.map((l, i) => ({ maVT: l.maVT, duyet: parseQty(A.q[i]) }));
      if (dongY) {
        const bi = lines.findIndex(x => !(x.duyet >= 0));
        if (bi >= 0) { toast(t('errQty0'), 'bad'); $('#fA' + bi).focus(); return; }
        if (!lines.some(x => x.duyet > 0)) return toast(t('errReqEmpty'), 'bad');
      } else if (!A.yk.trim()) { toast(t('errReason'), 'bad'); $('#fYk').focus(); return; }
      const bs = [$('#fSubmit'), $('#bReject')]; bs.forEach(b => { b.disabled = true; });
      try {
        const r = await send('approve', { id: R.id, dongY, lines: dongY ? lines : [], yKien: A.yk.trim() }, { ct: R.congTrinh });
        if (r.data) upsertReq(r.data.request);
        toast(t(dongY ? 'd_APPROVE' : 'd_REJECT', { x: R.id }) + qn(r));
        p.A = null;
        if (NAV.length > 1) goBack(); else render();
      } catch (e) { toast(errMsg(e), 'bad'); bs.forEach(b => { b.disabled = false; }); }
    };
    $('#f').addEventListener('submit', ev => { ev.preventDefault(); decide(true); });
    $('#bReject').addEventListener('click', () => decide(false));
    return;
  }

  // mode === 'issue': thủ kho xuất theo phiếu, mặc định lấy ở vị trí còn nhiều nhất
  const rem = l => Math.round((l.duyet - l.daXuat) * 1000) / 1000;
  const qAt = (it, m) => { const s = (it._locs || []).find(x => x.maViTri === m); return s ? s.soLuong : 0; };
  if (!p.I) {
    p.I = { loc: [], q: [], note: '' };
    R.lines.forEach((l, i) => {
      const best = (itemOf(l)._locs || [])[0], r = rem(l);
      p.I.loc[i] = best ? best.maViTri : '';
      p.I.q[i] = r > 0 && best ? String(Math.min(r, best.soLuong)) : '';
    });
  }
  const I = p.I;
  if (I.nhan === undefined) I.nhan = R.nguoiTao || '';
  main.innerHTML = head + `
  <form id="f" class="form" novalidate autocomplete="off" style="margin-top:16px">
    <h2 class="sec" style="margin:0">${t('issueTitle')}</h2>
    ${R.lines.map((l, i) => {
      const it = itemOf(l), r = rem(l);
      const top = `<div class="row-main">${nameBlock(it)}<span class="meta"><span class="plate">${esc(l.maVT)}</span></span>
        <span class="trio"><span>${t('qtyOk')} <b>${fmt(l.duyet)}</b></span>${l.daXuat ? `<span>${t('qtyOut')} <b>${fmt(l.daXuat)}</b></span>` : ''}<span>${t('qtyLeft')} <b>${fmt(Math.max(r, 0))}</b></span><span>${esc(unitName(it.donVi))}</span></span></div>`;
      if (r <= 0) return `<div class="iss done">${top}<span><span class="pill ok">✓ ${t('issuedAll')}</span></span></div>`;
      if (!(it._locs || []).length) return `<div class="iss">${top}<p class="note" style="margin:0">${t('noStockAny')}</p></div>`;
      return `<div class="iss">${top}
        <div class="two">
          <select class="inp" id="fL${i}" aria-label="${esc(tp('fromLoc'))}">${locOptions(I.loc[i], x => qAt(it, x.maViTri) > 0, m => qAt(it, m), it.donVi)}</select>
          <input class="inp mono" id="fQ${i}" inputmode="decimal" autocomplete="off" value="${esc(I.q[i])}" placeholder="0" aria-label="${esc(tp('quantity'))}">
        </div></div>`;
    }).join('')}
    <p class="help muted" style="margin:0;font-size:12.5px">${t('issueHelp')}</p>
    ${nhanField(I.nhan, 'receiverHelp')}
    <div class="field"><label for="fNote">${t('note')} <span class="muted">(${t('optional')})</span></label><input class="inp" id="fNote" value="${esc(I.note)}"></div>
    <button type="submit" class="btn primary" id="fSubmit">${ic('XUAT')}${t('issueConfirm')}</button>
  </form>${tail}`;
  const sync = () => {
    R.lines.forEach((l, i) => { const a = $('#fL' + i), b = $('#fQ' + i); if (a) I.loc[i] = a.value; if (b) I.q[i] = b.value; });
    I.note = $('#fNote').value;
    I.nhan = $('#fNhan').value;
  };
  p._sync = sync;
  bindNhanSug(I);
  R.lines.forEach((l, i) => {
    const a = $('#fL' + i);
    if (a) a.addEventListener('change', () => { sync(); I.q[i] = a.value ? String(Math.min(rem(l), qAt(itemOf(l), a.value))) : ''; render(); });
  });
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); sync();
    const lines = [];
    for (let i = 0; i < R.lines.length; i++) {
      const l = R.lines[i], it = itemOf(l), el = $('#fQ' + i);
      if (!el) continue;
      const q = parseQty(I.q[i]);
      if (isNaN(q) || q === 0) continue;
      if (q < 0) { toast(t('errQty'), 'bad'); el.focus(); return; }
      if (!I.loc[i]) return toast(t('errNoLoc'), 'bad');
      if (q > rem(l)) return toast(t('errIssueTooMany', { x: l.maVT, n: fmt(rem(l)) }), 'bad');
      if (q > qAt(it, I.loc[i])) return toast(t('errNotEnoughItem', { x: l.maVT, n: fmt(qAt(it, I.loc[i])) }), 'bad');
      lines.push({ maVT: l.maVT, tuViTri: I.loc[i], soLuong: q });
    }
    if (!lines.length) return toast(t('errReqEmpty'), 'bad');
    const nhan = cleanName(I.nhan);
    if (!nhan) { toast(t('errReceiver'), 'bad'); $('#fNhan').focus(); return; }
    const btn = $('#fSubmit'); btn.disabled = true;
    try {
      const r = await send('issue', { id: R.id, lines, ghiChu: I.note.trim(), nguoiNhan: nhan }, { ct: R.congTrinh });
      if (r.data) { updateStockMany(lines.map(x => x.maVT), r.data.stock); upsertReq(r.data.request); }
      addReceiver(nhan);
      toast(t('d_ISSUE', { x: R.id }) + qn(r));
      p.I = null; render(); window.scrollTo(0, 0);
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; }
  });
};

function opDesc(op) {
  const p = op.p || {}, info = op.i || {};
  const itm = (m, q) => {
    const it = S.itemMap.get(String(m || '').toUpperCase());
    return `<span class="okline"><span class="plate">${esc(m)}</span><span>${esc(it ? nm1(it) : '')}</span>${q !== undefined ? `<b class="mono">× ${fmt(q)}</b>` : ''}</span>`;
  };
  const where = (a, b) => (a || b ? `<span class="mono">${esc([a, b].filter(Boolean).join(' → '))}</span>` : '');
  const reqName = id => `<span class="okline">${isTmp(realId(id)) ? '' : `<span class="plate">${esc(realId(id))}</span>`}<span>${esc(info.ct || '')}</span></span>`;
  switch (op.a) {
    case 'txn': return `<b>${t('a_' + p.loai)}</b>${itm(p.maVT, p.soLuong)}${where(p.tuViTri, p.denViTri)}${p.nguoiNhan ? `<span class="okline">${ic('user')}${t('receiver')}: ${esc(p.nguoiNhan)}</span>` : ''}`;
    case 'lend': return `<b>${t('lend')}</b>${itm(p.maVT, p.soLuong)}<span class="who">${ic('user')}${esc(p.nguoiMuon)}</span>`;
    case 'takeBack': return `<b>${t(p.tinhTrang === 'MAT' ? 't_MAT' : 't_TRA')}</b>${itm(info.maVT, p.soLuong)}<span class="who">${ic('user')}${esc(info.who || '')}</span>`;
    case 'request': return `<b>${t('reqNew')}</b><span>${esc(p.congTrinh)}</span>${(p.lines || []).map(x => itm(x.maVT, x.soLuong)).join('')}`;
    case 'editRequest': return `<b>${t('reqEdit')}</b>${reqName(p.id)}${(p.lines || []).map(x => itm(x.maVT, x.soLuong)).join('')}`;
    case 'approve': return `<b>${t(p.dongY === false ? 'reject' : 'approve')}</b>${reqName(p.id)}`;
    case 'issue': return `<b>${t('issueTitle')}</b>${reqName(p.id)}${(p.lines || []).map(x => itm(x.maVT, x.soLuong)).join('')}`;
    case 'closeRequest': return `<b>${t('closeReq')}</b>${reqName(p.id)}`;
  }
  return esc(op.a);
}

    ${!it && can('nhapxuat') ? `<div class="box"><span class="box-title">${t('initialStock')}</span>
      <div class="field"><label for="fVTD">${t('location')}</label><select class="inp" id="fVTD">${locOptions(F.viTriDau)}</select></div>

/* ---------------- In tem QR ---------------- */
let qrReady = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const had = document.querySelector('script[src="' + src + '"]');
    if (had && had.dataset.ok) return res();
    const s = had || document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => { s.dataset.ok = '1'; res(); };
    s.onerror = () => { s.remove(); rej(new Error('load ' + src)); };
    if (!had) document.head.appendChild(s);
  });
}
function ensureQR() {
  if (!qrReady) qrReady = loadScript(LIB_QR).then(() => {
    if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  }).catch(e => { qrReady = null; throw e; });
  return qrReady;
}
function qrSvg(text) {
  if (!window.qrcode) return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/></svg>';
  const q = qrcode(0, 'M'); q.addData(String(text)); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="${esc(text)}"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelHtml(kind, code) {
  if (kind === 'loc') {
    const l = S.locMap.get(code) || { maViTri: code };
    const parts = [l.kho && 'Kho ' + l.kho, l.day && 'Dãy ' + l.day, l.ke && 'Kệ ' + l.ke, l.tang && 'Tầng ' + l.tang].filter(Boolean).join(' · ');
    return `<div class="lbl loc"><div class="lbl-qr">${qrSvg(l.maViTri)}</div><div class="lbl-txt">
      <div class="lbl-code">${esc(l.maViTri)}</div><div class="lbl-spec">${esc(parts)}</div>
      ${l.moTaVI ? `<div class="lbl-vi">${esc(l.moTaVI)}</div>` : ''}${l.moTaZH ? `<div class="lbl-zh">${esc(l.moTaZH)}</div>` : ''}</div></div>`;
  }
  const it = S.itemMap.get(code) || { maVT: code };
  return `<div class="lbl"><div class="lbl-qr">${qrSvg(it.maVT)}</div><div class="lbl-txt">
    <div class="lbl-code">${esc(it.maVT)}</div>${it.tenVI ? `<div class="lbl-vi">${esc(it.tenVI)}</div>` : ''}
    ${it.tenZH ? `<div class="lbl-zh">${esc(it.tenZH)}</div>` : ''}${it.quyCach ? `<div class="lbl-spec">${esc(it.quyCach)}</div>` : ''}</div></div>`;
}

// iPhone (Safari 13 trở lên): tải bằng liên kết download → app Tệp → Tải về. Máy cho phép thì có thêm nút gửi file (Zalo, Mail…).
function saveBlob(blob, name) {
  let file = null;
  try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
  let canShare = false;
  try { canShare = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  S._file = file;
  openSheet(`<h3>${t('fileSaved', { x: name })}</h3><p class="help">${t('fileWhere')}</p><div class="btns">
    ${canShare ? `<button type="button" class="btn" data-act="shareFile">${ic('share')}${t('shareFile')}</button>` : ''}
    <button type="button" class="btn" data-act="sheetClose">${t('close')}</button></div>`);
}
function saveXlsx(wb, name) {
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
  saveBlob(new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name);
}

/* ---------------- Nhập vật tư từ Excel ---------------- */
const XCOLS = ['maVT', 'tenVI', 'tenZH', 'quyCach', 'donVi', 'nhom', 'tonToiThieu', 'barcode', 'viTri', 'soLuongDau', 'ghiChu'];
// Tên cột được nhận (đã bỏ dấu, chữ thường). Tiêu đề file mẫu dạng "Tên tiếng Việt · 越南语名称".
const XALIAS = {
  maVT: ['ma', 'ma vt', 'ma vat tu', 'mavt', 'code', '编码', '物料编码', '代码'],
  tenVI: ['ten tieng viet', 'ten viet', 'ten vi', 'ten', 'ten vat tu', 'ten hang', '越南语名称', '越文名称'],
  tenZH: ['ten tieng trung', 'ten trung', 'ten zh', 'ten tq', 'ten trung quoc', '中文名称', '中文名', '名称'],
  quyCach: ['quy cach', 'thong so', 'quy cach ky thuat', '规格', '规格型号', '型号'],
  donVi: ['don vi', 'dvt', 'don vi tinh', '单位'],
  nhom: ['nhom', 'nhom vat tu', 'loai', '类别', '分类'],
  tonToiThieu: ['ton toi thieu', 'toi thieu', 'min', '最低库存', '最低'],
  barcode: ['ma vach', 'barcode', '条码', '条形码'],
  viTri: ['vi tri', 'ma vi tri', '库位', '位置'],
  soLuongDau: ['so luong dau', 'ton dau', 'so luong', 'sl', 'so luong ton dau', '期初数量', '数量', '期初'],
  ghiChu: ['ghi chu', '备注']
};
const GROUP_ALIAS = {
  dien: ['electrical', '电'], nuoc: ['nuoc', 'cap nuoc', 'thoat nuoc', 'cap thoat nuoc', '水'],
  pccc: ['phong chay', 'chua chay', 'phong chay chua chay'], hvac: ['dieu hoa', 'thong gio', 'dieu hoa thong gio', '暖通', '空调'],
  phukien: ['phu kien', 'vat tu phu', '配件'], dungcu: ['dung cu', 'may', 'dung cu may', '工具', '设备']
};
function xkey(s) { return norm(s).replace(/[*:：()（）\[\]]/g, ' ').replace(/\s+/g, ' ').trim(); }
function xparts(s) { const w = xkey(s); return [w].concat(String(s || '').split(/[·\/|]| - | – /).map(xkey)).filter(Boolean); }
function xlsHeader(cell) {
  const parts = String(cell || '').split(/[·\n\/|]| - /).map(xkey).filter(Boolean);
  return XCOLS.find(k => parts.some(pt => XALIAS[k].includes(pt))) || null;
}
function xlsVal(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isFinite(v) ? String(Math.round(v * 1e6) / 1e6) : '';
  if (typeof v === 'boolean') return v ? '1' : '0';
  if (v instanceof Date) return ymd(v);
  return String(v).replace(/ /g, ' ').trim();
}
// Nhóm, đơn vị: nhận mã, chữ Việt hoặc chữ Trung (cai / cái / 个, dien / Điện / 电气)
function mapGroup(v) {
  const ps = xparts(v);
  if (!ps.length) return '';
  for (const k of Object.keys(GROUPS)) {
    const g = GROUPS[k], ok = [k, TIEN_TO[k].toLowerCase(), xkey(g[0]), xkey(g[1]), xkey(g[0] + ' ' + g[1])].concat(GROUP_ALIAS[k]);
    if (ps.some(x => ok.includes(x))) return k;
  }
  return null;
}
function mapUnit(v) {
  const ps = xparts(v);
  if (!ps.length) return '';
  for (const k of Object.keys(UNITS)) {
    const ok = [k, xkey(UNITS[k][0]), xkey(UNITS[k][1]), xkey(UNITS[k][0] + ' ' + UNITS[k][1])];
    if (ps.some(x => ok.includes(x))) return k;
  }
  return String(v).trim().slice(0, 20);   // đơn vị khác: giữ nguyên chữ
}
function groupOfCode(code) { const m = /^([A-Z]+)-\d+$/.exec(code || ''); return m ? (Object.keys(TIEN_TO).find(k => TIEN_TO[k] === m[1]) || '') : ''; }
// Giống máy chủ: vật tư không ghi mã mà trùng tên + quy cách với vật tư đã có thì là cập nhật
function nameKey(vi, zh, qc) { const s = x => String(x || '').trim().toLowerCase().replace(/\s+/g, ' '); return (s(vi) || s(zh)) + '|' + s(qc); }
function codeNorm(v) { return String(v || '').trim().replace(/^[=+@]+/, '').toUpperCase().replace(/\s+/g, '-').slice(0, 40); }

function xlsFind(wb) {
  for (const name of wb.SheetNames) {
    if (/huong dan|说明/.test(xkey(name))) continue;
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) continue;
    const r0 = XLSX.utils.decode_range(ws['!ref']).s.r;
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true });
    for (let i = 0; i < Math.min(aoa.length, 10); i++) {
      const map = {};
      (aoa[i] || []).forEach((c, j) => { const k = xlsHeader(c); if (k && !(k in map)) map[k] = j; });
      if (Object.keys(map).length < 2 || !('tenVI' in map || 'tenZH' in map || 'maVT' in map)) continue;
      const rows = [];
      for (let r = i + 1; r < aoa.length; r++) {
        const line = aoa[r] || [], o = { dong: r0 + r + 1 };
        let any = false;
        XCOLS.forEach(k => { o[k] = k in map ? xlsVal(line[map[k]]) : ''; if (o[k]) any = true; });
        if (any) rows.push(o);
      }
      return { sheet: name, rows };
    }
  }
  return null;
}

// Kiểm tra từng dòng trên máy (giống máy chủ) để xem trước: mới / cập nhật / không đổi / lỗi
function xlsCheck(rows) {
  const P = { rows: [], moi: 0, sua: 0, giu: 0, loi: [], total: rows.length };
  const byCode = new Map(S.items.map(i => [i.maVT.toUpperCase(), i]));
  const byName = new Map(), byBar = new Map(), seen = new Map(), seenName = new Map(), next = {};
  S.items.forEach(i => {
    const k = nameKey(i.tenVI, i.tenZH, i.quyCach);
    if (!byName.has(k)) byName.set(k, i);
    if (i.barcode) byBar.set(i.barcode.toUpperCase(), i.maVT.toUpperCase());
    const m = /^([A-Z]+)-(\d+)$/.exec(i.maVT.toUpperCase());
    if (m) next[m[1]] = Math.max(next[m[1]] || 0, +m[2]);
  });
  const num = v => {
    if (v === '') return null;
    const n = parseQty(v);
    if (!isFinite(n) || n < 0) throw ['xe_SO_LUONG'];
    return Math.round(n * 1000) / 1000;
  };
  for (const r of rows) {
    try {
      const x = { dong: r.dong, maVT: codeNorm(r.maVT), tenVI: r.tenVI.slice(0, 150), tenZH: r.tenZH.slice(0, 150), quyCach: r.quyCach.slice(0, 150),
        donVi: '', nhom: '', tonToiThieu: null, barcode: r.barcode.slice(0, 60), viTri: r.viTri.toUpperCase(), soLuongDau: null, ghiChu: r.ghiChu.slice(0, 300) };
      if (r.nhom) { x.nhom = mapGroup(r.nhom); if (!x.nhom) throw ['xe_NHOM_LA', r.nhom]; }
      if (r.donVi) x.donVi = mapUnit(r.donVi);
      x.tonToiThieu = num(r.tonToiThieu);
      x.soLuongDau = num(r.soLuongDau);
      const nk = !x.maVT && (x.tenVI || x.tenZH) ? nameKey(x.tenVI, x.tenZH, x.quyCach) : '';
      const it = x.maVT ? byCode.get(x.maVT) : (nk ? byName.get(nk) : null);
      const bar = x.barcode.toUpperCase();
      const barClash = code => bar && ((byBar.has(bar) && byBar.get(bar) !== code) || (byCode.has(bar) && bar !== code) || S.locMap.has(bar));
      if (it) {
        const code = it.maVT.toUpperCase();
        if (seen.has(code)) throw ['xe_TRUNG_FILE', seen.get(code)];
        if (barClash(code)) throw ['xe_TRUNG_BARCODE', x.barcode];
        seen.set(code, x.dong);
        const doi = ['tenVI', 'tenZH', 'quyCach', 'nhom', 'donVi', 'ghiChu', 'barcode'].some(k => x[k] && x[k] !== (it[k] || '')) ||
          (x.tonToiThieu !== null && x.tonToiThieu !== (it.tonToiThieu || 0));
        if (doi) { P.rows.push({ kind: 'sua', x, code, it, skipInit: x.soLuongDau > 0 }); P.sua++; if (bar) byBar.set(bar, code); }
        else { P.rows.push({ kind: 'giu', x, code, it }); P.giu++; }
        continue;
      }
      if (x.maVT && seen.has(x.maVT)) throw ['xe_TRUNG_FILE', seen.get(x.maVT)];
      if (nk && seenName.has(nk)) throw ['xe_TRUNG_FILE', seenName.get(nk)];
      if (!x.tenVI && !x.tenZH) throw ['xe_THIEU_TEN'];
      const nh = x.nhom || groupOfCode(x.maVT);
      if (!nh) throw ['xe_THIEU_NHOM'];
      if (!x.donVi) throw ['xe_THIEU_DON_VI'];
      if (x.maVT && S.locMap.has(x.maVT)) throw ['xe_TRUNG_MA', x.maVT];
      if (x.soLuongDau > 0) {
        if (!x.viTri) throw ['xe_THIEU_VITRI'];
        if (!S.locMap.has(x.viTri)) throw ['xe_KHONG_CO_VITRI', x.viTri];
      }
      const tt = TIEN_TO[nh] || 'VT';
      const code = x.maVT || tt + '-' + String((next[tt] || 0) + 1).padStart(4, '0');
      if (barClash(code)) throw ['xe_TRUNG_BARCODE', x.barcode];
      const m = /^([A-Z]+)-(\d+)$/.exec(code);
      if (m) next[m[1]] = Math.max(next[m[1]] || 0, +m[2]);
      seen.set(code, x.dong);
      if (nk) seenName.set(nk, x.dong);
      if (bar) byBar.set(bar, code);
      P.rows.push({ kind: 'moi', x, code, auto: !x.maVT, nhom: nh });
      P.moi++;
    } catch (e) {
      if (!Array.isArray(e)) throw e;
      P.loi.push({ dong: r.dong, k: e[0], x: e[1] || '' });
    }
  }
  return P;
}

async function xlsRead(p, file) {
  p.P = null; p.R = null; p.reading = true;
  render();
  try {
    try { await ensureXLSX(); } catch (e) { throw { tk: 'network' }; }
    let found;
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: true, codepage: 65001 });
      found = xlsFind(wb);
    } catch (e) { throw { tk: 'xlsBadFile' }; }
    if (!found) throw { tk: 'xlsNoHeader' };
    if (found.rows.length > 5000) throw { tk: 'xlsTooMany' };
    p.P = xlsCheck(found.rows);
    p.P.file = file.name; p.P.sheet = found.sheet;
  } catch (e) {
    p.P = null;
    toast(e && e.tk ? t(e.tk) : t('errGeneric', { x: String(e && e.message || e) }), 'bad');
  }
  p.reading = false;
  if (cur().p === p) render();
}
function xlsRowHtml(r) {

    <span class="nm">${esc(vi || zh)}</span>${vi && zh && zh !== vi ? `<span class="nm2" lang="zh-CN">${esc(zh)}</span>` : ''}
    <span class="meta">${qc ? `<span>${esc(qc)}</span>` : ''}${dv ? `<span>${esc(unitName(dv))}</span>` : ''}${nh ? `<span>${esc(grpName(nh))}</span>` : ''}</span>
    ${r.kind === 'moi' && x.soLuongDau > 0 ? `<span class="meta"><span class="pill ok wrap">${t('xlsInit', { n: fmt(x.soLuongDau), x: x.viTri })}</span></span>` : ''}
    ${r.skipInit ? `<span class="help">${t('xlsInitSkip')}</span>` : ''}
  </div></div>`;
}
function xlsSum(o, errs) {
  return `<div class="xls-sum"><span class="pill ok">${t('xlsNew')} <b>${o.moi}</b></span><span class="pill move">${t('xlsUpd')} <b>${o.sua}</b></span>
    ${o.giu !== undefined ? `<span class="pill grey">${t('xlsSame')} <b>${o.giu}</b></span>` : ''}${errs ? `<span class="pill bad">${t('xlsErr')} <b>${errs}</b></span>` : ''}</div>`;
}
function xlsErrRows(list, txt) {
  return `<div class="list err-list">${list.slice(0, 50).map(e => `<div class="row"><div class="row-main"><span class="nm">${t('xlsRow', { n: e.dong })}</span>
    <span class="nm2">${txt(e)}</span></div></div>`).join('')}</div>${list.length > 50 ? `<p class="help">${t('xlsMore', { n: list.length - 50 })}</p>` : ''}`;
}

// Cập nhật danh mục trên máy theo kết quả máy chủ
function mergeItems(items, stock) {
  const B = S.base;
  (items || []).forEach(it => {
    const i = B.items.findIndex(x => x.maVT.toUpperCase() === it.maVT.toUpperCase());
    if (i >= 0) B.items[i] = it; else B.items.push(it);
  });
  if (stock && stock.length) {
    const ks = [...new Set(stock.map(s => s.maVT))];
    B.stock = B.stock.filter(s => !ks.includes(s.maVT)).concat(stock);
  }
  commit();
}
async function xlsGo(p) {
  const P = p.P;
  if (!P || p.busy || needNet()) return;
  const rows = P.rows.filter(r => r.kind === 'moi' || r.kind === 'sua').map(r => r.x);
  if (!rows.length) return;
  p.busy = true;
  const R = { moi: 0, sua: 0, loi: [] };
  const btn = $('#xlsGo');
  if (btn) btn.disabled = true;
  let done = 0;
  try {
    for (let i = 0; i < rows.length; i += 200) {
      const chunk = rows.slice(i, i + 200);
      if (btn) btn.innerHTML = t('xlsProgress', { a: fmt(i), b: fmt(rows.length) });
      const r = await api('importItems', { rows: chunk }, { timeout: 120 });
      R.moi += r.moi; R.sua += r.sua; R.loi = R.loi.concat(r.loi || []);
      mergeItems(r.items, r.stock);
      done = i + chunk.length;
    }
    p.P = null;
    toast(t('xlsDone', { a: R.moi, b: R.sua }));
  } catch (e) {
    Object.assign(R, { cut: done, total: rows.length, errCode: e && e.code, errText: errMsg(e).replace(/<[^>]+>/g, ' ') });
    if (done) p.P = null;
    toast(e && e.code === 'MANG' ? t('xlsPartial', { a: done, b: rows.length }) : errMsg(e), 'bad');
  }
  p.R = R; p.busy = false;
  if (cur().p === p) { render(); window.scrollTo(0, 0); }
}

function photoUrl(id, w) {
  if (DEMO && typeof DemoBackend !== 'undefined' && DemoBackend.photo) { const d = DemoBackend.photo(id); if (d) return d; }
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;
}
// Thu nhỏ ảnh trên máy trước khi gửi: cạnh dài tối đa 1024px, JPEG chất lượng 0.7 (khoảng 100–250KB)
async function shrinkImage(file, max, q) {
  let src = null, bmp = null;
  if (window.createImageBitmap) { try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = null; } }
  if (bmp) src = bmp;
  else {
    src = await new Promise((res, rej) => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
      im.src = u;
    });
  }
  const w = src.naturalWidth || src.width, hh = src.naturalHeight || src.height;
  if (!w || !hh) throw new Error('size');
  const k = Math.min(1, max / Math.max(w, hh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(hh * k));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  if (bmp && bmp.close) bmp.close();
  const url = c.toDataURL('image/jpeg', q);
  return url.slice(url.indexOf(',') + 1);
}
async function photoPick(maVT, file) {
  if (needNet()) return;
  let b64;
  try { b64 = await shrinkImage(file, 1024, 0.7); } catch (e) { return toast(t('photoBad'), 'bad'); }
  toast(t('photoUploading'));
  try {
    const r = await api('saveItemPhoto', { maVT, base64: b64 }, { timeout: 90 });
    mergeItems([r.item]);
    toast(t('photoSaved'));
    if (cur().v === 'item') render();
  } catch (e) { toast(netErr(e), 'bad'); }
}

const SC = { q: null, cb: null, gen: 0, done: false };
function scanLib() {
  const w = window, L2 = w.__Html5QrcodeLibrary__ || {};
  return { Q: w.Html5Qrcode || L2.Html5Qrcode, F: w.Html5QrcodeSupportedFormats || L2.Html5QrcodeSupportedFormats };
}
function scanCfg(F) {
  const c = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
  if (F) c.formatsToSupport = ['QR_CODE', 'CODE_128', 'CODE_39', 'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'ITF', 'DATA_MATRIX'].map(k => F[k]).filter(v => v !== undefined);
  return c;
}
async function openScanner(cb) {
  SC.cb = cb; SC.done = false; const gen = ++SC.gen;
  $('#scanner').hidden = false; document.body.classList.add('noscroll');
  $('#scanTitle').innerHTML = t('scanTitle');
  $('#scanClose').innerHTML = ic('close'); $('#scanClose').setAttribute('aria-label', tp('close'));
  $('#scanPhotoBtn').innerHTML = ic('camera') + t('scanPhoto');
  $('#scanCode').value = ''; $('#scanCode').placeholder = tp('scanManual');
  const msg = $('#scanMsg'), reader = $('#reader');
  if (IS_PREVIEW || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    reader.hidden = true; msg.innerHTML = IS_PREVIEW ? t('scanPreview') : t('scanNoCam'); return;
  }
  reader.hidden = false; msg.innerHTML = t('loading');
  try {
    await loadScript(LIB_SCAN);
    if (gen !== SC.gen) return;
    const { Q, F } = scanLib();
    const q = new Q('reader', scanCfg(F));
    SC.q = q;
    await q.start({ facingMode: 'environment' }, {
      fps: 10, aspectRatio: 1.333,
      qrbox: (w, h) => ({ width: Math.floor(Math.min(w, 360) * 0.85), height: Math.floor(Math.min(h, 360) * 0.6) })
    }, text => gotCode(text), () => {});
    if (gen !== SC.gen) { stopLive(); return; }
    msg.innerHTML = t('scanHint');
  } catch (e) {
    if (gen !== SC.gen) return;
    SC.q = null; reader.hidden = true; msg.innerHTML = t('scanNoCam');
  }
}
function stopLive() {
  const q = SC.q; SC.q = null;
  if (q) { try { q.stop().then(() => q.clear()).catch(() => {}); } catch (e) { /* bỏ qua */ } }
}
function closeScanner() {

  $('#scanner').hidden = true; document.body.classList.remove('noscroll');
}
function gotCode(text) {
  if (SC.done) return;
  const code = String(text || '').trim();
  if (!code) return;
  SC.done = true;
  try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* bỏ qua */ }
  const cb = SC.cb; closeScanner();
  if (cb) cb(code);
}

/* ---------------- iPhone: chạm vào ô nhập phải mở được bàn phím ---------------- */
// iOS chỉ mở bàn phím khi ô được focus ngay trong lần chạm. Nếu ô đang "kẹt" (có focus mà không có bàn phím)
// thì chạm lại không có tác dụng → nhả focus lúc bắt đầu chạm, rồi focus lại khi nhấc tay.
const TEXT_IN = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=date]):not([disabled]):not([readonly]),textarea';
function kbOpen() { const v = window.visualViewport; return !!v && v.height < window.innerHeight * 0.8; }
const TAP = { el: null, x: 0, y: 0 };
document.addEventListener('touchstart', e => {
  const el = e.target.closest ? e.target.closest(TEXT_IN) : null;
  TAP.el = el;
  if (!el) return;
  const p = e.touches[0]; TAP.x = p.clientX; TAP.y = p.clientY;
  if (el === document.activeElement && !kbOpen()) el.blur();
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!TAP.el) return;
  const p = e.touches[0];
  if (Math.abs(p.clientX - TAP.x) > 10 || Math.abs(p.clientY - TAP.y) > 10) TAP.el = null;   // đang cuộn, không phải chạm
}, { passive: true });
document.addEventListener('touchend', () => {
  const el = TAP.el; TAP.el = null;
  if (el && el.isConnected && el !== document.activeElement) { try { el.focus(); } catch (err) { /* bỏ qua */ } }
}, { passive: true });
// Mở lại app từ nền (iOS hay làm ô nhập "chết"): nhả focus và vẽ lại màn hình hiện tại
let hiddenAt = 0;
function resumeApp() {
  const a = document.activeElement; if (a && a.blur && a !== document.body) a.blur();
  if (!$('#scanner').hidden || $('#sheetRoot').firstChild) return;
  const p = cur().p || {};
  try { if (p._sync) p._sync(); if (p.F && p.F._sync) p.F._sync(); } catch (err) { /* bỏ qua */ }
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 1000) {
    resumeApp();
    if (S.me && (S.offline || waitingOps().length)) reconnect(false, true);
  }
  hiddenAt = 0;
});
window.addEventListener('pageshow', e => { if (e.persisted) resumeApp(); });

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, ev);
});

function registerSW() {
  if (IS_PREVIEW || DEMO || !('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(() => { /* chưa tải sw.js lên: app vẫn chạy khi có mạng */ });
}
(async function boot() {
  NAV.push({ v: 'login', p: {} });
  S.Q = pjson('kho_q') || [];
  const tk = stor('s', 'kho_tk');
  if (tk) {
    S.token = tk;
    try { S.sessionMe = JSON.parse(stor('s', 'kho_me') || 'null'); } catch (e) { S.sessionMe = null; }
    const toHome = () => { NAV.length = 0; NAV.push({ v: 'home', p: {} }); poke(); };
    try { await loadData(); toHome(); if (waitingOps().length) flush(); }
    catch (e) {
      // Mất mạng lúc mở lại app: dùng dữ liệu lưu trên máy, có mạng sẽ tự cập nhật
      if (e.code === 'MANG' && S.sessionMe && useSnap()) toHome();
      else { S.token = null; S.sessionMe = null; stor('s', 'kho_tk', null); NAV.length = 0; NAV.push({ v: 'login', p: {} }); }
    }
  }
  render();
  registerSW();
})();
setInterval(() => { if (S.me && !document.hidden && (S.offline || waitingOps().length)) reconnect(); }, SYNC_SEC * 1000);
window.addEventListener('online', () => { if (S.me) reconnect(true, true); });
</script>
</body>
